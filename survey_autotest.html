        id:"1-1", label_en:"Rubric 1", label_ko:"기준표 1", d1pts:40, d2pts:60,

        d1:[
          {id:"1-1-1-1",pts:10,en:"Item 1. History of Presenting Illness (structured): Systematically elicits onset, duration, progression, severity, and character of the presenting symptoms (fever, abdominal pain, dysuria), including temporal sequence (e.g., flank pain emerging later) and aggravating/relieving factors.",ko:"항목 1. 현병력(구조화된 청취): 발현 증상(발열, 복통, 배뇨통)의 발병, 지속 시간, 진행, 중증도, 양상을 체계적으로 청취하며, 시간적 순서(예: 옆구리 통증의 후발)와 악화/완화 요인을 포함한다.",xEn:"This is the backbone of any history and the single most informative general element, so it carries the highest general-domain weight. A clear illness timeline (2 days of fever, with new same-day flank pain) is what frames the entire differential.",xKo:"이것은 모든 병력 청취의 근간이며 가장 정보량이 많은 일반 항목이므로 일반 영역에서 가장 높은 가중치를 갖는다. 명확한 질병 경과(2일간의 발열과 당일 새로 나타난 옆구리 통증)는 전체 감별진단의 틀을 형성한다."},
          {id:"1-1-1-2",pts:7,en:"Item 2. Targeted Review of Systems & Pertinent Negatives: Screens related systems (GI, respiratory, ENT, skin, neuro) to surface positives and clinically meaningful negatives.",ko:"항목 2. 표적 계통 문진 및 관련 음성 소견: 관련 계통(소화기, 호흡기, 이비인후, 피부, 신경)을 선별하여 양성 소견과 임상적으로 의미 있는 음성 소견을 드러낸다.",xEn:"Pertinent negatives here (no vomiting/diarrhea, no cough/sore throat, no rash) actively narrow the source of fever toward the urinary tract, so this is weighted above the remaining general items.",xKo:"이 사례에서 관련 음성 소견(구토/설사 없음, 기침/인후통 없음, 발진 없음)은 발열의 원인을 적극적으로 비뇨기계로 좁히므로, 나머지 일반 항목보다 높은 가중치를 부여한다."},
          {id:"1-1-1-3",pts:4,en:"Item 3. Past Medical & Surgical History: Prior illnesses, hospitalizations, chronic conditions, and prior surgical/urologic procedures.",ko:"항목 3. 과거 병력 및 수술력: 이전 질환, 입원력, 만성 질환, 이전 수술 또는 비뇨기과 시술.",xEn:"Essential for context and to flag predisposing conditions, but lower yield than the HPI; modest weight reflects that this case has an unremarkable background.",xKo:"맥락 파악과 소인이 되는 질환을 발견하는 데 필수적이지만, 현병력보다는 정보 수율이 낮다. 본 사례의 배경이 특이사항 없는 점을 반영하여 적당한 가중치를 부여한다."},
          {id:"1-1-1-4",pts:4,en:"Item 4. Medications & Allergies: Current/recent medications (including recent antibiotic courses) and documented drug allergies.",ko:"항목 4. 복용 약물 및 알레르기: 현재/최근 복용 약물(최근의 항생제 사용 포함) 및 기록된 약물 알레르기.",xEn:"Directly relevant because recent antibiotics affect culture interpretation and resistance risk, and allergies constrain antibiotic choice — but it is a brief, bounded inquiry.",xKo:"최근 항생제 사용은 배양 해석과 내성 위험에 영향을 미치고, 알레르기는 항생제 선택을 제한하므로 직접적으로 관련된다 — 그러나 간단하고 한정된 질문이다."},
          {id:"1-1-1-5",pts:3,en:"Item 5. Immunization Status: Confirms up-to-date vaccination.",ko:"항목 5. 예방접종 상태: 최신 예방접종 여부 확인.",xEn:"A core pediatric history element that helps gauge invasive-bacterial-illness risk; low weight because it rarely alters management in an otherwise well-appearing, fully immunized child.",xKo:"침습성 세균감염 위험을 가늠하는 데 도움이 되는 핵심 소아 병력 항목이지만, 외관상 양호하고 예방접종이 완료된 아동에서는 치료 방향을 거의 바꾸지 않으므로 낮은 가중치를 부여한다."},
          {id:"1-1-1-6",pts:3,en:"Item 6. Birth & Developmental History: Perinatal course, prematurity, and developmental trajectory appropriate to age.",ko:"항목 6. 출생력 및 발달력: 주산기 경과, 미숙아 여부, 연령에 따른 발달 궤적.",xEn:"Standard component of a complete pediatric history; weighted low here because it is lower-yield in a 6-year-old (the urologically relevant antenatal findings are credited in Domain 2).",xKo:"완전한 소아 병력 청취의 표준 구성 요소이지만, 6세 아동에서는 정보 수율이 낮아 가중치를 낮게 부여한다(비뇨기 관련 산전 소견은 영역 2에서 평가)."},
          {id:"1-1-1-7",pts:3,en:"Item 7. Family History (general): Heritable conditions and relevant family medical background.",ko:"항목 7. 가족력(일반): 유전 가능한 질환 및 관련 가족 의학 배경.",xEn:"A baseline competency; the urologically specific familial questions (VUR, renal disease) are scored under Domain 2 to avoid double-counting, so the general item is weighted modestly.",xKo:"기본 역량이며, 비뇨기 특이 가족력 질문(방광요관역류, 신장질환)은 중복 채점을 피하기 위해 영역 2에서 평가하므로, 일반 항목은 적당한 가중치를 부여한다."},
          {id:"1-1-1-8",pts:3,en:"Item 8. Social History & Caregiver/School Context: Home environment, caregivers, and daycare/school setting.",ko:"항목 8. 사회력 및 보호자/학교 환경: 가정 환경, 보호자, 어린이집/학교 환경.",xEn:"Provides context and surfaces behavioral exposures (e.g., school routines); weighted low as a general item, with the case-relevant behavioral detail rewarded in Domain 2.",xKo:"맥락을 제공하고 행동 노출(예: 학교 루틴)을 드러내며, 일반 항목으로서는 낮게 가중치를 부여한다. 사례 관련 행동 세부사항은 영역 2에서 평가한다."},
          {id:"1-1-1-9",pts:3,en:"Item 9. Collateral History & Developmentally-Appropriate Communication: Obtains history from the caregiver and, age-appropriately, directly from the child; organized, empathetic questioning.",ko:"항목 9. 보호자 병력 청취 및 발달 수준에 맞는 의사소통: 보호자로부터 병력을 청취하며, 연령에 적절하게 아동으로부터도 직접 청취한다. 체계적이고 공감적인 질문.",xEn:"A distinctly pediatric skill — children are partial historians and caregivers fill the gaps — so it is explicitly assessed, though kept modest within a content-focused rubric.",xKo:"소아과만의 고유한 기술 — 아동은 부분적인 정보 제공자이고 보호자가 빈틈을 채워줌 — 이므로 명시적으로 평가하되, 내용 중심의 평가 기준에서 적당한 비중을 유지한다."},
        ],
        d2:[
          {id:"1-1-2-1",pts:11,en:"Item 1. Localization of Tract Involvement (upper vs. lower): Elicits features distinguishing pyelonephritis from cystitis — flank/back pain, high/persistent fever, rigors or shaking chills, and degree of systemic illness.",ko:"항목 1. 요로 침범 부위 국소화(상부 vs 하부): 신우신염과 방광염을 구별하는 특징을 청취 — 옆구리/허리 통증, 고열/지속열, 오한 또는 떨림, 전신 증상의 정도.",xEn:"This is the pivotal reasoning step in the case (high fever + flank pain points to upper-tract disease), with direct implications for treatment intensity and follow-up, so it is weighted highest in the entire rubric.",xKo:"이 사례의 핵심 추론 단계(고열 + 옆구리 통증은 상부 요로 질환을 시사)이며, 치료 강도와 추적 관찰에 직접적인 영향을 미치므로 전체 평가 기준에서 가장 높은 가중치를 부여한다."},
          {id:"1-1-2-2",pts:9,en:"Item 2. Detailed Urinary Symptom Inventory: Dysuria, frequency, urgency, hematuria, urine color/odor/clarity, and new daytime incontinence or secondary enuresis.",ko:"항목 2. 상세한 비뇨기 증상 평가: 배뇨통, 빈뇨, 요급, 혈뇨, 소변 색/냄새/혼탁도, 새로 나타난 주간 요실금 또는 이차성 야뇨증.",xEn:"These symptoms establish the urinary tract as the source and gauge severity; weighted second-highest because they are the most specific localizing data the history can provide.",xKo:"이러한 증상은 비뇨기계가 원인임을 확립하고 중증도를 가늠하며, 병력에서 가장 특이도 높은 국소화 정보이므로 두 번째로 높은 가중치를 부여한다."},
          {id:"1-1-2-3",pts:7,en:"Item 3. Voiding Habits & Dysfunction: Voiding frequency, holding/postponement behaviors, urgency-deferral, and sense of incomplete emptying.",ko:"항목 3. 배뇨 습관 및 기능 이상: 배뇨 빈도, 참거나 미루는 행동, 요급 시 지연, 잔뇨감.",xEn:"Dysfunctional/infrequent voiding is a major and commonly-overlooked UTI risk factor (and the vignette signals it — she postpones voiding at school), so explicit inquiry is meaningfully rewarded.",xKo:"기능 이상이 있거나 빈도가 낮은 배뇨는 주요하고 자주 간과되는 요로감염 위험 인자이며(본 사례에서도 학교에서 배뇨를 미루는 행동이 시사됨), 명시적인 질문에 의미 있는 점수를 부여한다."},
          {id:"1-1-2-4",pts:6,en:"Item 4. Bowel Habits & Constipation: Stool frequency, consistency, withholding, and soiling.",ko:"항목 4. 배변 습관 및 변비: 배변 빈도, 굳기, 변 참기, 변실금.",xEn:"Constipation is a leading, frequently-missed contributor to bladder dysfunction and recurrent UTI in children; rewarding it identifies the more sophisticated history-takers.",xKo:"변비는 소아에서 방광 기능 이상과 재발성 요로감염의 주요하지만 자주 놓치는 기여 인자이며, 이 항목을 평가하면 더 정교한 병력 청취자를 식별할 수 있다."},
          {id:"1-1-2-5",pts:7,en:"Item 5. Risk Factors for UTI & Underlying CAKUT: Prior UTIs/recurrent unexplained febrile illness, antenatal renal ultrasound findings (e.g., hydronephrosis), known structural anomaly, and family history of vesicoureteral reflux or renal disease.",ko:"항목 5. 요로감염 위험인자 및 기저 신장요로 기형(CAKUT): 이전 요로감염/반복적 원인 미상 발열, 산전 신장 초음파 소견(예: 수신증), 알려진 구조적 기형, 방광요관역류 또는 신장 질환의 가족력.",xEn:"A first febrile UTI should prompt consideration of an underlying urinary-tract abnormality and downstream imaging/referral; this forward-looking reasoning warrants substantial weight even when the background is reassuring.",xKo:"첫 발열성 요로감염은 기저 요로 이상에 대한 고려와 후속 영상검사/의뢰를 유도해야 하며, 배경이 안심되더라도 이러한 선제적 추론은 상당한 가중치를 받을 만하다."},
          {id:"1-1-2-6",pts:6,en:"Item 6. Hydration, Oral Tolerance & Urine Output: Fluid intake, vomiting limiting oral intake, and reduced urine output or signs of dehydration.",ko:"항목 6. 수분 상태, 경구 섭취 및 소변량: 수분 섭취, 경구 섭취를 제한하는 구토, 감소된 소변량 또는 탈수 징후.",xEn:"This information drives disposition — oral vs. IV antibiotics and discharge vs. admission — making it high-value despite being a general-sounding line of questioning.",xKo:"이 정보는 치료 결정(경구 vs 정맥 항생제, 퇴원 vs 입원)을 좌우하므로, 일반적으로 들리는 질문이지만 가치가 높다."},
          {id:"1-1-2-7",pts:6,en:"Item 7. Genitourinary Differential & Local Factors: Vaginal discharge or irritation, hygiene practices, irritant exposures (e.g., bubble baths), pinworm symptoms, and — handled sensitively and age-appropriately — safeguarding considerations.",ko:"항목 7. 비뇨생식기 감별 및 국소 요인: 질 분비물 또는 자극, 위생 습관, 자극 물질 노출(예: 거품 목욕), 요충 증상, 그리고 — 민감하고 연령에 적절히 다루어 — 아동 보호 관련 고려사항.",xEn:"Dysuria in a young girl has a real differential beyond UTI, and thorough, sensitive history here both refines the diagnosis and reflects safe pediatric practice; weighted moderately given the otherwise clear infectious picture.",xKo:"어린 여아의 배뇨통은 요로감염 외에도 실질적인 감별진단이 있으며, 이 부분에 대한 철저하고 민감한 병력 청취는 진단을 정교화하고 안전한 소아 진료를 반영한다. 비교적 명확한 감염 양상을 고려하여 중간 정도의 가중치를 부여한다."},
          {id:"1-1-2-8",pts:4,en:"Item 8. Abdominal & Systemic Differential Exclusion: Targeted questions to exclude alternative abdominal pathology (e.g., appendicitis: right-lower-quadrant migration, anorexia, pain-before-vomiting) and gynecologic causes.",ko:"항목 8. 복부 및 전신 감별진단 배제: 대안적 복부 병리(예: 충수염: 우하복부로의 이동, 식욕부진, 통증 후 구토) 및 부인과적 원인을 배제하기 위한 표적 질문.",xEn:"Abdominal pain plus fever mandates ruling out a surgical abdomen; weighted lower than the urinary items because the symptom pattern already favors a urinary source, but omission is a clinically important gap.",xKo:"복통과 발열은 외과적 복통의 배제를 요구한다. 증상 양상이 이미 비뇨기 원인을 시사하므로 비뇨기 항목보다 가중치는 낮지만, 누락 시 임상적으로 중요한 결함이 된다."},
          {id:"1-1-2-9",pts:4,en:"Item 9. Red Flags for Urosepsis & Severity Assessment: Lethargy, decreased activity or feeding, persistent rigors, and parental sense of clinical deterioration.",ko:"항목 9. 요로패혈증 적신호 및 중증도 평가: 무기력, 활동 또는 섭식 감소, 지속적 오한, 보호자가 인지하는 임상적 악화.",xEn:"Identifying the deteriorating child is essential for safe triage; weighted as a focused safety net rather than a major scoring block because the vignette describes a stable, only-mildly-ill child.",xKo:"악화되는 아동을 식별하는 것은 안전한 진료 분류에 필수적이다. 본 사례가 안정적이고 경미한 증상의 아동을 기술하므로, 주요 채점 영역이 아닌 집중된 안전망으로서의 가중치를 부여한다."},
        ],

      {
        id:"1-2", label_en:"Rubric 2", label_ko:"기준표 2", d1pts:40, d2pts:60,
        d1desc_en:"General Clinical History-Taking",
        d1desc_ko:"일반 임상 병력 청취",
        d2desc_en:"Case-Specific Diagnostic History — Febrile Urinary Tract Infection / Suspected Pyelonephritis",
        d2desc_ko:"사례 특이 진단적 병력 청취 — 발열성 요로감염 / 신우신염 의심",
        d1:[
          {id:"1-2-1-1",pts:5,en:"Item 1. Chief Complaint and Symptom Clarification: Elicits the primary concerns (fever, abdominal pain, dysuria) and clarifies the patient's and caregiver's understanding of the problem.",ko:"항목 1. 주 호소 및 증상 명확화: 주된 우려사항(발열, 복통, 배뇨통)을 청취하고 환자 및 보호자의 문제에 대한 이해를 명확히 한다.",xEn:"Establishes the agenda of the encounter and ensures the clinician accurately identifies the presenting concerns before proceeding to diagnostic questioning.",xKo:"진료의 의제를 설정하고 임상의가 진단 질문으로 진행하기 전에 발현 증상을 정확히 식별하도록 보장한다."},
          {id:"1-2-1-2",pts:10,en:"Item 2. History of Presenting Illness (Chronology and Symptom Analysis): Obtains a structured history of symptom onset, duration, progression, severity, timing, and associated features using a systematic approach.",ko:"항목 2. 현병력(시간 경과 및 증상 분석): 체계적인 접근법을 사용하여 증상의 발병, 지속 시간, 진행, 중증도, 시점 및 동반 특징에 대한 구조화된 병력을 청취한다.",xEn:"The HPI is the foundation of clinical reasoning. In an emergency setting, understanding symptom evolution is critical for determining severity and urgency.",xKo:"현병력은 임상적 추론의 근간이다. 응급 상황에서 증상의 진행을 이해하는 것은 중증도와 긴급성을 결정하는 데 중요하다."},
          {id:"1-2-1-3",pts:5,en:"Item 3. Associated Symptoms and Review of Systems: Screens for relevant positive and negative symptoms across organ systems, including gastrointestinal, respiratory, skin, and neurologic symptoms.",ko:"항목 3. 동반 증상 및 계통 문진: 소화기, 호흡기, 피부, 신경 증상을 포함한 장기 계통에 걸쳐 관련된 양성 및 음성 증상을 선별한다.",xEn:"Identifies alternative diagnoses, detects complications, and helps narrow the differential diagnosis.",xKo:"대안 진단을 식별하고, 합병증을 발견하며, 감별진단을 좁히는 데 도움이 된다."},
          {id:"1-2-1-4",pts:4,en:"Item 4. Past Medical and Surgical History: Explores prior illnesses, hospitalizations, surgeries, chronic conditions, and relevant developmental history.",ko:"항목 4. 과거 병력 및 수술력: 이전 질환, 입원, 수술, 만성 질환 및 관련 발달력을 탐색한다.",xEn:"Previous medical conditions may predispose to infection or alter management decisions.",xKo:"이전 의학적 상태는 감염의 소인이 되거나 치료 결정을 변경할 수 있다."},
          {id:"1-2-1-5",pts:4,en:"Item 5. Medication and Allergy History: Identifies current medications, recent medication use (including antipyretics or antibiotics), and drug allergies.",ko:"항목 5. 약물 및 알레르기력: 현재 복용 약물, 최근 약물 사용(해열제 또는 항생제 포함), 약물 알레르기를 확인한다.",xEn:"Essential for safe prescribing and interpretation of clinical response.",xKo:"안전한 처방과 임상 반응 해석에 필수적이다."},
          {id:"1-2-1-6",pts:2,en:"Item 6. Immunization History: Confirms vaccination status and identifies potential gaps in preventive care.",ko:"항목 6. 예방접종력: 예방접종 상태를 확인하고 예방 진료의 잠재적 공백을 식별한다.",xEn:"Although less central to this presentation, immunization status remains a standard component of pediatric assessment.",xKo:"본 사례에서는 덜 중심적이지만, 예방접종 상태는 여전히 소아 평가의 표준 구성 요소다."},
          {id:"1-2-1-7",pts:4,en:"Item 7. Family, Social, and Environmental History: Assesses relevant family diseases, living circumstances, school attendance, caregiving environment, and health behaviors.",ko:"항목 7. 가족력, 사회력 및 환경력: 관련 가족 질환, 생활 환경, 학교 출석, 보호 환경, 건강 행동을 평가한다.",xEn:"Provides context for risk factors, adherence issues, and potential predispositions.",xKo:"위험 인자, 순응도 문제, 잠재적 소인에 대한 맥락을 제공한다."},
          {id:"1-2-1-8",pts:6,en:"Item 8. Assessment of Severity and Red Flags: Screens for indicators of serious illness, including lethargy, altered mental status, poor oral intake, dehydration, reduced urine output, breathing difficulty, or signs of sepsis.",ko:"항목 8. 중증도 및 적신호 평가: 무기력, 의식 변화, 경구 섭취 부진, 탈수, 소변량 감소, 호흡곤란 또는 패혈증 징후를 포함한 중증 질환의 지표를 선별한다.",xEn:"In pediatric emergency medicine, identifying potentially unstable patients is a high-priority task and directly influences urgency of management.",xKo:"소아 응급의학에서 잠재적으로 불안정한 환자를 식별하는 것은 최우선 과제이며 치료의 긴급성에 직접적인 영향을 미친다."},
        ],
        d2:[
          {id:"1-2-2-1",pts:10,en:"Item 1. Characterization of Urinary Symptoms: Explores dysuria, urinary frequency, urgency, hesitancy, incontinence, malodorous urine, cloudy urine, and visible hematuria.",ko:"항목 1. 비뇨기 증상의 특성화: 배뇨통, 빈뇨, 요급, 배뇨 주저, 요실금, 악취성 소변, 혼탁뇨, 육안적 혈뇨를 탐색한다.",xEn:"Lower urinary tract symptoms strongly support the diagnosis of UTI and help distinguish it from non-urinary causes of abdominal pain and fever.",xKo:"하부 요로 증상은 요로감염 진단을 강력히 뒷받침하며, 복통과 발열의 비뇨기계 외 원인과 구별하는 데 도움이 된다."},
          {id:"1-2-2-2",pts:8,en:"Item 2. Fever Assessment: Determines maximum temperature, duration, pattern, response to antipyretics, and presence of chills or rigors.",ko:"항목 2. 발열 평가: 최고 체온, 지속 시간, 양상, 해열제에 대한 반응, 오한 또는 떨림의 유무를 확인한다.",xEn:"High fever and systemic symptoms increase concern for upper urinary tract involvement and more severe infection.",xKo:"고열과 전신 증상은 상부 요로 침범 및 더 중증 감염에 대한 우려를 증가시킨다."},
          {id:"1-2-2-3",pts:10,en:"Item 3. Abdominal, Suprapubic, and Flank Pain Analysis: Clarifies location, severity, radiation, progression, and relationship of pain to urination or movement; specifically asks about flank/back pain.",ko:"항목 3. 복부, 치골상부 및 옆구리 통증 분석: 통증의 위치, 중증도, 방사, 진행, 배뇨 또는 움직임과의 관계를 명확히 하고, 특히 옆구리/허리 통증에 대해 질문한다.",xEn:"Flank pain is a key discriminator between cystitis and pyelonephritis and therefore receives substantial weight.",xKo:"옆구리 통증은 방광염과 신우신염을 구별하는 핵심 지표이므로 상당한 가중치를 받는다."},
          {id:"1-2-2-4",pts:8,en:"Item 4. Screening for Upper Tract Infection and Systemic Involvement: Assesses nausea, vomiting, poor oral intake, malaise, weakness, dehydration symptoms, and inability to tolerate fluids.",ko:"항목 4. 상부 요로 감염 및 전신 침범 선별: 오심, 구토, 경구 섭취 부진, 권태감, 쇠약, 탈수 증상, 수분 섭취 불내성을 평가한다.",xEn:"These features suggest pyelonephritis or more severe illness and affect disposition decisions.",xKo:"이러한 특징들은 신우신염 또는 더 중증의 질환을 시사하며 처치 결정에 영향을 미친다."},
          {id:"1-2-2-5",pts:8,en:"Item 5. Previous Urinary Tract History: Inquires about prior UTIs, previous urine cultures, antibiotic-resistant infections, renal imaging, vesicoureteral reflux, or known urinary tract abnormalities.",ko:"항목 5. 이전 요로 병력: 이전 요로감염, 이전 소변 배양검사, 항생제 내성 감염, 신장 영상검사, 방광요관역류 또는 알려진 요로 이상에 대해 문진한다.",xEn:"Recurrent infections or structural abnormalities significantly alter diagnostic evaluation and management.",xKo:"반복 감염이나 구조적 이상은 진단 평가와 치료 방향을 크게 변경한다."},
          {id:"1-2-2-6",pts:6,en:"Item 6. Voiding and Bowel Habits: Evaluates voiding frequency, withholding behaviors, incomplete bladder emptying, constipation, encopresis, and toileting habits.",ko:"항목 6. 배뇨 및 배변 습관: 배뇨 빈도, 참기 행동, 불완전 방광 비우기, 변비, 변실금, 화장실 사용 습관을 평가한다.",xEn:"Bladder-bowel dysfunction is a common pediatric risk factor for UTIs and recurrence.",xKo:"방광-배변 기능 이상은 소아에서 요로감염 및 재발의 흔한 위험 인자다."},
          {id:"1-2-2-7",pts:5,en:"Item 7. Risk Factors for Complicated UTI: Assesses urinary tract anomalies, nephrolithiasis, recent catheterization, urinary obstruction, immunocompromise, or recent antibiotic exposure.",ko:"항목 7. 복잡성 요로감염 위험 인자: 요로 기형, 신장결석, 최근 도뇨, 요로 폐쇄, 면역저하 또는 최근 항생제 노출을 평가한다.",xEn:"Identifying complicated infection risk factors influences investigation, treatment, and follow-up.",xKo:"복잡성 감염 위험 인자를 식별하는 것은 검사, 치료, 추적 관찰에 영향을 미친다."},
          {id:"1-2-2-8",pts:5,en:"Item 8. Hydration and Urine Output Assessment: Evaluates fluid intake, urine volume, oliguria, and signs of dehydration.",ko:"항목 8. 수분 상태 및 소변량 평가: 수분 섭취, 소변량, 핍뇨, 탈수 징후를 평가한다.",xEn:"Hydration status helps assess illness severity and guides emergency management decisions.",xKo:"수분 상태는 질환의 중증도를 평가하고 응급 치료 결정을 안내하는 데 도움이 된다."},

      {
        id:"1-3", label_en:"Rubric 3", label_ko:"기준표 3", d1pts:40, d2pts:60,
        d1desc_en:"General Clinical History-Taking",
        d1desc_ko:"일반 임상 병력 청취",
        d2desc_en:"Case-Specific Diagnostic History",
        d2desc_ko:"사례 특이 진단적 병력 청취",
        d1:[
          {id:"1-3-1-1",pts:10,en:"Item 1. History of Present Illness (HPI) Chronology & Progression: Elicits a clear timeline of the illness, establishing the patient's baseline health, exact onset of symptoms (e.g., 2 days of fever), and the evolution of the presentation leading up to the ED visit.",ko:"항목 1. 현병력의 시간적 경과 및 진행: 환자의 기저 건강 상태, 정확한 증상 발병 시점(예: 2일간의 발열), 응급실 방문에 이르기까지의 증상 진행을 확립하면서 질병의 명확한 시간적 경과를 청취한다.",xEn:"Establishing an accurate chronological timeline is a foundational emergency medicine skill. It allows the clinician to determine the acuity of the disease process, track symptom progression, and differentiate acute infectious etiologies from subacute or chronic issues.",xKo:"정확한 시간적 경과를 확립하는 것은 응급의학의 기초 기술이다. 임상의가 질환의 급성도를 판단하고, 증상 진행을 추적하며, 급성 감염성 원인을 아급성 또는 만성 문제와 구별할 수 있게 한다."},
          {id:"1-3-1-2",pts:10,en:"Item 2. Past Medical, Surgical & Family History: Systematically inquires about underlying congenital or chronic medical conditions, previous hospitalizations, prior surgeries, and relevant familial diseases.",ko:"항목 2. 과거 병력, 수술력 및 가족력: 기저 선천성 또는 만성 질환, 이전 입원, 이전 수술 및 관련 가족 질환에 대해 체계적으로 문진한다.",xEn:"Eliciting a thorough background is essential to establish the patient's baseline physiological risk. In pediatric emergencies, distinguishing a previously healthy child from one with complex chronic conditions fundamentally alters the diagnostic workup and threshold for admission.",xKo:"철저한 배경 청취는 환자의 기저 생리학적 위험을 확립하는 데 필수적이다. 소아 응급 상황에서 이전에 건강했던 아동과 복잡한 만성 질환이 있는 아동을 구별하는 것은 진단 검사와 입원 결정 기준을 근본적으로 변화시킨다."},
          {id:"1-3-1-3",pts:10,en:"Item 3. Medications, Allergies & Immunizations: Confirms current home medications (including recent doses of antipyretics or prior antibiotics), verifies adverse drug reactions/allergies, and confirms vaccination status.",ko:"항목 3. 복용 약물, 알레르기 및 예방접종: 현재 가정에서 복용 중인 약물(최근 해열제 또는 이전 항생제 투여 포함)을 확인하고, 약물 이상반응/알레르기를 확인하며, 예방접종 상태를 확인한다.",xEn:"This is a critical safety and risk-stratification measure. Knowing allergy status is required prior to empirical antibiotic administration. Immunization history helps risk-stratify the child for vaccine-preventable bacteremia or severe focal infections.",xKo:"이것은 중요한 안전 및 위험 계층화 조치다. 경험적 항생제 투여 전에 알레르기 상태를 아는 것이 필요하다. 예방접종력은 백신 예방 가능한 균혈증 또는 중증 국소 감염에 대한 아동의 위험을 계층화하는 데 도움이 된다."},
          {id:"1-3-1-4",pts:10,en:"Item 4. General Pediatric Review of Systems & Baseline Status: Assesses overall behavior, activity level, mental status (e.g., irritability, lethargy, or normal interaction), and baseline physiological functions like sleep.",ko:"항목 4. 일반 소아 계통 문진 및 기저 상태: 전반적인 행동, 활동 수준, 정신 상태(예: 짜증, 무기력 또는 정상적 상호작용), 수면과 같은 기저 생리적 기능을 평가한다.",xEn:"Young children often cannot articulate systemic toxicity or subtle worsening of their condition. Relying on the caregiver's assessment of the child's general behavior and activity level is vital for identifying occult sepsis or systemic decompensation early in the ED triage process.",xKo:"어린 아동은 종종 전신적 독성 또는 미세한 상태 악화를 표현하지 못한다. 보호자의 아동에 대한 전반적 행동 및 활동 수준 평가에 의존하는 것은 응급실 진료 분류 초기에 잠재적 패혈증 또는 전신 대상부전을 식별하는 데 필수적이다."},

        d2:[
          {id:"1-3-2-1",pts:15,en:"Item 1. Characterization of Urinary and Upper Tract Symptoms: Specifically queries the presence of lower urinary tract symptoms (dysuria, frequency, urgency, hematuria) and localizes pain (suprapubic vs. unilateral back/flank pain).",ko:"항목 1. 비뇨기 및 상부 요로 증상의 특성화: 하부 요로 증상(배뇨통, 빈뇨, 요급, 혈뇨)의 유무를 구체적으로 문진하고 통증을 국소화한다(치골상부 vs. 일측성 허리/옆구리 통증).",xEn:"This directly probes the primary diagnostic hypothesis. Eliciting the right-sided back pain in conjunction with the lower urinary tract symptoms and high fever is the critical clinical reasoning step required to differentiate a simple lower UTI (cystitis) from upper tract involvement (pyelonephritis).",xKo:"이것은 일차 진단 가설을 직접적으로 탐구한다. 우측 허리 통증을 하부 요로 증상 및 고열과 함께 청취하는 것은 단순 하부 요로감염(방광염)과 상부 요로 침범(신우신염)을 구별하는 데 필요한 핵심 임상 추론 단계다."},
          {id:"1-3-2-2",pts:15,en:"Item 2. Assessment of Pediatric UTI Risk Factors & Voiding Habits: Explores previous episodes of UTIs, history of known structural renal anomalies, bowel habits (constipation), and daily voiding dysfunction (e.g., toilet training status, withholding/postponement of voiding at school).",ko:"항목 2. 소아 요로감염 위험 인자 및 배뇨 습관 평가: 이전 요로감염 에피소드, 알려진 구조적 신장 이상의 병력, 배변 습관(변비), 일일 배뇨 기능 이상(예: 배변 훈련 상태, 학교에서 배뇨 참기/미루기)을 탐색한다.",xEn:"Pediatric UTIs are heavily correlated with Bowel and Bladder Dysfunction (BBD) and underlying congenital anomalies. Identifying the patient's voiding postponement behavior provides a clear etiology for the current infection and is crucial for guiding post-discharge education and prevention strategies.",xKo:"소아 요로감염은 배변 및 방광 기능 이상(BBD)과 기저 선천성 이상과 강한 상관관계가 있다. 환자의 배뇨 미루기 행동을 식별하는 것은 현재 감염의 명확한 원인을 제공하며 퇴원 후 교육 및 예방 전략을 안내하는 데 중요하다."},
          {id:"1-3-2-3",pts:15,en:"Item 3. Evaluation of Oral Tolerance and Hydration: Determines the presence or absence of vomiting, the child's current ability to tolerate oral fluids and medications, and recent urine output volumes.",ko:"항목 3. 경구 섭취 및 수분 상태 평가: 구토의 유무, 아동의 현재 경구 수분 및 약물 섭취 능력, 최근 소변량을 판단한다.",xEn:"In a febrile child with suspected pyelonephritis, the presence of intractable vomiting or poor oral intake strictly dictates the disposition. A child who cannot hold down fluids or oral antibiotics requires admission for IV hydration and parenteral therapy; confirming the absence of vomiting justifies safe outpatient management.",xKo:"신우신염이 의심되는 발열성 아동에서 난치성 구토 또는 경구 섭취 부진의 유무는 처치 결정을 엄격히 좌우한다. 수분이나 경구 항생제를 유지할 수 없는 아동은 정맥 수액 및 비경구 치료를 위해 입원이 필요하며, 구토 부재의 확인은 안전한 외래 관리를 정당화한다."},
          {id:"1-3-2-4",pts:15,en:"Item 4. Exclusion of Critical Differential Diagnoses: Screens for symptoms of alternative pediatric abdominal and febrile emergencies, explicitly asking about migratory right lower quadrant pain (appendicitis), vomiting/diarrhea (gastroenteritis), and cough/shortness of breath (lower lobe pneumonia presenting as abdominal pain).",ko:"항목 4. 주요 감별진단 배제: 대안적 소아 복부 및 발열 응급 상황의 증상을 선별하며, 우하복부로의 이동성 통증(충수염), 구토/설사(위장염), 기침/호흡곤란(복통으로 발현되는 하엽 폐렴)에 대해 명시적으로 질문한다.",xEn:"Fever and abdominal pain in a 6-year-old has a broad and potentially life-threatening differential. A competent clinician must actively rule out surgical emergencies like appendicitis and other focal infections like pneumonia to safely anchor their diagnosis on a genitourinary source.",xKo:"6세 아동의 발열과 복통은 광범위하고 잠재적으로 생명을 위협하는 감별진단이 있다. 유능한 임상의는 충수염과 같은 외과적 응급 상황과 폐렴과 같은 다른 국소 감염을 적극적으로 배제하여 진단을 비뇨생식기 원인에 안전하게 고정해야 한다."},

    rubrics: [
      {
        id:"2-1", label_en:"Rubric 1", label_ko:"기준표 1", d1pts:40, d2pts:60,
        d1desc_en:"General Clinical History-Taking",
        d1desc_ko:"일반 임상 병력 청취",
        d2desc_en:"Case-Specific Diagnostic History",
        d2desc_ko:"사례 특이 진단적 병력 청취",
        d1:[
          {id:"2-1-1-1",pts:10,en:"Item 1. History of Present Illness (HPI) Chronology & Progression: Elicits a clear timeline of the illness, establishing the onset, frequency, and trajectory of symptoms (e.g., 2 days of progressive vomiting and diarrhea) leading up to the ED presentation.",ko:"항목 1. 현병력의 시간적 경과 및 진행: 응급실 발현에 이르기까지 증상의 발병, 빈도, 경향(예: 2일간 진행되는 구토와 설사)을 확립하면서 질환의 명확한 시간 경과를 청취한다.",xEn:"Establishing the exact chronological timeline is fundamental. In gastrointestinal illnesses, knowing whether vomiting preceded diarrhea or vice versa, and tracking the frequency of episodes over time, helps determine the acuity of the disease and the cumulative risk of fluid loss.",xKo:"정확한 시간적 경과를 확립하는 것이 근본이다. 위장관 질환에서 구토가 설사에 선행했는지 그 반대인지, 그리고 시간에 따른 에피소드 빈도를 추적하는 것은 질환의 급성도와 누적된 수분 손실 위험을 판단하는 데 도움이 된다."},
          {id:"2-1-1-2",pts:10,en:"Item 2. Past Medical, Surgical, and Birth History: Systematically inquires about prior hospitalizations, previous abdominal surgeries, underlying chronic conditions, and birth history (e.g., term vs. premature).",ko:"항목 2. 과거 병력, 수술력 및 출생력: 이전 입원, 이전 복부 수술, 기저 만성 질환, 출생력(예: 만삭 vs 미숙아)에 대해 체계적으로 문진한다.",xEn:"A thorough background identifies baseline physiological risks. In a toddler, a history of prior abdominal surgery raises the index of suspicion for bowel obstruction (adhesions), while birth history remains relevant for baseline developmental and anatomical considerations.",xKo:"철저한 배경 청취는 기저 생리학적 위험을 식별한다. 유아에서 이전 복부 수술 병력은 장폐쇄(유착)에 대한 의심 지표를 높이며, 출생력은 기저 발달 및 해부학적 고려사항에 관련성이 있다."},
          {id:"2-1-1-3",pts:10,en:"Item 3. Medications, Allergies, and Immunizations: Confirms current medications (including recent home antipyretics or antiemetics), verifies drug allergies, and explicitly checks immunization status (specifically the rotavirus vaccine series).",ko:"항목 3. 복용 약물, 알레르기 및 예방접종: 현재 복용 약물(최근 가정에서의 해열제 또는 진토제 포함)을 확인하고, 약물 알레르기를 확인하며, 예방접종 상태(특히 로타바이러스 백신 시리즈)를 명시적으로 확인한다.",xEn:"Knowing what medications were administered at home prevents overdose (e.g., acetaminophen toxicity). Confirming rotavirus vaccination status aids in epidemiological reasoning and risk-stratifying the severity of viral gastroenteritis.",xKo:"가정에서 어떤 약물이 투여되었는지 아는 것은 과량 투여(예: 아세트아미노펜 독성)를 예방한다. 로타바이러스 예방접종 상태 확인은 역학적 추론과 바이러스성 위장관염 중증도의 위험 계층화에 도움이 된다."},
          {id:"2-1-1-4",pts:10,en:"Item 4. Review of Systems and Baseline Behavioral Status: Assesses overall mental status, lethargy, irritability, and general behavior compared to the child's baseline, as reported by the caregiver.",ko:"항목 4. 계통 문진 및 기저 행동 상태: 보호자가 보고하는 아동의 기저와 비교한 전반적인 의식 상태, 무기력, 짜증, 전반적 행동을 평가한다.",xEn:"Caregivers are highly sensitive to deviations from their child's normal behavior. In pediatric emergency medicine, increased lethargy or poor interaction is often the first and most reliable historical indicator of systemic compromise, impending shock, or severe volume depletion.",xKo:"보호자는 아동의 정상 행동에서의 일탈에 매우 민감하다. 소아 응급의학에서 증가된 무기력이나 부진한 상호작용은 종종 전신 손상, 임박한 쇼크 또는 심한 체액 고갈의 가장 빠르고 신뢰할 수 있는 병력 지표다."},
        ],
        d2:[
          {id:"2-1-2-1",pts:20,en:"Item 1. Assessment of Fluid Balance and Dehydration Risk: Quantifies ongoing losses (frequency/volume of emesis and diarrhea), current ability to tolerate oral fluids, and specifically measures urine output (e.g., time of the last wet diaper or void, presence of tears when crying).",ko:"항목 1. 체액 균형 및 탈수 위험 평가: 진행 중인 손실(구토와 설사의 빈도/양), 현재 경구 수분 섭취 능력을 정량화하고, 특히 소변량(예: 마지막 젖은 기저귀나 배뇨 시간, 울 때 눈물의 유무)을 측정한다.",xEn:"The primary morbidity and mortality driver in pediatric gastroenteritis is dehydration. Eliciting a history of a 10-hour anuric window immediately categorizes the patient into a higher acuity tier (moderate to severe dehydration), dictating the need for aggressive fluid resuscitation and close monitoring.",xKo:"소아 위장관염의 주요 이환율 및 사망률의 원인은 탈수다. 10시간의 무뇨 시간을 청취하는 것은 환자를 즉시 더 높은 급성도 단계(중등도에서 중증 탈수)로 분류하여 적극적인 수액 소생술과 면밀한 모니터링의 필요성을 결정한다."},
          {id:"2-1-2-2",pts:15,en:"Item 2. Characterization of Gastrointestinal Losses (Red Flag Screening): Explicitly queries for the presence of bilious (green) or bloody emesis, as well as bloody or mucous-laden diarrhea (hematochezia).",ko:"항목 2. 위장관 손실의 특성화(적신호 선별): 담즙성(녹색) 또는 혈성 구토, 그리고 혈성 또는 점액이 많은 설사(혈변)의 유무에 대해 명시적으로 문진한다.",xEn:"This is a critical safety checkpoint. Bilious emesis in a pediatric patient is a surgical emergency (e.g., malrotation with midgut volvulus) until proven otherwise. Bloody diarrhea prompts evaluation for invasive bacterial enteritis, Hemolytic Uremic Syndrome (HUS), or intussusception, which entirely alters the diagnostic pathway away from simple viral gastroenteritis.",xKo:"이것은 중요한 안전 점검 지점이다. 소아 환자의 담즙성 구토는 다르게 입증될 때까지 외과적 응급 상황(예: 중장 염전이 있는 장회전이상)이다. 혈성 설사는 침습성 세균성 장염, 용혈성 요독증후군(HUS) 또는 장중첩증에 대한 평가를 유발하며, 이는 단순 바이러스성 위장관염과는 완전히 다른 진단 경로로 변경한다."},
          {id:"2-1-2-3",pts:15,en:"Item 3. Pain Assessment & Exclusion of Surgical Emergencies: Investigates the nature, location, and progression of abdominal pain, differentiating intermittent, diffuse cramping from severe, localized, or progressively worsening pain.",ko:"항목 3. 통증 평가 및 외과적 응급 상황 배제: 복통의 성격, 위치, 진행을 조사하며, 간헐적이고 미만성인 산통과 심하고 국소화되어 있거나 점진적으로 악화되는 통증을 구별한다.",xEn:"Surgical emergencies like acute appendicitis or intussusception can present with vomiting, diarrhea, and pain. Eliciting the colicky nature of intussusception or the focal migration of appendicitis ensures the clinician does not prematurely anchor on a benign viral etiology, preventing catastrophic delayed diagnoses.",xKo:"급성 충수염이나 장중첩증과 같은 외과적 응급 상황은 구토, 설사, 통증으로 발현될 수 있다. 장중첩증의 산통적 성격이나 충수염의 국소적 이동을 청취하는 것은 임상의가 양성 바이러스 원인에 조기 고정되지 않도록 하여, 재앙적인 지연 진단을 예방한다."},
          {id:"2-1-2-4",pts:10,en:"Item 4. Epidemiological and Exposure History: Explores sick contacts at daycare or home, recent travel history, and unusual food or water exposures.",ko:"항목 4. 역학적 및 노출력: 어린이집이나 가정에서의 환자 접촉, 최근 여행력, 비정상적인 음식 또는 물 노출을 탐색한다.",xEn:"Identifying daycare contacts with similar symptoms strongly supports a viral etiology (such as norovirus or rotavirus), reassuring the clinician of the benign, self-limiting nature of the illness. Conversely, recent travel or unusual dietary exposures would appropriately broaden the differential to include parasitic or atypical bacterial pathogens requiring targeted investigations.",xKo:"유사한 증상을 가진 어린이집 접촉자를 식별하는 것은 바이러스 원인(예: 노로바이러스 또는 로타바이러스)을 강력히 뒷받침하여 임상의에게 질환의 양성, 자가 제한적 성질을 확인시켜준다. 반대로, 최근 여행이나 비정상적인 식이 노출은 표적 검사가 필요한 기생충 또는 비전형 세균성 병원체를 포함하도록 감별진단을 적절히 확대한다."},
        ],
      },
      {
        id:"2-2", label_en:"Rubric 2", label_ko:"기준표 2", d1pts:40, d2pts:60,
        d1desc_en:"General Clinical History-Taking",
        d1desc_ko:"일반 임상 병력 청취",
        d2desc_en:"Case-Specific Diagnostic History — Viral Gastroenteritis with Dehydration",
        d2desc_ko:"사례 특이 진단적 병력 청취 — 탈수를 동반한 바이러스성 위장관염",
        d1:[
          {id:"2-2-1-1",pts:10,en:"Item 1. History of Presenting Illness (structured): Systematically elicits onset, duration, frequency, progression, and character of vomiting, diarrhea, fever, and abdominal pain, with temporal sequencing and aggravating/relieving factors.",ko:"항목 1. 현병력(구조화된 청취): 구토, 설사, 발열, 복통의 발병, 지속 시간, 빈도, 진행, 양상을 체계적으로 청취하며 시간적 순서와 악화/완화 요인을 포함한다.",xEn:"The backbone of any history and the highest-yield general element; a clear timeline (2 days, escalating losses, falling intake) frames both the diagnosis and the dehydration trajectory.",xKo:"모든 병력 청취의 근간이자 가장 높은 정보 수율을 갖는 일반 항목이다. 명확한 경과(2일간, 증가하는 손실, 감소하는 섭취)는 진단과 탈수 진행 양상의 틀을 모두 형성한다."},
          {id:"2-2-1-2",pts:7,en:"Item 2. Targeted Review of Systems & Pertinent Negatives: Screens related systems (GI, GU, respiratory, ENT, skin, neuro) to surface positives and clinically meaningful negatives.",ko:"항목 2. 표적 계통 문진 및 관련 음성 소견: 관련 계통(소화기, 비뇨기, 호흡기, 이비인후, 피부, 신경)을 선별하여 양성 소견과 임상적으로 의미 있는 음성 소견을 드러낸다.",xEn:"The pertinent negatives here (no bloody stool, no bilious emesis, no dysuria, no rash/petechiae) actively narrow the differential away from surgical, invasive-bacterial, and HUS pathways, so this ranks above the remaining general items.",xKo:"이 사례에서 관련 음성 소견(혈변 없음, 담즙성 구토 없음, 배뇨통 없음, 발진/점상출혈 없음)은 외과적, 침습성 세균성, 용혈성 요독증후군(HUS) 경로로부터 감별진단을 적극적으로 좁히므로, 나머지 일반 항목보다 높은 순위를 차지한다."},
          {id:"2-2-1-3",pts:4,en:"Item 3. Past Medical & Surgical History: Prior illnesses, hospitalizations, chronic conditions, and any prior abdominal surgery.",ko:"항목 3. 과거 병력 및 수술력: 이전 질환, 입원력, 만성 질환, 이전 복부 수술.",xEn:"Important context and a flag for prior surgery (adhesions/obstruction risk); weighted modestly given the unremarkable background.",xKo:"이전 수술(유착/폐쇄 위험)에 대한 중요한 맥락 및 표시이지만, 특이사항 없는 배경을 고려하여 적당한 가중치를 부여한다."},
          {id:"2-2-1-4",pts:4,en:"Item 4. Medications & Allergies: Current/recent medications — including antiemetics, anti-diarrheals, and recent antibiotics — and documented drug allergies.",ko:"항목 4. 복용 약물 및 알레르기: 현재/최근 복용 약물 — 진토제, 지사제, 최근 항생제 포함 — 및 기록된 약물 알레르기.",xEn:"Directly relevant because recent antibiotics raise C. difficile consideration and prior antiemetic dosing affects the oral-rehydration plan; a brief but bounded inquiry.",xKo:"최근 항생제는 C. difficile 감염 고려를 유발하고 이전 진토제 투여는 경구 수분 보충 계획에 영향을 미치므로 직접적으로 관련된다. 간단하지만 한정된 질문이다."},
          {id:"2-2-1-5",pts:3,en:"Item 5. Immunization Status: Confirms up-to-date vaccination, including the rotavirus series.",ko:"항목 5. 예방접종 상태: 로타바이러스 백신 시리즈를 포함한 최신 예방접종 여부 확인.",xEn:"A core pediatric element with genuine relevance here — completed rotavirus immunization modestly shifts the viral differential — but rarely decisive on its own.",xKo:"여기에 진정한 관련성이 있는 핵심 소아 항목으로, 완료된 로타바이러스 예방접종은 바이러스성 감별진단을 약간 변경하지만 단독으로 결정적인 경우는 드물다."},
          {id:"2-2-1-6",pts:3,en:"Item 6. Birth & Developmental History: Perinatal course, prematurity, and developmental trajectory.",ko:"항목 6. 출생력 및 발달력: 주산기 경과, 미숙아 여부, 발달 궤적.",xEn:"Standard component of a complete pediatric history; lower-yield in a previously well, normally-developing 3-year-old.",xKo:"완전한 소아 병력 청취의 표준 구성 요소이지만, 이전에 건강하고 정상 발달하는 3세 아동에서는 정보 수율이 낮다."},
          {id:"2-2-1-7",pts:3,en:"Item 7. Family History (general): Heritable conditions and relevant family medical background.",ko:"항목 7. 가족력(일반): 유전 가능한 질환 및 관련 가족 의학 배경.",xEn:"A baseline competency; weighted low as the case has no familial driver, and any infectious household clustering is credited under Domain 2 to avoid double-counting.",xKo:"기본 역량이며, 본 사례에 가족적 요인이 없고 가정 내 감염성 집단발생은 중복 채점을 피하기 위해 영역 2에서 평가하므로 낮은 가중치를 부여한다."},
          {id:"2-2-1-8",pts:3,en:"Item 8. Social History & Caregiver Context: Home environment, caregivers, smokers, and living situation.",ko:"항목 8. 사회력 및 보호자 환경: 가정 환경, 보호자, 흡연자, 생활 상황.",xEn:"Provides context and informs the safety of a home-based rehydration plan; the case-relevant daycare exposure is scored in Domain 2, so the general item stays modest.",xKo:"맥락을 제공하고 가정 기반 수분 보충 계획의 안전성을 알려준다. 사례 관련 어린이집 노출은 영역 2에서 평가하므로 일반 항목은 적당한 비중을 유지한다."},
          {id:"2-2-1-9",pts:3,en:"Item 9. Collateral History & Developmentally-Appropriate Communication: Obtains history from the caregiver with organized, empathetic questioning suited to a preverbal/partially-verbal child.",ko:"항목 9. 보호자 병력 청취 및 발달 수준에 맞는 의사소통: 전언어기/부분 언어기 아동에 적합한 체계적이고 공감적인 질문으로 보호자로부터 병력을 청취한다.",xEn:"A distinctly pediatric skill — a toddler cannot self-report intake or urine output, so caregiver-derived data is the whole history — explicitly assessed but kept modest within a content-focused rubric.",xKo:"소아과만의 고유한 기술 — 유아는 섭취량이나 소변량을 스스로 보고할 수 없으므로 보호자에게서 얻은 정보가 병력 전부를 차지한다 — 이므로 명시적으로 평가하되, 내용 중심의 평가 기준에서 적당한 비중을 유지한다."},
        ],
        d2:[
          {id:"2-2-2-1",pts:11,en:"Item 1. Dehydration Severity Assessment (intake, output, observed signs): Quantifies oral intake, urine output (timing of last void/number of wet diapers), volume of ongoing losses, and caregiver-observed signs — tears, alertness, activity level, sunken eyes.",ko:"항목 1. 탈수 중증도 평가(섭취, 배출, 관찰된 징후): 경구 섭취, 소변량(마지막 배뇨 시간/젖은 기저귀 수), 진행 중인 손실량, 보호자가 관찰한 징후 — 눈물, 각성도, 활동 수준, 함몰된 눈 — 를 정량화한다.",xEn:"This is the pivotal issue of the entire case (10 hours without a void signals at least moderate dehydration) and directly drives the oral-versus-IV rehydration and disposition decision, so it carries the highest weight in the rubric.",xKo:"이것은 전체 사례의 핵심 쟁점이며(10시간 동안 배뇨가 없다는 것은 최소한 중등도 탈수를 시사함), 경구 vs 정맥 수분 보충과 처치 결정을 직접적으로 좌우하므로 평가 기준에서 가장 높은 가중치를 부여한다."},
          {id:"2-2-2-2",pts:9,en:"Item 2. Characterization of Vomiting (red-flag screen): Bilious or bloody emesis, projectile quality, content, and relationship to feeds.",ko:"항목 2. 구토의 특성화(적신호 선별): 담즙성 또는 혈성 구토, 분출성 양상, 내용물, 수유와의 관계.",xEn:"Bilious emesis is the critical do-not-miss pointer to intestinal obstruction/malrotation in a young child; this line of questioning both confirms the benign non-bilious pattern and excludes a surgical emergency, warranting the second-highest weight.",xKo:"담즙성 구토는 어린 아동에서 장폐쇄/장회전이상의 절대 놓치면 안 되는 중요한 단서다. 이 질문 라인은 양성 비담즙성 양상을 확인하고 외과적 응급 상황을 배제하므로 두 번째로 높은 가중치를 부여한다."},
          {id:"2-2-2-3",pts:8,en:"Item 3. Characterization of Diarrhea: Bloody or mucoid versus watery stool, frequency, volume, and duration.",ko:"항목 3. 설사의 특성화: 혈성 또는 점액성 vs 수양성 변, 빈도, 양, 지속 시간.",xEn:"The presence or absence of blood/mucus is the single most discriminating historical feature separating viral from invasive bacterial disease and flags post-diarrheal HUS risk, making it high-value.",xKo:"혈액/점액의 유무는 바이러스성과 침습성 세균성 질환을 구별하는 가장 변별력 있는 단일 병력 특징이며 설사 후 용혈성 요독증후군(HUS) 위험을 표시하므로 가치가 높다."},
          {id:"2-2-2-4",pts:7,en:"Item 4. Epidemiologic Exposure History: Daycare/household sick contacts, recent travel, food and untreated-water exposures, animal contact, and recent antibiotics.",ko:"항목 4. 역학적 노출력: 어린이집/가정 내 환자 접촉, 최근 여행, 음식 및 처리되지 않은 물 노출, 동물 접촉, 최근 항생제.",xEn:"Clustered daycare illness strongly supports a viral etiology and is precisely the information that determines whether stool studies are indicated; rewards the learner who reasons toward (and confirms) the likely diagnosis.",xKo:"어린이집 내 집단 발병은 바이러스 원인을 강력히 뒷받침하며 대변 검사 시행 여부를 결정하는 정보가 된다. 가능성 있는 진단을 향해 추론하고(그리고 확인하는) 학습자에게 점수를 부여한다."},
          {id:"2-2-2-5",pts:7,en:"Item 5. Screen for Surgical/Obstructive Abdomen: Paroxysmal/colicky pain with lethargy between episodes, currant-jelly stool, abdominal distension or palpable mass (intussusception), and right-lower-quadrant migration with anorexia (appendicitis).",ko:"항목 5. 외과적/폐쇄성 복부 선별: 발작성/산통 통증과 발작 사이 무기력, 적색 젤리 변, 복부 팽만 또는 만져지는 종괴(장중첩증), 식욕부진과 함께 우하복부로의 이동(충수염).",xEn:"Intussusception is the leading do-not-miss diagnosis in this age group and can masquerade as gastroenteritis; deliberate exclusion is a hallmark of safe history-taking and is weighted accordingly.",xKo:"장중첩증은 이 연령군에서 가장 놓치면 안 되는 진단이며 위장관염으로 가장할 수 있다. 의도적 배제는 안전한 병력 청취의 특징이며 그에 따라 가중치를 부여한다."},
          {id:"2-2-2-6",pts:6,en:"Item 6. Home Rehydration & Feeding Attempts: Fluids offered (oral rehydration solution versus water, juice, or dilute formula), volumes, tolerance, and any antiemetics/anti-diarrheals given.",ko:"항목 6. 가정에서의 수분 보충 및 수유 시도: 제공된 수분(경구 수분보충용액 vs 물, 주스, 희석 분유), 양, 내성, 투여된 진토제/지사제.",xEn:"This both gauges feasibility of an oral-rehydration trial and helps explain the mild hyponatremia (excess hypotonic free water is a common contributor), giving it solid management value.",xKo:"경구 수분 보충 시도의 실행 가능성을 가늠하고 경증 저나트륨혈증(과도한 저장성 유리수가 흔한 기여 인자)을 설명하는 데 도움이 되어 확실한 치료적 가치가 있다."},
          {id:"2-2-2-7",pts:6,en:"Item 7. Differential for Non-GI Causes of Vomiting: Polyuria/polydipsia and weight loss (DKA), urinary symptoms (UTI), headache/neck stiffness/irritability or altered behavior (CNS infection, raised ICP), and possible toxic ingestion.",ko:"항목 7. 구토의 비위장관 원인 감별: 다뇨/다음 및 체중 감소(당뇨병성 케토산증), 비뇨기 증상(요로감염), 두통/경부 강직/짜증 또는 행동 변화(중추신경계 감염, 두개내압 상승), 가능한 독성 섭취.",xEn:"Vomiting is notoriously non-specific in toddlers, so screening for serious extra-intestinal mimics is essential reasoning; weighted moderately because the diarrheal context and normal glucose already favor a GI source.",xKo:"유아에서 구토는 비특이적이기로 악명 높으므로 중증 장외 모방 질환을 선별하는 것이 필수적 추론이다. 설사 상황과 정상 혈당이 이미 위장관 원인을 시사하므로 중간 정도의 가중치를 부여한다."},
          {id:"2-2-2-8",pts:6,en:"Item 8. Red Flags for Complications & Deterioration: Decreasing or absent urine output, pallor or petechiae, lethargy or altered mental status, and parental sense of worsening — prompting concern for severe dehydration, shock, or HUS.",ko:"항목 8. 합병증 및 악화의 적신호: 감소하거나 부재한 소변량, 창백 또는 점상출혈, 무기력 또는 의식 변화, 보호자가 인지하는 악화 — 중증 탈수, 쇼크 또는 용혈성 요독증후군에 대한 우려를 유발.",xEn:"The reduced urine output and borderline perfusion make complication-screening directly relevant here, and identifying the deteriorating child is critical for safe triage; weighted as a focused safety net given the currently stable, only-mildly-ill presentation.",xKo:"감소된 소변량과 경계 수준의 관류는 합병증 선별을 여기에서 직접적으로 관련 있게 만들며, 악화되는 아동을 식별하는 것은 안전한 진료 분류에 중요하다. 현재 안정적이고 경미한 증상의 발현을 고려하여 집중된 안전망으로서의 가중치를 부여한다."},

      {
        id:"2-3", label_en:"Rubric 3", label_ko:"기준표 3", d1pts:40, d2pts:60,
        d1desc_en:"General Clinical History-Taking",
        d1desc_ko:"일반 임상 병력 청취",
        d2desc_en:"Case-Specific Diagnostic History — Acute Gastroenteritis with Moderate Dehydration",
        d2desc_ko:"사례 특이 진단적 병력 청취 — 중등도 탈수를 동반한 급성 위장관염",
        d1:[
          {id:"2-3-1-1",pts:4,en:"Item 1. Chief Complaint and Problem Identification: Clearly elicits the primary concerns (vomiting, diarrhea, poor oral intake) and establishes the caregiver's main reason for seeking care.",ko:"항목 1. 주 호소 및 문제 식별: 주된 우려사항(구토, 설사, 경구 섭취 부진)을 명확히 청취하고 보호자가 진료를 찾는 주된 이유를 확립한다.",xEn:"A focused understanding of the presenting complaint is the foundation of effective pediatric emergency assessment.",xKo:"발현 호소에 대한 집중된 이해는 효과적인 소아 응급 평가의 근간이다."},
          {id:"2-3-1-2",pts:10,en:"Item 2. History of Presenting Illness (Chronology and Symptom Evolution): Obtains a structured timeline including onset, duration, frequency, progression, severity, and current status of symptoms.",ko:"항목 2. 현병력(시간 경과 및 증상 진행): 증상의 발병, 지속 시간, 빈도, 진행, 중증도, 현재 상태를 포함한 구조화된 시간 경과를 청취한다.",xEn:"Accurate characterization of symptom evolution is essential for assessing disease severity, determining likely etiology, and guiding management.",xKo:"증상 진행의 정확한 특성화는 질환의 중증도를 평가하고, 가능성 있는 원인을 결정하며, 치료를 안내하는 데 필수적이다."},
          {id:"2-3-1-3",pts:5,en:"Item 3. Associated Symptoms and Review of Systems: Screens for relevant positive and negative symptoms across gastrointestinal, respiratory, urinary, neurologic, and dermatologic systems.",ko:"항목 3. 동반 증상 및 계통 문진: 소화기, 호흡기, 비뇨기, 신경, 피부 계통에 걸쳐 관련된 양성 및 음성 증상을 선별한다.",xEn:"Helps identify alternative diagnoses, complications, or concurrent illnesses that may alter management.",xKo:"대안 진단, 합병증 또는 치료를 변경할 수 있는 동반 질환을 식별하는 데 도움이 된다."},
          {id:"2-3-1-4",pts:4,en:"Item 4. Past Medical and Developmental History: Explores previous illnesses, hospitalizations, chronic diseases, birth history, growth, and developmental status.",ko:"항목 4. 과거 병력 및 발달력: 이전 질환, 입원, 만성 질환, 출생력, 성장, 발달 상태를 탐색한다.",xEn:"Underlying medical conditions may increase vulnerability to dehydration or indicate alternative causes of symptoms.",xKo:"기저 의학적 상태는 탈수에 대한 취약성을 증가시키거나 증상의 대안적 원인을 시사할 수 있다."},
          {id:"2-3-1-5",pts:4,en:"Item 5. Medication and Allergy History: Obtains information about routine medications, recent treatments, over-the-counter therapies, and allergies.",ko:"항목 5. 약물 및 알레르기력: 일상 약물, 최근 치료, 일반의약품 치료, 알레르기에 대한 정보를 청취한다.",xEn:"Important for safe prescribing and assessment of treatment response.",xKo:"안전한 처방과 치료 반응 평가에 중요하다."},
          {id:"2-3-1-6",pts:2,en:"Item 6. Immunization History: Reviews vaccination status, including protection against vaccine-preventable gastrointestinal illnesses.",ko:"항목 6. 예방접종력: 백신 예방 가능한 위장관 질환에 대한 보호를 포함하여 예방접종 상태를 검토한다.",xEn:"Immunization status contributes to risk assessment and differential diagnosis.",xKo:"예방접종 상태는 위험 평가와 감별진단에 기여한다."},
          {id:"2-3-1-7",pts:5,en:"Item 7. Family, Social, and Exposure History: Assesses household environment, daycare attendance, sick contacts, travel, dietary exposures, and potential environmental risks.",ko:"항목 7. 가족력, 사회력 및 노출력: 가정 환경, 어린이집 출석, 환자 접촉, 여행, 식이 노출, 잠재적 환경 위험을 평가한다.",xEn:"Exposure history is particularly relevant in infectious illnesses and outbreak-related presentations.",xKo:"노출력은 감염성 질환과 발병 관련 발현에서 특히 관련성이 있다."},
          {id:"2-3-1-8",pts:6,en:"Item 8. Assessment of Severity and Emergency Red Flags: Evaluates for lethargy, altered mental status, inability to maintain hydration, severe pain, signs of shock, seizures, or other indicators of critical illness.",ko:"항목 8. 중증도 및 응급 적신호 평가: 무기력, 의식 변화, 수분 유지 불능, 심한 통증, 쇼크 징후, 발작 또는 중증 질환의 기타 지표를 평가한다.",xEn:"Recognition of potentially unstable patients is a core emergency medicine competency and directly influences urgency of intervention.",xKo:"잠재적으로 불안정한 환자를 인식하는 것은 응급의학의 핵심 역량이며 중재의 긴급성에 직접적인 영향을 미친다."},
        ],
        d2:[
          {id:"2-3-2-1",pts:10,en:"Item 1. Characterization of Vomiting: Explores onset, frequency, volume, progression, ability to retain fluids, and presence of bilious, bloody, projectile, or persistent vomiting.",ko:"항목 1. 구토의 특성화: 발병, 빈도, 양, 진행, 수분 유지 능력, 담즙성, 혈성, 분출성 또는 지속성 구토의 유무를 탐색한다.",xEn:"Distinguishes uncomplicated gastroenteritis from surgical, obstructive, or intracranial causes of vomiting and helps determine dehydration risk.",xKo:"단순 위장관염을 구토의 외과적, 폐쇄성 또는 두개내 원인과 구별하고 탈수 위험을 판단하는 데 도움이 된다."},
          {id:"2-3-2-2",pts:10,en:"Item 2. Characterization of Diarrhea: Assesses stool frequency, volume, consistency, duration, and the presence of blood, mucus, melena, or tenesmus.",ko:"항목 2. 설사의 특성화: 변의 빈도, 양, 굳기, 지속 시간, 혈액, 점액, 흑변 또는 후중감의 유무를 평가한다.",xEn:"Stool characteristics help differentiate viral gastroenteritis from bacterial enteritis, inflammatory conditions, and other gastrointestinal pathology.",xKo:"변의 특성은 바이러스성 위장관염을 세균성 장염, 염증성 질환, 기타 위장관 병리와 구별하는 데 도움이 된다."},
          {id:"2-3-2-3",pts:15,en:"Item 3. Hydration Status and Fluid Balance Assessment: Specifically evaluates oral intake, fluid losses, thirst, urine output, tear production, activity level, weight loss, and caregiver perception of dehydration.",ko:"항목 3. 수분 상태 및 체액 균형 평가: 경구 섭취, 체액 손실, 갈증, 소변량, 눈물 생성, 활동 수준, 체중 감소, 보호자가 인지하는 탈수를 구체적으로 평가한다.",xEn:"This is the most critical diagnostic domain because the major management decision in gastroenteritis centers on assessing dehydration severity and need for rehydration therapy.",xKo:"위장관염의 주요 치료 결정은 탈수 중증도 평가와 수분 보충 치료의 필요성을 중심으로 이루어지므로 이는 가장 중요한 진단 영역이다."},
          {id:"2-3-2-4",pts:8,en:"Item 4. Screening for Complications and Severe Disease: Assesses lethargy, inability to drink, persistent vomiting, syncope, signs of shock, severe weakness, or worsening clinical status.",ko:"항목 4. 합병증 및 중증 질환 선별: 무기력, 음수 불능, 지속성 구토, 실신, 쇼크 징후, 심한 쇠약 또는 임상 상태 악화를 평가한다.",xEn:"Identifies children at risk for significant dehydration, electrolyte abnormalities, or need for escalation of care.",xKo:"심한 탈수, 전해질 이상 또는 치료 단계 상향이 필요한 아동을 식별한다."},
          {id:"2-3-2-5",pts:8,en:"Item 5. Abdominal Pain Assessment and Surgical Red Flags: Clarifies pain location, severity, progression, localization, guarding, abdominal distension, and pain that worsens with movement; screens for appendicitis, intussusception, or bowel obstruction.",ko:"항목 5. 복통 평가 및 외과적 적신호: 통증의 위치, 중증도, 진행, 국소화, 강직, 복부 팽만, 움직임에 따라 악화되는 통증을 명확히 하고 충수염, 장중첩증 또는 장폐쇄를 선별한다.",xEn:"Although gastroenteritis is common, missing a surgical abdomen is a high-consequence error in pediatric emergency practice.",xKo:"위장관염은 흔하지만, 외과적 복통을 놓치는 것은 소아 응급 진료에서 결과가 큰 오류다."},
          {id:"2-3-2-6",pts:5,en:"Item 6. Infectious Exposure and Epidemiologic Risk Factors: Investigates daycare outbreaks, sick contacts, contaminated food or water exposure, recent travel, animal exposure, and household illness.",ko:"항목 6. 감염 노출 및 역학적 위험 인자: 어린이집 발병, 환자 접촉, 오염된 음식 또는 물 노출, 최근 여행, 동물 노출, 가정 내 질환을 조사한다.",xEn:"Supports identification of likely viral gastroenteritis and guides consideration of alternative infectious etiologies.",xKo:"가능성 있는 바이러스성 위장관염의 식별을 뒷받침하고 대안적 감염성 원인 고려를 안내한다."},
          {id:"2-3-2-7",pts:4,en:"Item 7. Risk Factors for Severe or Alternative Diagnoses: Assesses immunocompromise, chronic gastrointestinal disease, metabolic disorders, recent antibiotic use, recurrent episodes, or underlying medical complexity.",ko:"항목 7. 중증 또는 대안 진단의 위험 인자: 면역저하, 만성 위장관 질환, 대사 장애, 최근 항생제 사용, 반복 에피소드 또는 기저 의학적 복잡성을 평가한다.",xEn:"These factors may increase the likelihood of severe illness or suggest diagnoses other than routine viral gastroenteritis.",xKo:"이러한 요인들은 중증 질환의 가능성을 증가시키거나 일상적인 바이러스성 위장관염 외의 진단을 시사할 수 있다."},

    rubrics: [
      {
        id:"3-1", label_en:"Rubric 1", label_ko:"기준표 1", d1pts:40, d2pts:60,
        d1desc_en:"General Clinical History-Taking",
        d1desc_ko:"일반 임상 병력 청취",
        d2desc_en:"Case-Specific Diagnostic History — RSV Bronchiolitis with Respiratory Distress",
        d2desc_ko:"사례 특이 진단적 병력 청취 — 호흡곤란을 동반한 RSV 세기관지염",
        d1:[
          {id:"3-1-1-1",pts:4,en:"Item 1. Chief Complaint and Caregiver Concerns: Elicits the primary concerns (cough, feeding difficulty, increased work of breathing) and clarifies why care is being sought now.",ko:"항목 1. 주 호소 및 보호자 우려: 주된 우려사항(기침, 수유 곤란, 증가된 호흡 노력)을 청취하고 지금 진료를 찾는 이유를 명확히 한다.",xEn:"Establishes the clinical agenda and identifies symptoms most concerning to caregivers, including perceived deterioration.",xKo:"임상적 의제를 설정하고 인지된 악화를 포함하여 보호자에게 가장 우려되는 증상을 식별한다."},
          {id:"3-1-1-2",pts:10,en:"Item 2. History of Presenting Illness (Chronology and Symptom Progression): Obtains a clear timeline of symptom onset, progression, severity, and evolution from upper respiratory symptoms to respiratory distress.",ko:"항목 2. 현병력(시간 경과 및 증상 진행): 증상 발병, 진행, 중증도, 상기도 증상에서 호흡곤란으로의 진행에 대한 명확한 시간 경과를 청취한다.",xEn:"Understanding the sequence of illness is essential for differentiating bronchiolitis from alternative respiratory conditions and assessing disease progression.",xKo:"질환 순서를 이해하는 것은 세기관지염을 다른 호흡기 질환과 구별하고 질병 진행을 평가하는 데 필수적이다."},
          {id:"3-1-1-3",pts:5,en:"Item 3. Associated Symptoms and Review of Systems: Explores relevant respiratory, cardiac, gastrointestinal, neurologic, and constitutional symptoms, including both positive and negative findings.",ko:"항목 3. 동반 증상 및 계통 문진: 관련된 호흡기, 심장, 위장관, 신경, 전신 증상을 탐색하며 양성 및 음성 소견을 모두 포함한다.",xEn:"Helps identify complications and alternative diagnoses while refining diagnostic reasoning.",xKo:"진단적 추론을 정교화하면서 합병증과 대안 진단을 식별하는 데 도움이 된다."},
          {id:"3-1-1-4",pts:5,en:"Item 4. Past Medical, Birth, and Developmental History: Assesses gestational age, neonatal history, prior hospitalizations, chronic illnesses, congenital conditions, and developmental status.",ko:"항목 4. 과거 병력, 출생력 및 발달력: 재태 연령, 신생아력, 이전 입원, 만성 질환, 선천성 질환, 발달 상태를 평가한다.",xEn:"Prematurity and underlying cardiopulmonary disease substantially affect bronchiolitis severity and disposition decisions.",xKo:"미숙아와 기저 심폐 질환은 세기관지염의 중증도와 처치 결정에 상당한 영향을 미친다."},
          {id:"3-1-1-5",pts:3,en:"Item 5. Medication and Allergy History: Reviews current medications, prior bronchodilator use, recent treatments, and allergies.",ko:"항목 5. 약물 및 알레르기력: 현재 복용 약물, 이전 기관지확장제 사용, 최근 치료, 알레르기를 검토한다.",xEn:"Provides context regarding previous management attempts and treatment safety.",xKo:"이전 치료 시도와 치료 안전성에 관한 맥락을 제공한다."},
          {id:"3-1-1-6",pts:2,en:"Item 6. Immunization History: Confirms routine immunization status and any preventive respiratory therapies.",ko:"항목 6. 예방접종력: 정기 예방접종 상태와 호흡기 예방 치료를 확인한다.",xEn:"Important for general pediatric assessment and consideration of alternative infectious diagnoses.",xKo:"일반 소아 평가와 대안 감염 진단 고려에 중요하다."},
          {id:"3-1-1-7",pts:5,en:"Item 7. Family, Social, and Exposure History: Assesses household illness, daycare/nursery attendance, smoke exposure, family history of respiratory disease, and environmental factors.",ko:"항목 7. 가족력, 사회력 및 노출력: 가정 내 질환, 어린이집 출석, 연기 노출, 호흡기 질환 가족력, 환경 요인을 평가한다.",xEn:"Exposure history supports identification of viral illness and potential risk modifiers.",xKo:"노출력은 바이러스 질환의 식별과 잠재적 위험 조절 요인을 뒷받침한다."},
          {id:"3-1-1-8",pts:6,en:"Item 8. Assessment of Severity and Emergency Red Flags: Screens for apnea, cyanosis, lethargy, poor responsiveness, severe feeding impairment, dehydration, and signs of impending respiratory failure.",ko:"항목 8. 중증도 및 응급 적신호 평가: 무호흡, 청색증, 무기력, 부진한 반응성, 심한 수유 장애, 탈수, 임박한 호흡부전 징후를 선별한다.",xEn:"Recognition of severe illness is a core emergency medicine competency and directly influences urgency of intervention.",xKo:"중증 질환의 인식은 응급의학의 핵심 역량이며 중재의 긴급성에 직접적인 영향을 미친다."},
        ],
        d2:[
          {id:"3-1-2-1",pts:15,en:"Item 1. Respiratory Distress Characterization: Explores increased work of breathing, tachypnea, retractions, nasal flaring, grunting, progression of respiratory symptoms, and caregiver observations of breathing difficulty.",ko:"항목 1. 호흡곤란의 특성화: 증가된 호흡 노력, 빈호흡, 함몰, 비익 확장, 신음, 호흡기 증상의 진행, 보호자의 호흡 곤란 관찰을 탐색한다.",xEn:"Assessment of respiratory distress is the single most important component of bronchiolitis evaluation because it determines severity, need for respiratory support, and disposition.",xKo:"호흡곤란의 평가는 중증도, 호흡 지원의 필요성, 처치를 결정하므로 세기관지염 평가의 단일 가장 중요한 구성 요소다."},
          {id:"3-1-2-2",pts:12,en:"Item 2. Feeding and Hydration Assessment: Evaluates oral intake, duration of reduced feeding, ability to complete feeds, vomiting associated with feeds, urine output, and signs of dehydration.",ko:"항목 2. 수유 및 수분 상태 평가: 경구 섭취, 감소된 수유 기간, 수유 완료 능력, 수유 관련 구토, 소변량, 탈수 징후를 평가한다.",xEn:"Feeding impairment is a major determinant of hospitalization in bronchiolitis and often reflects overall respiratory burden.",xKo:"수유 장애는 세기관지염에서 입원의 주요 결정 요인이며 종종 전반적인 호흡 부담을 반영한다."},
          {id:"3-1-2-3",pts:10,en:"Item 3. Apnea, Cyanosis, and High-Risk Respiratory Events: Specifically asks about witnessed apnea, pauses in breathing, color change, cyanosis, limpness, or episodes requiring stimulation.",ko:"항목 3. 무호흡, 청색증 및 고위험 호흡 사건: 목격된 무호흡, 호흡 정지, 색 변화, 청색증, 늘어짐, 자극이 필요한 에피소드에 대해 구체적으로 질문한다.",xEn:"These are critical indicators of potentially life-threatening disease, particularly in infants.",xKo:"이들은 특히 영아에서 잠재적으로 생명을 위협하는 질환의 중요한 지표다."},
          {id:"3-1-2-4",pts:8,en:"Item 4. Characterization of Upper and Lower Respiratory Symptoms: Assesses rhinorrhea, nasal congestion, cough characteristics, wheezing, noisy breathing, and progression from upper respiratory symptoms to lower airway involvement.",ko:"항목 4. 상부 및 하부 호흡기 증상의 특성화: 콧물, 비강 충혈, 기침 특성, 천명, 시끄러운 호흡, 상기도 증상에서 하기도 침범으로의 진행을 평가한다.",xEn:"The classic progression from URI symptoms to bronchiolitis supports diagnostic accuracy and distinguishes bronchiolitis from other respiratory conditions.",xKo:"상기도 감염 증상에서 세기관지염으로의 전형적 진행은 진단 정확성을 뒷받침하고 세기관지염을 다른 호흡기 질환과 구별한다."},
          {id:"3-1-2-5",pts:7,en:"Item 5. Risk Factors for Severe Bronchiolitis: Investigates prematurity, chronic lung disease, congenital heart disease, neuromuscular disorders, immunodeficiency, previous NICU admission, and young age risk factors.",ko:"항목 5. 중증 세기관지염의 위험 인자: 미숙아, 만성 폐 질환, 선천성 심장 질환, 신경근 장애, 면역결핍, 이전 신생아 중환자실 입원, 어린 연령 위험 인자를 조사한다.",xEn:"Identification of high-risk patients significantly influences monitoring and disposition decisions.",xKo:"고위험 환자의 식별은 모니터링과 처치 결정에 상당한 영향을 미친다."},
          {id:"3-1-2-6",pts:5,en:"Item 6. Alternative Diagnosis and Respiratory Differential Screening: Screens for aspiration/choking events, foreign body aspiration, recurrent wheeze, asthma history, bacterial pneumonia symptoms, cardiac symptoms, and toxic exposures.",ko:"항목 6. 대안 진단 및 호흡기 감별 선별: 흡인/질식 사건, 이물 흡인, 재발성 천명, 천식 병력, 세균성 폐렴 증상, 심장 증상, 독성 노출을 선별한다.",xEn:"Important for excluding serious alternative diagnoses that can mimic bronchiolitis.",xKo:"세기관지염을 모방할 수 있는 중증 대안 진단을 배제하는 데 중요하다."},
          {id:"3-1-2-7",pts:3,en:"Item 7. Epidemiologic and Infectious Exposure History: Assesses sick contacts, sibling illness, daycare exposure, seasonal viral exposures, and recent respiratory infections.",ko:"항목 7. 역학적 및 감염 노출력: 환자 접촉, 형제 질환, 어린이집 노출, 계절성 바이러스 노출, 최근 호흡기 감염을 평가한다.",xEn:"Viral exposure history supports diagnostic confidence but contributes less directly to severity assessment than respiratory and feeding evaluation.",xKo:"바이러스 노출력은 진단 자신감을 뒷받침하지만 호흡 및 수유 평가보다 중증도 평가에 덜 직접적으로 기여한다."},

      {
        id:"3-2", label_en:"Rubric 2", label_ko:"기준표 2", d1pts:40, d2pts:60,
        d1desc_en:"General Clinical History-Taking",
        d1desc_ko:"일반 임상 병력 청취",
        d2desc_en:"Case-Specific Diagnostic History",
        d2desc_ko:"사례 특이 진단적 병력 청취",
        d1:[
          {id:"3-2-1-1",pts:10,en:"Item 1. History of Present Illness (HPI) Chronology & Progression: Elicits a detailed timeline of symptoms, specifically mapping the transition from upper respiratory tract symptoms (rhinorrhea) to lower respiratory tract involvement (cough, tachypnea, retractions) over the past 2 days.",ko:"항목 1. 현병력의 시간적 경과 및 진행: 증상의 상세한 시간 경과를 청취하며, 특히 지난 2일간 상기도 증상(콧물)에서 하기도 침범(기침, 빈호흡, 함몰)으로의 전환을 도식화한다.",xEn:"Documenting the exact day of illness is critical in viral bronchiolitis, as symptoms typically peak around days 3 to 5. Knowing where the infant is on this clinical trajectory helps the emergency clinician anticipate whether respiratory distress will worsen or plateau, directly influencing the decision to admit or discharge.",xKo:"바이러스성 세기관지염에서 정확한 질환 일수를 문서화하는 것이 중요하다. 증상은 일반적으로 3-5일째 정점에 이른다. 영아가 이 임상 경과의 어느 지점에 있는지 아는 것은 응급 임상의가 호흡곤란이 악화될지 정체될지 예측하는 데 도움이 되며, 입원 또는 퇴원 결정에 직접적인 영향을 미친다."},
          {id:"3-2-1-2",pts:10,en:"Item 2. Past Medical, Birth, & Developmental History: Investigates gestational age at birth (e.g., prematurity), neonatal intensive care unit (NICU) history, and the presence of any underlying congenital conditions.",ko:"항목 2. 과거 병력, 출생력 및 발달력: 출생 시 재태 연령(예: 미숙아), 신생아 중환자실(NICU) 병력, 기저 선천성 질환의 유무를 조사한다.",xEn:"A history of prematurity fundamentally alters an infant's baseline physiological reserve and pulmonary anatomy. Establishing birth history is a mandatory safety step that shifts the clinical threshold for admission and advanced respiratory support.",xKo:"미숙아 병력은 영아의 기저 생리학적 예비력과 폐 해부학을 근본적으로 변경한다. 출생력을 확립하는 것은 입원과 고급 호흡 지원에 대한 임상적 기준을 변경하는 필수 안전 단계다."},
          {id:"3-2-1-3",pts:10,en:"Item 3. Medications, Allergies, & Immunization Status: Confirms whether any home medications (e.g., antipyretics, over-the-counter cough suppressants, or unprescribed inhalers) were administered, documents allergies, and verifies routine childhood vaccination status.",ko:"항목 3. 복용 약물, 알레르기 및 예방접종 상태: 가정 약물(예: 해열제, 일반의약품 기침약, 처방되지 않은 흡입기)이 투여되었는지 확인하고, 알레르기를 문서화하며, 정기 소아 예방접종 상태를 확인한다.",xEn:"Verifying home medication use ensures safety and helps assess if symptom masking is occurring. Confirming immunization status helps risk-stratify the infant for other vaccine-preventable respiratory infections, such as pertussis or pneumococcus, which can mimic or complicate bronchiolitis.",xKo:"가정 약물 사용을 확인하는 것은 안전을 보장하고 증상 차폐가 일어나는지 평가하는 데 도움이 된다. 예방접종 상태를 확인하는 것은 영아가 세기관지염을 모방하거나 복잡하게 만들 수 있는 백일해 또는 폐렴구균과 같은 다른 백신 예방 가능한 호흡기 감염에 대한 위험을 계층화하는 데 도움이 된다."},
          {id:"3-2-1-4",pts:10,en:"Item 4. Review of Systems & Baseline Behavioral Status: Evaluates the infant's systemic behavior, specifically asking the caregiver about irritability, consolability, lethargy, and changes in normal sleep patterns.",ko:"항목 4. 계통 문진 및 기저 행동 상태: 영아의 전신 행동을 평가하며, 특히 보호자에게 짜증, 달래기 가능성, 무기력, 정상 수면 양상의 변화에 대해 질문한다.",xEn:"Infants in respiratory distress cannot verbalize fatigue. Caregiver reports of increased irritability, poor interaction, or an inability to be consoled are highly sensitive indicators of impending hypoxemic respiratory failure or severe exhaustion.",xKo:"호흡곤란이 있는 영아는 피로를 언어로 표현할 수 없다. 증가된 짜증, 부진한 상호작용 또는 달래기 불능에 대한 보호자의 보고는 임박한 저산소혈증성 호흡부전 또는 심한 피로의 매우 민감한 지표다."},
        ],
        d2:[
          {id:"3-2-2-1",pts:15,en:"Item 1. Characterization of Respiratory Distress & Apnea Screening: Explicitly questions the caregiver regarding witnessed pauses in breathing (apnea), episodes of color change (cyanosis), and the severity of retractions or nasal flaring observed at home.",ko:"항목 1. 호흡곤란의 특성화 및 무호흡 선별: 보호자에게 목격된 호흡 정지(무호흡), 색 변화 에피소드(청색증), 가정에서 관찰된 함몰이나 비익 확장의 중증도에 대해 명시적으로 질문한다.",xEn:"Apnea is a hallmark, life-threatening complication of RSV in infants. Direct inquiry regarding apneic spells is non-negotiable; a positive history mandates continuous inpatient cardiopulmonary monitoring regardless of how well the infant appears on the current ED physical exam.",xKo:"무호흡은 영아 RSV의 특징적이고 생명을 위협하는 합병증이다. 무호흡 발작에 대한 직접적인 질문은 협상 불가능하다. 양성 병력은 영아가 현재 응급실 신체 검진에서 얼마나 잘 보이든 관계없이 지속적인 입원 심폐 모니터링을 명령한다."},
          {id:"3-2-2-2",pts:15,en:"Item 2. Assessment of Oral Hydration Tolerance & Fluid Balance: Quantifies the degree of feeding difficulty (e.g., exact volume of fluid intake compared to baseline) and assesses end-organ perfusion by inquiring about the specific frequency of wet diapers over the last 12 to 24 hours.",ko:"항목 2. 경구 수분 섭취 내성 및 체액 균형 평가: 수유 곤란의 정도(예: 기저와 비교한 정확한 수분 섭취량)를 정량화하고, 지난 12-24시간 동안 젖은 기저귀의 구체적인 빈도에 대해 문진하여 말단 장기 관류를 평가한다.",xEn:"Infants with marked tachypnea (RR 54) cannot safely coordinate sucking, swallowing, and breathing, leading to rapid dehydration from poor intake and increased insensible losses. A history of only one wet diaper since morning confirms significant intravascular volume depletion, dictating the need for IV or enteral fluid resuscitation alongside respiratory support.",xKo:"현저한 빈호흡(RR 54)이 있는 영아는 빨기, 삼키기, 호흡을 안전하게 조정할 수 없어 부진한 섭취와 증가된 불감 손실로 인해 급속한 탈수로 이어진다. 아침부터 젖은 기저귀가 하나뿐이라는 병력은 상당한 혈관 내 체액 고갈을 확인하며, 호흡 지원과 함께 정맥 또는 장내 수액 소생술의 필요성을 결정한다."},
          {id:"3-2-2-3",pts:15,en:"Item 3. Risk Stratification for Severe Viral Bronchiolitis: Systematically screens for established high-risk comorbidities, focusing strictly on congenital heart disease, chronic lung disease of prematurity (bronchopulmonary dysplasia), and underlying immunodeficiencies.",ko:"항목 3. 중증 바이러스성 세기관지염의 위험 계층화: 확립된 고위험 동반질환을 체계적으로 선별하며, 특히 선천성 심장 질환, 미숙아의 만성 폐 질환(기관지폐이형성증), 기저 면역결핍에 집중한다.",xEn:"Identifying these anatomical or physiological vulnerabilities is the cornerstone of pediatric emergency decision-making for RSV. Infants with these comorbidities are at exceptionally high risk for rapid decompensation, prolonged hospitalization, and the need for mechanical ventilation.",xKo:"이러한 해부학적 또는 생리학적 취약성을 식별하는 것은 RSV에 대한 소아 응급 의사결정의 초석이다. 이러한 동반질환이 있는 영아는 급속한 대상부전, 장기간 입원, 기계 환기의 필요성에 대해 매우 높은 위험에 있다."},
          {id:"3-2-2-4",pts:15,en:"Item 4. Exclusion of Alternative Diagnoses & Environmental Triggers: Rules out a history of sudden choking or sputtering (evaluating for foreign body aspiration), investigates family history of atopy/asthma, assesses sick contacts (e.g., older sibling with a \"cold\"), and screens for environmental tobacco smoke exposure.",ko:"항목 4. 대안 진단 및 환경 유발 요인 배제: 갑작스러운 질식이나 발작적 기침의 병력을 배제하고(이물 흡인 평가), 아토피/천식의 가족력을 조사하며, 환자 접촉(예: \"감기\"에 걸린 형/누나)을 평가하고, 환경 담배 연기 노출을 선별한다.",xEn:"The clinician must ensure the presentation is not an acute mechanical airway obstruction or early-onset reactive airway disease. Furthermore, second-hand smoke is a severe airway irritant that paralyzes mucociliary clearance, directly worsening the severity and duration of the infant's respiratory distress.",xKo:"임상의는 발현이 급성 기계적 기도 폐쇄나 조기 발생 반응성 기도 질환이 아닌지 확인해야 한다. 또한, 간접흡연은 점액섬모 청소를 마비시키는 심한 기도 자극제로, 영아의 호흡곤란 중증도와 지속 시간을 직접적으로 악화시킨다."},

      {
        id:"3-3", label_en:"Rubric 3", label_ko:"기준표 3", d1pts:40, d2pts:60,
        d1desc_en:"General Clinical History-Taking",
        d1desc_ko:"일반 임상 병력 청취",
        d2desc_en:"Case-Specific Diagnostic History — RSV Bronchiolitis",
        d2desc_ko:"사례 특이 진단적 병력 청취 — RSV 세기관지염",
        d1:[
          {id:"3-3-1-1",pts:10,en:"Item 1. History of Presenting Illness (structured): Systematically elicits onset, duration, progression, and character of the coryzal-then-respiratory illness (rhinorrhea, cough, work of breathing, feeding change), with temporal sequencing and aggravating/relieving factors.",ko:"항목 1. 현병력(구조화된 청취): 콧물 후 호흡기 질환(콧물, 기침, 호흡 노력, 수유 변화)의 발병, 지속 시간, 진행, 양상을 체계적으로 청취하며 시간적 순서와 악화/완화 요인을 포함한다.",xEn:"The backbone of any history and the highest-yield general element; a clear timeline (2 days of URI symptoms, then escalating distress over 12 hours) frames both the diagnosis and where the child sits on the bronchiolitis trajectory.",xKo:"모든 병력 청취의 근간이자 가장 높은 정보 수율을 갖는 일반 항목이다. 명확한 경과(2일간의 상기도 감염 증상, 이후 12시간에 걸친 호흡 곤란 악화)는 진단과 아동이 세기관지염 진행에서 어느 위치에 있는지의 틀을 형성한다."},
          {id:"3-3-1-2",pts:7,en:"Item 2. Targeted Review of Systems & Pertinent Negatives: Screens related systems (respiratory, ENT, GI, GU, skin, neuro) to surface positives and clinically meaningful negatives.",ko:"항목 2. 표적 계통 문진 및 관련 음성 소견: 관련 계통(호흡기, 이비인후, 소화기, 비뇨기, 피부, 신경)을 선별하여 양성 소견과 임상적으로 의미 있는 음성 소견을 드러낸다.",xEn:"The pertinent negatives here (no apnea, no cyanosis, no high fever, no vomiting) actively narrow the picture toward uncomplicated bronchiolitis and away from sepsis, pneumonia, and decompensation, so this ranks above the remaining general items.",xKo:"이 사례에서 관련 음성 소견(무호흡 없음, 청색증 없음, 고열 없음, 구토 없음)은 패혈증, 폐렴, 대상부전에서 벗어나 합병증 없는 세기관지염 쪽으로 적극적으로 좁히므로, 나머지 일반 항목보다 높은 순위를 차지한다."},
          {id:"3-3-1-3",pts:4,en:"Item 3. Past Medical & Surgical History: Prior illnesses, hospitalizations, NICU stay, and any prior respiratory or airway issues.",ko:"항목 3. 과거 병력 및 수술력: 이전 질환, 입원력, 신생아 중환자실 입원, 이전 호흡기 또는 기도 문제.",xEn:"Important context and a flag for prior airway/respiratory problems; the severity-defining comorbidities (prematurity, cardiac/lung disease) are scored in Domain 2 to avoid double-counting, so the general item stays modest.",xKo:"이전 기도/호흡기 문제에 대한 중요한 맥락 및 표시이지만, 중증도를 결정하는 동반질환(미숙아, 심장/폐 질환)은 중복 채점을 피하기 위해 영역 2에서 평가하므로, 일반 항목은 적당한 비중을 유지한다."},
          {id:"3-3-1-4",pts:4,en:"Item 4. Medications & Allergies: Current/recent medications — including any home bronchodilators, steroids, or recent antibiotics — and documented drug allergies.",ko:"항목 4. 복용 약물 및 알레르기: 현재/최근 복용 약물 — 가정 기관지확장제, 스테로이드, 최근 항생제 포함 — 및 기록된 약물 알레르기.",xEn:"Directly relevant because prior bronchodilator/steroid use hints at a different (recurrent-wheeze) phenotype and shapes the therapeutic plan; a brief but bounded inquiry.",xKo:"이전 기관지확장제/스테로이드 사용은 다른(재발성 천명) 표현형을 시사하고 치료 계획에 영향을 미치므로 직접적으로 관련된다. 간단하지만 한정된 질문이다."},
          {id:"3-3-1-5",pts:3,en:"Item 5. Immunization Status: Confirms up-to-date routine vaccination for age.",ko:"항목 5. 예방접종 상태: 연령에 맞는 최신 정기 예방접종 여부 확인.",xEn:"A core pediatric element that informs invasive-bacterial and pertussis risk; kept general here, with RSV-specific immunoprophylaxis credited under Domain 2.",xKo:"침습성 세균감염과 백일해 위험을 알려주는 핵심 소아 항목이다. 여기서는 일반 항목으로 유지하고 RSV 특이 면역예방은 영역 2에서 평가한다."},
          {id:"3-3-1-6",pts:3,en:"Item 6. Birth & Developmental History: Perinatal course, gestational age, and developmental trajectory.",ko:"항목 6. 출생력 및 발달력: 주산기 경과, 재태 연령, 발달 궤적.",xEn:"A standard component; weighted modestly as a general element, with the disposition-critical detail (prematurity as a severe-disease risk factor) rewarded in Domain 2.",xKo:"표준 구성 요소이며, 일반 항목으로서 적당히 가중치를 부여한다. 처치에 중요한 세부사항(중증 질환 위험 요인으로서의 미숙아)은 영역 2에서 평가한다."},
          {id:"3-3-1-7",pts:3,en:"Item 7. Family History (general): Heritable conditions and relevant family medical background (e.g., atopy/asthma).",ko:"항목 7. 가족력(일반): 유전 가능한 질환 및 관련 가족 의학 배경(예: 아토피/천식).",xEn:"A baseline competency; weighted low as the case has no clear familial driver, and infectious household clustering is credited under Domain 2.",xKo:"기본 역량이며, 본 사례에 명확한 가족적 요인이 없고 가정 내 감염성 집단발생은 영역 2에서 평가하므로 낮은 가중치를 부여한다."},
          {id:"3-3-1-8",pts:3,en:"Item 8. Social History & Caregiver Context: Home environment, caregivers, and living situation.",ko:"항목 8. 사회력 및 보호자 환경: 가정 환경, 보호자, 생활 상황.",xEn:"Provides context and informs the safety of home monitoring versus admission; the case-relevant nursery exposure and household smoke are scored in Domain 2, so the general item stays modest.",xKo:"맥락을 제공하고 가정 모니터링 대 입원의 안전성을 알려준다. 사례 관련 어린이집 노출과 가정 내 흡연은 영역 2에서 평가하므로 일반 항목은 적당한 비중을 유지한다."},
          {id:"3-3-1-9",pts:3,en:"Item 9. Collateral History & Developmentally-Appropriate Communication: Obtains the entire history from the caregiver with organized, empathetic questioning suited to a non-verbal infant.",ko:"항목 9. 보호자 병력 청취 및 발달 수준에 맞는 의사소통: 비언어 영아에 적합한 체계적이고 공감적인 질문으로 보호자로부터 전체 병력을 청취한다.",xEn:"A distinctly pediatric skill — an 8-month-old contributes no verbal history, so caregiver-observed feeding, breathing, and diaper data are the history — explicitly assessed but kept modest within a content-focused rubric.",xKo:"소아과만의 고유한 기술 — 8개월 영아는 언어적 병력을 제공하지 못하므로 보호자가 관찰한 수유, 호흡, 기저귀 정보가 병력 전부를 차지한다 — 이므로 명시적으로 평가하되, 내용 중심의 평가 기준에서 적당한 비중을 유지한다."},
        ],
        d2:[
          {id:"3-3-2-1",pts:11,en:"Item 1. Respiratory Severity & Work-of-Breathing History (caregiver-observed): Elicits caregiver-reported retractions, nasal flaring, grunting, rate and pattern of breathing, audible wheeze, exhaustion/listlessness, and any home oxygen-saturation readings.",ko:"항목 1. 호흡 중증도 및 호흡 노력 병력(보호자 관찰): 보호자가 보고한 함몰, 비익 확장, 신음, 호흡 속도와 양상, 들리는 천명, 피로/무기력, 가정에서의 산소 포화도 측정값을 청취한다.",xEn:"Severity grading is the pivotal issue of the case and the primary driver of oxygen, feeding support, and admission decisions (this child is hypoxemic at 90% with retractions), so it carries the highest weight in the rubric.",xKo:"중증도 등급은 본 사례의 핵심 쟁점이며 산소, 수유 지원, 입원 결정의 일차 동인이다(이 아동은 90% 저산소혈증과 함몰이 있음). 따라서 평가 기준에서 가장 높은 가중치를 부여한다."},
          {id:"3-3-2-2",pts:9,en:"Item 2. Apnea & Acute Color-Change/Cyanosis Screen: Specifically asks about witnessed apnea, pauses in breathing, perioral or central cyanosis, and episodes of going limp or unresponsive.",ko:"항목 2. 무호흡 및 급성 색 변화/청색증 선별: 목격된 무호흡, 호흡 정지, 입 주변 또는 중심성 청색증, 늘어지거나 무반응이 되는 에피소드에 대해 구체적으로 질문한다.",xEn:"Apnea can be the presenting or sole danger sign in infants with bronchiolitis and is an absolute admission/monitoring trigger; a deliberate, explicit screen (rather than inferring from \"no apnea\") is the mark of safe infant history-taking, warranting the second-highest weight.",xKo:"무호흡은 세기관지염 영아의 발현 또는 유일한 위험 징후일 수 있으며 절대적인 입원/모니터링 유발 요인이다. (\"무호흡 없음\"을 추론하는 것이 아닌) 의도적이고 명시적인 선별은 안전한 영아 병력 청취의 표시이며 두 번째로 높은 가중치를 부여한다."},
          {id:"3-3-2-3",pts:9,en:"Item 3. Feeding Adequacy & Hydration Assessment: Quantifies proportion of normal intake, ability to feed through the respiratory effort, number of wet diapers/last void, vomiting with coughing, and tears/activity.",ko:"항목 3. 수유 적절성 및 수분 상태 평가: 정상 섭취량의 비율, 호흡 노력 중에도 수유 가능 여부, 젖은 기저귀 수/마지막 배뇨, 기침과 동반된 구토, 눈물/활동을 정량화한다.",xEn:"In bronchiolitis, feeding is both a severity proxy and the main hydration measure, and reduced intake/output is a leading admission criterion (one wet diaper since morning is a red flag here), giving it equally high value.",xKo:"세기관지염에서 수유는 중증도 대용 척도이자 주요 수분 측정 지표이며, 감소된 섭취/배출은 주요 입원 기준이다(여기서 아침부터 젖은 기저귀가 하나뿐인 것은 적신호다). 따라서 동등하게 높은 가치를 부여한다."},
          {id:"3-3-2-4",pts:8,en:"Item 4. Risk Factors for Severe Disease & RSV Immunoprophylaxis: Prematurity and gestational age, age in weeks, congenital heart disease, chronic lung disease, immunodeficiency, neuromuscular disease or genetic syndromes, and RSV prophylaxis status (nirsevimab/palivizumab, maternal RSV vaccination).",ko:"항목 4. 중증 질환의 위험 인자 및 RSV 면역예방: 미숙아 및 재태 연령, 주 단위 연령, 선천성 심장 질환, 만성 폐 질환, 면역결핍, 신경근 질환 또는 유전 증후군, RSV 예방 상태(니르세비맙/팔리비주맙, 산모 RSV 백신 접종).",xEn:"These factors substantially raise the risk of rapid deterioration and shift the threshold toward admission and closer observation; identifying them (even when reassuringly absent) is core disposition reasoning and is weighted heavily.",xKo:"이러한 요인들은 급속한 악화 위험을 상당히 높이고 입원 및 면밀한 관찰의 기준을 낮춘다. 이들을 식별하는 것은(안심되게 부재한 경우라도) 핵심 처치 추론이며 높은 가중치를 부여한다."},
          {id:"3-3-2-5",pts:7,en:"Item 5. Differential for Infant Wheeze / First-Time Respiratory Distress: Sudden choking or witnessed aspiration event (foreign body), feeding-associated sweating or cyanosis and poor weight gain (congenital cardiac disease/heart failure), stridor or prior noisy breathing (airway anomaly), and prior wheezing episodes (early viral-induced wheeze/asthma).",ko:"항목 5. 영아 천명 / 첫 호흡곤란의 감별진단: 갑작스러운 질식 또는 목격된 흡인 사건(이물), 수유 관련 발한이나 청색증 및 체중 증가 부진(선천성 심장 질환/심부전), 협착음 또는 이전 시끄러운 호흡(기도 기형), 이전 천명 에피소드(초기 바이러스 유발 천명/천식).",xEn:"Wheeze in an infant is not synonymous with bronchiolitis; deliberately screening for the do-not-miss mimics — foreign body and occult cardiac disease — is a hallmark of safe history-taking (the vignette's \"no aspiration events\" and \"no cardiac history\" reflect exactly these questions) and is weighted accordingly.",xKo:"영아의 천명은 세기관지염과 동일하지 않다. 놓치면 안 되는 모방 질환 — 이물과 잠재성 심장 질환 — 을 의도적으로 선별하는 것은 안전한 병력 청취의 특징이며(본 사례의 \"흡인 사건 없음\"과 \"심장 병력 없음\"은 정확히 이러한 질문을 반영함), 그에 따라 가중치를 부여한다."},
          {id:"3-3-2-6",pts:6,en:"Item 6. Onset, Progression & Stage of Illness: Establishes the day of illness, direction of trend (worsening vs. plateauing), and prior peak severity.",ko:"항목 6. 발병, 진행 및 질환 단계: 질환 일수, 경향의 방향(악화 vs 정체), 이전 최고 중증도를 확립한다.",xEn:"Bronchiolitis typically peaks around days 3–5, so knowing the stage informs both anticipatory guidance and the likelihood of further deterioration after discharge; solid management value.",xKo:"세기관지염은 일반적으로 3-5일째에 정점에 이르므로, 단계를 아는 것은 예측 지침과 퇴원 후 추가 악화 가능성을 모두 알려준다. 확실한 치료적 가치가 있다."},
          {id:"3-3-2-7",pts:5,en:"Item 7. Epidemiologic Exposures & Environmental Triggers: Sick contacts (the recently unwell sibling), nursery/daycare attendance, seasonality, and — importantly — tobacco smoke or vaping exposure in the home.",ko:"항목 7. 역학적 노출 및 환경 유발 요인: 환자 접촉(최근 아픈 형제), 어린이집 출석, 계절성, 그리고 — 중요하게 — 가정 내 담배 연기 또는 전자담배 노출.",xEn:"Sick contacts support the viral diagnosis, while tobacco-smoke exposure is a key modifiable factor that worsens disease and informs counseling; a focused, high-relevance line of questioning.",xKo:"환자 접촉은 바이러스 진단을 뒷받침하며, 담배 연기 노출은 질환을 악화시키고 상담에 정보를 제공하는 주요 수정 가능 요인이다. 집중된, 높은 관련성의 질문 라인이다."},
          {id:"3-3-2-8",pts:5,en:"Item 8. Red Flags for Impending Respiratory Failure & Deterioration: Worsening or new lethargy/altered responsiveness, grunting, head-bobbing, increasing exhaustion, fewer wet diapers, and parental sense of deterioration — plus high fever raising concern for secondary bacterial pneumonia.",ko:"항목 8. 임박한 호흡부전 및 악화의 적신호: 악화되거나 새로 나타난 무기력/반응성 변화, 신음, 머리 흔들림, 증가하는 피로, 적은 젖은 기저귀, 보호자가 인지하는 악화 — 그리고 이차성 세균성 폐렴에 대한 우려를 유발하는 고열.",xEn:"Identifying the infant tipping toward respiratory failure is critical for safe triage and is directly relevant given the borderline gas (rising pCO₂) and hypoxemia; weighted as a focused safety net given the currently alert, moderately-distressed presentation.",xKo:"호흡부전으로 기울고 있는 영아를 식별하는 것은 안전한 진료 분류에 중요하며 경계 수준의 혈가스(상승하는 pCO₂)와 저산소혈증을 고려할 때 직접적으로 관련이 있다. 현재 각성 상태이고 중등도 호흡곤란을 보이는 발현을 고려하여 집중된 안전망으로서의 가중치를 부여한다."},

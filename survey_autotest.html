    h(DomainRank,{items:rubric.d2,order:d2Order,setOrder:setD2Order,
      label:t("Domain 2: Case-Specific Diagnostic History","영역 2: 사례별 진단 추론")}),
    h(Card,{style:{padding:"20px 22px",marginBottom:20}},
      h('p',{style:{fontSize:14,fontWeight:700,color:navy,margin:"0 0 10px"}},
        t("Overall Comment (optional)","전반적인 의견 (선택사항)")),
      h('textarea',{
        placeholder:t("Any comments or suggestions for this rubric?","이 루브릭에 대한 의견이나 제안이 있으신가요?"),
        defaultValue:finalCmt,key:"finalcmt",onInput:e=>{const v=e.target.value; finalCmtRef.current=v; if(bCommentTimer.current) clearTimeout(bCommentTimer.current); bCommentTimer.current=setTimeout(()=>{setFinalCmt_(v); onBDraftChange(d1OrderRef.current,d2OrderRef.current,v);},600);},
        style:{width:"100%",padding:"12px 14px",fontSize:14,
          border:"1px solid "+cardBd,borderRadius:8,resize:"vertical",
          fontFamily:ffs,boxSizing:"border-box",minHeight:80}})
    ),
    h('div',{style:{display:"flex",gap:12,alignItems:"center"}},
      h('button',{onClick:onBack,
        style:{padding:"14px 20px",borderRadius:10,border:"2px solid "+navy,
          background:white,color:navy,fontSize:15,fontWeight:600,
          cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}},
        "← "+t("Back","이전")),
      h(PrimaryBtn,{
        onClick:()=>{ onSubmit(rubric.id,{...partAData,d1Order,d2Order,finalCmt}); scrollTop(); }},
        nextLabel())
    )
  );
}

// ─── DONE SCREEN (two states: pre-submit and post-submit) ─────────────────────
function DoneScreen({ responses, demographics, preSubmitState, onBack }) {
  const lang = useLang();
  const t = (en,ko) => T(en,ko,lang);
  // preSubmitState: if true, show pre-submit UI (used by preview)
  const [status, setStatus] = useState(preSubmitState ? "idle" : "idle");
  const [pid] = useState(()=>"P-"+Math.random().toString(36).slice(2,8).toUpperCase());
  const blob = new Blob([JSON.stringify(responses,null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);

  const submit = async () => {
    setStatus("sending");
    try {
      const rows=[];
      // Build a demographics payload that gets attached to every row
      const dem = demographics || {};
      const demPayload = {
        dem_exp: dem.exp || null,
        dem_country_practice: dem.country_practice || null,
        dem_country_training: dem.country_training || null,
        dem_setting: dem.setting || null,
        dem_setting_other: (dem.setting === "other" ? (dem.setting_other||"").trim() : null) || null,
        dem_specialty: dem.specialty || null,
        dem_specialty_sub: (dem.specialty === "subspecialty" ? (dem.specialty_sub||"").trim() : null) || null,
        dem_specialty_other: (dem.specialty === "other" ? (dem.specialty_other||"").trim() : null) || null,
        dem_ai_use: dem.ai_use || null,
      };
      for(const [rubricId,rd] of Object.entries(responses)){
        const parts=rubricId.split("-");
        const caseNo=parseInt(parts[0]), rubricNo=parseInt(parts[1]);
        const rubricLabel="C"+caseNo+"-R"+rubricNo; // e.g. "C1-R2" — unambiguous
        const base={participant_id:pid,lang,case_no:caseNo,rubric_no:rubricNo,
          rubric_id:rubricLabel,overall_comment:rd.finalCmt||"",...demPayload};
        // Agreement rows — one per item
        for(const [itemId,agreed] of Object.entries(rd.partA||{})){
          rows.push({...base,item_id:itemId,agreed,
            comment:(rd.comments||{})[itemId]||"",
            domain:null,rank:null});
        }
        // Ranking rows — one per item per domain
        (rd.d1Order||[]).forEach((itemId,i)=>{
          rows.push({...base,item_id:itemId,agreed:null,comment:"",
            domain:"d1",rank:i+1});
        });
        (rd.d2Order||[]).forEach((itemId,i)=>{
          rows.push({...base,item_id:itemId,agreed:null,comment:"",
            domain:"d2",rank:i+1});
        });
      }
      if(rows.length===0) return;
      const res=await fetch(SUPABASE_URL+"/rest/v1/responses",{
        method:"POST",
        headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+SUPABASE_KEY,"Prefer":"return=minimal"},
        body:JSON.stringify(rows)
      });
      if(res.ok) { setStatus("success"); try{localStorage.removeItem(LS_KEY);}catch(e){} }
      else { console.error(await res.text()); setStatus("error"); }
    } catch(e){ console.error(e); setStatus("error"); }
  };

  // ── POST-SUBMIT (success) ───────────────────────────────────────────────────
  if(status==="success") return h(PageWrap,null,
    h('div',{style:{textAlign:"center",padding:"64px 0 48px"}},
      h('div',{style:{width:80,height:80,borderRadius:"50%",
        background:"linear-gradient(135deg,"+green+",#059669)",
        margin:"0 auto 28px",display:"flex",alignItems:"center",justifyContent:"center"}},
        h('svg',{width:38,height:38,viewBox:"0 0 24 24",fill:"none",
          stroke:white,strokeWidth:2.5,strokeLinecap:"round",strokeLinejoin:"round"},
          h('path',{d:"M20 6L9 17l-5-5"}))),
      h('h1',{style:{fontSize:26,fontWeight:700,color:navy,margin:"0 0 14px",fontFamily:ffs}},
        t("Your responses have been recorded.","응답이 기록되었습니다.")),
      h('p',{style:{fontSize:15,color:muted,lineHeight:1.75,maxWidth:480,margin:"0 auto 32px"}},
        t("Thank you for completing this survey. Your clinical expertise and time are genuinely appreciated — responses like yours are what make this research meaningful.",
          "이 설문을 완료해 주셔서 감사합니다. 귀하의 임상 전문성과 시간은 진심으로 소중하며, 귀하와 같은 응답이 이 연구를 의미 있게 만들어 줍니다.")),
      h('p',{style:{fontSize:14,color:muted}},
        t("Participant ID: ","참여자 ID: "),
        h('strong',{style:{color:navy,marginLeft:4}},pid)),
      h('div',{style:{marginTop:24}},
        h('a',{href:url,download:"rubric_responses_"+pid+".json",
          style:{color:navyMid,fontSize:14,fontWeight:600,textDecoration:"underline"}},
          t("Download a copy of your responses","응답 사본 다운로드")))
    )
  );

  // ── PRE-SUBMIT (idle / sending / error) ─────────────────────────────────────
  return h(PageWrap,null,
    h('div',{style:{textAlign:"center",padding:"48px 0 36px"}},
      h('h1',{style:{fontSize:26,fontWeight:700,color:navy,margin:"0 0 12px",fontFamily:ffs}},
        t("You've reached the end of the survey.","설문의 끝에 도달하셨습니다.")),
      h('p',{style:{fontSize:15,color:muted,lineHeight:1.75,maxWidth:500,margin:"0 auto"}},
        t("When you're ready, click the button below to submit your responses.",
          "준비가 되시면 아래 버튼을 클릭하여 응답을 제출해 주세요."))
    ),
    h(Card,{style:{padding:"32px 36px"}},
      h('p',{style:{fontSize:14,color:muted,textAlign:"center",margin:"0 0 24px"}},
        t("Participant ID: ","참여자 ID: "),
        h('strong',{style:{color:navy,fontSize:15,marginLeft:4}},pid)),
      status==="idle" && h('div',null,
        h(PrimaryBtn,{onClick:submit},t("Submit Responses →","응답 제출 →")),
        h('div',{style:{textAlign:"center",marginTop:14}},
          h('button',{onClick:onBack,
            style:{background:"none",border:"none",color:muted,fontSize:14,
              cursor:"pointer",textDecoration:"underline",fontFamily:ffs}},
            "← "+t("Back to last rubric","마지막 루브릭으로 돌아가기")))
      ),
      status==="sending" && h('div',{style:{textAlign:"center",padding:"16px",
        background:navyL,borderRadius:10,color:navy,fontSize:15,fontWeight:600}},
        t("Sending…","전송 중…")),
      status==="error" && h('div',null,
        h('div',{style:{padding:"14px",marginBottom:14,background:redBg,
          border:"1px solid "+redBd,borderRadius:10,color:red,fontSize:14,textAlign:"center"}},
          t("Something went wrong with your submission. You can try submitting again, or download a backup copy of your responses and contact the research team.",
            "제출 중 문제가 발생했습니다. 다시 시도하거나, 응답 사본을 다운로드하여 연구팀에 연락해 주세요.")),
        h(PrimaryBtn,{onClick:submit},t("Try again →","다시 시도 →"))),
      h('div',{style:{borderTop:"1px solid "+cardBd,paddingTop:20,marginTop:24,
        textAlign:"center"}},
        h('a',{href:url,download:"rubric_responses_"+pid+".json",
          style:{color:muted,fontSize:13,textDecoration:"underline"}},
          "📥 "+t("Download a copy of your responses","응답 백업 사본 다운로드")))
    )
  );
}

// ─── MAIN APP ────────────────────────────────────────────────────────────────
const LS_KEY = "rubric_survey_session_v1";

function App() {
  // ── Restore from localStorage if available ──────────────────────────────
  const saved = (() => { try { const s=localStorage.getItem(LS_KEY); return s?JSON.parse(s):null; } catch(e){return null;} })();

  const [lang, setLang] = useState((saved && saved.lang) || "en");
  const [step, setStep] = useState((saved && saved.step) || "consent");
  const [ci, setCi] = useState((saved && saved.ci) || 0);
  const [ri, setRi] = useState((saved && saved.ri) || 0);
  const [partAData, setPartAData] = useState((saved && saved.partAData) || null);
  const [partADraft, setPartADraft] = useState((saved && saved.partADraft) || {});
  const [partBDraft, setPartBDraft] = useState((saved && saved.partBDraft) || {});
  const [responses, setResponses] = useState((saved && saved.responses) || {});
  const [demographics, setDemographics] = useState((saved && saved.demographics) || null);

  const totalR = CASES.reduce((s,c)=>s+c.rubrics.length,0);
  const doneR  = CASES.slice(0,ci).reduce((s,c)=>s+c.rubrics.length,0)+ri;
  const curCase   = CASES[ci];
  const curRubric = curCase ? curCase.rubrics[ri] : null;

  // ── Autosave to localStorage on every state change ──────────────────────
  React.useEffect(() => {
    if (step === "consent") return; // don't save before they start
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({lang,step,ci,ri,partAData,partADraft,partBDraft,responses,demographics}));
    } catch(e) {}
  }, [lang, step, ci, ri, partAData, responses, demographics]);

  const goPartB = useCallback((aData)=>{ setPartAData(aData); setStep("partB"); scrollTop(); },[]);
  const goBack = useCallback(()=>{
    // If on partA of a non-first rubric, go to partB of previous rubric
    if(ri > 0){ setRi(ri-1); setStep("partB"); scrollTop(); }
    else if(ci > 0){ setCi(ci-1); setRi(CASES[ci-1].rubrics.length-1); setStep("partB"); scrollTop(); }
    else { setStep("instr"); scrollTop(); }
  },[ci,ri]);
  const submitRubric = useCallback((id,data)=>{
    setResponses(r=>({...r,[id]:data}));
    setPartADraft(d=>{ const n={...d}; delete n[id]; return n; });
    setPartBDraft(d=>{ const n={...d}; delete n[id]; return n; });
    const nr=ri+1;
    if(nr<curCase.rubrics.length){ setRi(nr); setStep("partA"); }
    else { const nc=ci+1; if(nc<CASES.length){setCi(nc);setRi(0);setStep("partA");}else setStep("done"); }
    scrollTop();
  },[ci,ri,curCase]);

  const breadcrumb = (step==="partA"||step==="partB") && curCase && curRubric
    ? h('span',null,
        T("Case "+(ci+1)+" of "+CASES.length,
          "사례 "+(ci+1)+"/"+CASES.length, lang),
        h('span',{style:{margin:"0 6px",color:muted}},"›"),
        h('strong',{style:{fontWeight:700}},
          T("Rubric "+(ri+1)+" of "+curCase.rubrics.length,
            "기준표 "+(ri+1)+"/"+curCase.rubrics.length, lang)))
    : null;

  // Track which cases have had their vignette auto-shown
  const seenCasesRef = React.useRef(new Set());
  const [showVigModal, setShowVigModal] = React.useState(false);

  // Auto-open modal for first rubric of each new case (mobile only)
  React.useEffect(()=>{
    if(typeof window !== 'undefined' && window.innerWidth < 768) {
      if(!seenCasesRef.current.has(ci)) {
        seenCasesRef.current.add(ci);
        setShowVigModal(true);
      }
    }
  }, [ci]);

  const [isMobile, setIsMobile] = useState(false); // set after mount via useEffect
  React.useEffect(() => {
    // Set initial value after mount (safe - window is available)
    setIsMobile(window.innerWidth < 768);
    const onResize = () => setIsMobile(window.innerWidth < 768);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  // SL: layout shell — rendered inline (NOT as a nested component) to avoid remount
  const slStyle = {maxWidth:1140, margin:"0 auto",
    padding: isMobile ? "12px 14px 100px" : "28px 24px 80px",
    display:"flex", gap:24, alignItems:"flex-start"};

  return h(LangCtx.Provider,{value:lang},
    h('div',{style:{background:pageBg,minHeight:"100vh",fontFamily:ffs}},
      // Mobile floating "View Case" button — shown when modal is closed and on mobile
      isMobile && curCase && !showVigModal && step !== "done" && step !== "welcome" && step !== "instr" && step !== "consent" && step !== "demographics" &&
        h('div',{style:{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",zIndex:500}},
          h('button',{
            onClick:()=>setShowVigModal(true),
            style:{background:navy,color:white,border:"none",borderRadius:20,
                   padding:"10px 20px",fontSize:13,fontWeight:600,cursor:"pointer",
                   boxShadow:"0 4px 16px rgba(0,0,0,0.25)",display:"flex",
                   alignItems:"center",gap:6}},
            "📋 ", T("View Case","사례 보기",lang)
          )
        ),
      h(StickyHeader,{lang,setLang,doneR,totalR,breadcrumb}),
      step==="consent" && h(ConsentScreen,{onAgree:()=>{setStep("demographics");scrollTop();}}),
      step==="demographics" && h(DemographicsScreen,{
        initialData: demographics,
        onContinue:(d)=>{setDemographics(d);setStep("instr");scrollTop();}}),
      step==="instr"   && h(InstrScreen,{
        onStart:()=>{setStep("partA");scrollTop();},
        onBack:()=>{setStep("demographics");scrollTop();}}),
      step==="partA" && curRubric && h('div',{style:slStyle},
        !isMobile && h(VignetteSidebar,{caseData:curCase}),
        isMobile && showVigModal && curCase && h(VignetteModal,{caseData:curCase, onClose:()=>setShowVigModal(false), onGoBack: (ci===0&&ri===0) ? ()=>{setShowVigModal(false);setStep('instr');scrollTop();} : null, lang, setLang}),
        h(PartAScreen,{key:"A-"+curRubric.id,caseData:curCase,rubric:curRubric,
          ci,ri,onNext:goPartB,onBack:goBack,
          draftAnswers:partADraft[curRubric.id]||(responses[curRubric.id]?{answers:responses[curRubric.id].partA||{},comments:responses[curRubric.id].comments||{}}:null)||{},
          onDraftChange:(data)=>setPartADraft(d=>({...d,[curRubric.id]:data}))})),
      step==="partB" && curRubric && h('div',{style:slStyle},
        !isMobile && h(VignetteSidebar,{caseData:curCase}),
        isMobile && showVigModal && curCase && h(VignetteModal,{caseData:curCase, onClose:()=>setShowVigModal(false), onGoBack: (ci===0&&ri===0) ? ()=>{setShowVigModal(false);setStep('instr');scrollTop();} : null, lang, setLang}),
        h(PartBScreen,{key:"B-"+curRubric.id,caseData:curCase,rubric:curRubric,
          ci,ri,isLast:doneR+1>=totalR,onSubmit:submitRubric,partAData,onBack:()=>{setStep("partA");scrollTop();},
          bDraft:partBDraft[curRubric.id]||(responses[curRubric.id]?{d1Order:responses[curRubric.id].d1Order,d2Order:responses[curRubric.id].d2Order,finalCmt:responses[curRubric.id].finalCmt||''}:null),
          onBDraftChange:(d1,d2,cmt)=>setPartBDraft(d=>({...d,[curRubric.id]:{d1Order:d1,d2Order:d2,finalCmt:cmt}}))})),
      step==="done" && h(DoneScreen,{responses,demographics,onBack:()=>{setStep("partB");scrollTop();}})
    )
  );
}

window.addEventListener('load', function() {
  try {
    var app = React.createElement(ErrorBoundary, null, React.createElement(App));
    ReactDOM.createRoot(document.getElementById('root')).render(app);
  } catch(e) {
    document.getElementById('root').innerHTML = '<div style="padding:20px;font-family:monospace;font-size:12px;color:#c00;background:#fff;border:2px solid #c00;margin:20px;border-radius:8px"><b>Mount Error</b><br>' + e.message + '</div>';
  }
});

3-1-6", "4-3-1-7", "4-3-1-8", "4-3-2-1", "4-3-2-2", "4-3-2-3", "4-3-2-4", "4-3-2-5", "4-3-2-6", "4-3-2-7"]}, {"id": "5-1", "items": ["5-1-1-1", "5-1-1-2", "5-1-1-3", "5-1-1-4", "5-1-1-5", "5-1-1-6", "5-1-1-7", "5-1-1-8", "5-1-2-1", "5-1-2-2", "5-1-2-3", "5-1-2-4", "5-1-2-5", "5-1-2-6", "5-1-2-7"]}, {"id": "5-2", "items": ["5-2-1-1", "5-2-1-2", "5-2-1-3", "5-2-1-4", "5-2-1-5", "5-2-1-6", "5-2-1-7", "5-2-1-8", "5-2-1-9", "5-2-2-1", "5-2-2-2", "5-2-2-3", "5-2-2-4", "5-2-2-5", "5-2-2-6", "5-2-2-7", "5-2-2-8"]}, {"id": "5-3", "items": ["5-3-1-1", "5-3-1-2", "5-3-1-3", "5-3-1-4", "5-3-2-1", "5-3-2-2", "5-3-2-3", "5-3-2-4"]}];
var SUPA_URL = 'https://qydinydhytepqptcvslb.supabase.co';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5ZGlueWRoeXRlcHFwdGN2c2xiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4Mjk0NTUsImV4cCI6MjA5MDQwNTQ1NX0.ZniqFMfctWHgbA4dJSlrvlFxWRcRfCrVuA9S3gjcA5o';
var __p=0,__f=0,__stopped=false;

function __log(type,msg){
  var tags={pass:'qa-tp',fail:'qa-tf',info:'qa-ti',warn:'qa-tw'};
  var labels={pass:'PASS',fail:'FAIL',info:'INFO',warn:'WARN'};
  var lb=document.getElementById('__qa-log');
  if(!lb)return;
  var d=document.createElement('div'); d.className='qa-li';
  d.innerHTML='<span class="qa-t '+tags[type]+'">'+labels[type]+'</span><span>'+msg+'</span>';
  lb.appendChild(d); lb.scrollTop=lb.scrollHeight;
  if(type==='pass'){__p++;document.getElementById('__qp').textContent=__p;}
  if(type==='fail'){__f++;document.getElementById('__qf').textContent=__f;}
}
function __st(s){var el=document.getElementById('__qa-status');if(el)el.textContent=s;}
function __prog(done,total,label){
  var pct=total>0?Math.round(done/total*100):0;
  var pf=document.getElementById('__qa-pf');if(pf)pf.style.width=pct+'%';
  var pl=document.getElementById('__qa-pl');if(pl)pl.textContent=label+' ('+done+'/'+total+')';
  var qr=document.getElementById('__qr');if(qr)qr.textContent=done+'/'+total;
}
function __wait(ms){return new Promise(function(r){setTimeout(r,ms);});}

// Direct DOM click - same window, no iframe restrictions
function __click(el){
  if(!el)return false;
  el.click();
  return true;
}

function __btns(){return Array.from(document.querySelectorAll('button'));}
function __find(text){return __btns().find(function(b){return b.textContent.indexOf(text)>=0&&!b.disabled;});}

function __waitFor(fn,ms,desc){
  return new Promise(function(resolve){
    var end=Date.now()+ms;
    var iv=setInterval(function(){
      if(__stopped){clearInterval(iv);resolve(false);return;}
      try{if(fn()){clearInterval(iv);resolve(true);return;}}catch(e){}
      if(Date.now()>end){
        clearInterval(iv);
        __log('fail','Timeout: '+desc);
        resolve(false);
      }
    },150);
  });
}

window.__qaStop=function(){
  __stopped=true;__st('Stopped');
  document.getElementById('__qa-run').disabled=false;
  document.getElementById('__qa-stop').disabled=true;
};

window.__qaRun=async function(){
  __p=0;__f=0;__stopped=false;
  document.getElementById('__qp').textContent='0';
  document.getElementById('__qf').textContent='0';
  document.getElementById('__qa-log').innerHTML='';
  document.getElementById('__qa-run').disabled=true;
  document.getElementById('__qa-stop').disabled=false;
  __st('Running...');

  try{
    // ── Need to reset to consent screen first ──────────────────────────
    // Access App state via React fiber
    __log('info','Resetting survey state...');
    
    // Clear localStorage and reload
    try{localStorage.removeItem('rubric_survey_session_v1');}catch(e){}
    
    // We need to reset React state - find the root and trigger re-render
    // Simplest: reload the page but keep the test panel
    // Actually we can manipulate the React state directly via fiber
    var root = document.getElementById('root');
    var fiberKey = Object.keys(root).find(function(k){return k.startsWith('__reactFiber')||k.startsWith('__reactInternalInstance');});
    
    if(!fiberKey){
      __log('warn','Cannot access React fiber - will use UI navigation only');
    }
    
    // Check current screen - look for consent checkbox or navigate there
    var atConsent = !!document.querySelector('input[type="checkbox"]');
    var atInstr = __find('Begin') || __find('시작');
    
    if(!atConsent && !atInstr){
      __log('info','Navigating to consent via page reload');
      // Store flag to continue test after reload - not possible to persist
      // Better: just start from wherever we are
    }
    
    // ── CONSENT (if present) ─────────────────────────────────────────
    if(document.querySelector('input[type="checkbox"]')){
      __log('info','-- Consent --');
      var cb=document.querySelector('input[type="checkbox"]');
      __click(cb); await __wait(300);
      var cont=__find('Continue');
      if(cont&&!cont.disabled){__log('pass','Consent: Continue enabled');__click(cont);}
      else{__log('fail','Consent: Continue not enabled');return;}
      await __wait(800);
    }

    // ── DEMOGRAPHICS (if present) ────────────────────────────────────
    var aboutHeading = (document.body.textContent.indexOf('About you')>=0 ||
                        document.body.textContent.indexOf('본인 소개')>=0);
    if(aboutHeading){
      __log('info','-- Demographics --');
      __log('pass','Demographics screen detected');

      // Inject demographics state via React fiber (avoids needing to click each radio)
      function __findDemoFiber(fiber){
        if(!fiber)return null;
        if(fiber.type&&fiber.type.name==='DemographicsScreen')return fiber;
        var r=__findDemoFiber(fiber.child);
        if(r)return r;
        return __findDemoFiber(fiber.sibling);
      }
      var rootEl=document.getElementById('root');
      var fk=Object.keys(rootEl).find(function(k){return k.startsWith('__reactFiber');});
      var injected=false;
      if(fk){
        var demoFiber=__findDemoFiber(rootEl[fk]);
        if(demoFiber){
          var st=demoFiber.memoizedState;
          if(st&&st.queue&&st.queue.dispatch){
            st.queue.dispatch({
              exp:'6-10', country_practice:'KR', country_training:'KR',
              setting:'ed', setting_other:'',
              specialty:'general', specialty_sub:'', specialty_other:'',
              ai_use:'sometimes'
            });
            injected=true;
            __log('pass','Demographics: state injected via fiber');
            await __wait(500);
          }
        }
      }
      if(!injected){
        __log('warn','Demographics: fiber injection failed, trying UI clicks');
        // Fallback: click first radio of each group
        var radios=Array.from(document.querySelectorAll('input[type="radio"]'));
        var seen={};
        radios.forEach(function(r){
          if(!seen[r.name]){seen[r.name]=true; __click(r);}
        });
        await __wait(500);
      }

      // Click Continue
      var contBtn=__find('Continue')||__find('계속');
      if(contBtn&&!contBtn.disabled){
        __click(contBtn);
        __log('pass','Demographics: Continue clicked');
        await __wait(800);
      } else {
        __log('fail','Demographics: Continue not enabled (state injection may have failed)');
        return;
      }
    }

    // ── INSTRUCTIONS (if present) ────────────────────────────────────
    var beginBtn=__find('Begin')||__find('시작');
    if(beginBtn){
      __log('info','-- Instructions --');
      __log('pass','Instructions screen found');
      __click(beginBtn);
      await __wait(1000);
    }

    // ── RUBRIC LOOP ──────────────────────────────────────────────────
    __log('info','Starting '+RUBRICS.length+' rubrics');

    for(var ri=0;ri<RUBRICS.length;ri++){
      if(__stopped)return;
      var rub=RUBRICS[ri];
      __prog(ri,RUBRICS.length,'Rubric '+rub.id);
      __log('info','Rubric '+rub.id+' ('+rub.items.length+' items)');

      // Close vignette modal
      await __wait(500);
      var gotIt=__find('Got it')||__find('확인');
      if(gotIt){__click(gotIt);__log('pass','Rubric '+rub.id+': closed vignette');await __wait(500);}

      // ── PART A ────────────────────────────────────────────────────
      var ok=await __waitFor(function(){
        return __btns().some(function(b){var t=b.textContent.trim();return t==='✓ Agree'||t==='✓ 동의';});
      },8000,'Part A rubric '+rub.id);
      if(!ok){__log('fail','Rubric '+rub.id+': Part A not found');continue;}
      __log('pass','Rubric '+rub.id+': Part A loaded');

      // Inject answers directly via React fiber (works on mobile - no scroll needed)
      var clicked=0;
      try {
        // Find PartAScreen fiber to access its setState
        var allEls=document.querySelectorAll('button');
        var injected=false;
        // Walk React fiber tree from root to find PartAScreen's setPartA
        function findFiberWithSetPartA(fiber){
          if(!fiber)return null;
          if(fiber.memoizedState){
            var s=fiber.memoizedState;
            while(s){
              // setPartA updates are functions - look for the one managing partA object
              if(s.queue&&s.queue.dispatch&&fiber.type&&
                 fiber.type.name==='PartAScreen'){
                return fiber;
              }
              s=s.next;
            }
          }
          var r=findFiberWithSetPartA(fiber.child);
          if(r)return r;
          return findFiberWithSetPartA(fiber.sibling);
        }
        var rootEl=document.getElementById('root');
        var fk=Object.keys(rootEl).find(function(k){return k.startsWith('__reactFiber');});
        if(fk){
          var fiber=findFiberWithSetPartA(rootEl[fk]);
          if(fiber){
            // Build answers object: {itemId: true, ...} for all items
            var answers={};
            rub.items.forEach(function(id){answers[id]=true;});
            // Find the setPartA dispatcher (first memoizedState queue)
            var st=fiber.memoizedState;
            if(st&&st.queue&&st.queue.dispatch){
              st.queue.dispatch(answers);
              clicked=rub.items.length;
              injected=true;
              await __wait(200);
            }
          }
        }
        if(!injected){
          // Fallback: find unanswered Agree buttons by walking UP to item container
          // Structure: item-div > agree-disagree-flex > AGREE BUTTON
          // item-div bg = white (unanswered), green (#F0FDF4), or red (#FEF2F2)
          for(var ii=0;ii<rub.items.length*3&&clicked<rub.items.length;ii++){
            if(__stopped)return;
            var foundBtn=null;
            var agreeBtns=Array.from(document.querySelectorAll('button')).filter(function(b){
              return b.textContent.trim()==='✓ Agree'||b.textContent.trim()==='✓ 동의';
            });
            for(var bi=0;bi<agreeBtns.length;bi++){
              var btn=agreeBtns[bi];
              // Walk up 2 levels: button -> flex-div -> item-container
              var itemDiv=btn.parentElement&&btn.parentElement.parentElement;
              if(!itemDiv)continue;
              var bg=itemDiv.style.background||itemDiv.style.backgroundColor||'';
              // White = unanswered. Skip green (#F0FDF4) and red (#FEF2F2)
              var isAnswered=bg.indexOf('F0FDF4')>=0||bg.indexOf('FEF2F2')>=0||
                             bg.indexOf('240, 253')>=0||bg.indexOf('254, 242')>=0;
              if(!isAnswered){foundBtn=btn; break;}
            }
            if(!foundBtn)break;
            try{foundBtn.scrollIntoView({block:'center',behavior:'instant'});}catch(e){}
            await __wait(60);
            __click(foundBtn);
            clicked++;
            await __wait(150);
          }
        }
      } catch(e) {
        __log('warn','Agree injection: '+e.message);
      }
      __log(clicked>=rub.items.length?'pass':'warn',
        'Rubric '+rub.id+': answered '+clicked+'/'+rub.items.length+' items');

      // Wait a moment for React to process all clicks
      await __wait(300);

      // Now click Continue (it navigates if all answered, or scrolls to first unanswered)
      var c2b=__find('Continue to Part B')||__find('파트 B');
      if(c2b){
        __log('pass','Rubric '+rub.id+': clicking Continue to Part B');
        __click(c2b);
      } else {
        __log('fail','Rubric '+rub.id+': Continue to Part B button not found');
        continue;
      }
      // Wait for Part A to disappear (confirms navigation happened)
      await __waitFor(function(){
        return !__btns().some(function(b){
          return b.textContent.indexOf('Continue to Part B')>=0||b.textContent.indexOf('파트 B')>=0;
        });
      },5000,'Part A to disappear');
      await __wait(500);

      // ── PART B ────────────────────────────────────────────────────
      ok=await __waitFor(function(){
        return __btns().some(function(b){
          var t=b.textContent;
          return t.indexOf('Next Rubric')>=0||t.indexOf('Next Case')>=0||
                 t.indexOf('Finish Survey')>=0||t.indexOf('다음 기준표')>=0||
                 t.indexOf('다음 사례')>=0||t.indexOf('설문 완료')>=0;
        });
      },10000,'Part B rubric '+rub.id);

      if(!ok){
        var btxt=__btns().slice(0,6).map(function(b){return '"'+b.textContent.trim().slice(0,20)+'"';}).join(', ');
        __log('fail','Rubric '+rub.id+': Part B not found. Buttons: '+btxt);
        continue;
      }
      __log('pass','Rubric '+rub.id+': Part B loaded');

    // ═══════════════════════════════════════════════════════════════════
    // EDGE CASE TESTS — run on rubric 1-1 before proceeding
    // ═══════════════════════════════════════════════════════════════════
    if(ri===0){
      __log('info','── Edge case tests (Rubric 1-1) ──');

      // ── EC1: LANGUAGE TOGGLE ────────────────────────────────────────
      __log('info','EC1: Language toggle');
      var koBtn=__find('한국어');
      if(koBtn){
        __click(koBtn); await __wait(400);
        // Check if a Korean button text appears
        var hasKorean=__btns().some(function(b){
          return b.textContent.indexOf('다음')>=0||b.textContent.indexOf('동의')>=0||
                 b.textContent.indexOf('비동의')>=0;
        });
        __log(hasKorean?'pass':'fail','EC1: Korean mode activated');
        // Switch back to English
        var enBtn=__find('EN');
        if(enBtn){__click(enBtn); await __wait(800);}
        // Check header still shows EN as active (Korean button now shows 한국어)
        var enActive=Array.from(document.querySelectorAll('button')).some(function(b){
          return b.textContent.trim()==='EN' && (b.style.background||b.style.backgroundColor||'').indexOf('255')>=0 ||
                 b.textContent.trim()==='EN' && b.style.borderColor&&b.style.borderColor.indexOf('255')>=0;
        });
        // Simpler: just check Agree buttons exist (EN mode)
        await __wait(400);
        // On Part B — check for English Part B elements (arrows or Next button)
        var backToEn=__btns().some(function(b){
          var t=b.textContent;
          return t.indexOf('Next Rubric')>=0||t.indexOf('Next Case')>=0||
                 t.indexOf('Finish Survey')>=0||t.indexOf('Back')>=0||
                 t==='▲'||t==='▼';
        });
        // Also verify Korean buttons are gone from content
        var noKorean=!__btns().some(function(b){
          return b.textContent.indexOf('다음 기준표')>=0||b.textContent.indexOf('비동의')>=0;
        });
        __log(backToEn&&noKorean?'pass':'fail','EC1: Switched back to English');
      } else {__log('fail','EC1: Korean toggle button not found');}

      // ── EC2: BACK NAVIGATION — answers persist ───────────────────────
      __log('info','EC2: Back navigation');
      // Currently on Part B of rubric 1-1. Click Back to go to Part A.
      var backBtn=__find('Back')||__find('이전');
      if(backBtn){
        __click(backBtn); await __wait(800);
        // Verify Part A is showing
        var onPartA=__btns().some(function(b){
          return b.textContent.indexOf('Continue to Part B')>=0||b.textContent.indexOf('파트 B')>=0;
        });
        __log(onPartA?'pass':'fail','EC2: Back navigated to Part A');
        if(onPartA){
          // Verify answers are still there (green Agree buttons)
          var greenBtns=__btns().filter(function(b){
            if(b.textContent.trim()!=='✓ Agree'&&b.textContent.trim()!=='✓ 동의')return false;
            var bg=b.style.background||b.style.backgroundColor||'';
            var border=b.style.borderColor||b.style.border||'';
            return bg.indexOf('F0FDF4')>=0||bg.indexOf('240, 253, 244')>=0||
                   border.indexOf('16A34A')>=0||border.indexOf('rgb(22, 163')>=0;
          });
          __log(greenBtns.length>0?'pass':'fail',
            'EC2: Answers persisted after Back ('+greenBtns.length+' green items)');

          // ── EC3: COMMENT ENTRY ─────────────────────────────────────
          __log('info','EC3: Comment entry');
          var textarea=document.querySelector('textarea');
          if(textarea){
            textarea.focus();
            // Simulate typing by setting value and dispatching input event
            var testComment='AutoTest comment '+Date.now();
            var nativeInputValueSetter=Object.getOwnPropertyDescriptor(
              window.HTMLTextAreaElement.prototype,'value').set;
            nativeInputValueSetter.call(textarea,testComment);
            textarea.dispatchEvent(new Event('input',{bubbles:true}));
            textarea.dispatchEvent(new Event('change',{bubbles:true}));
            textarea.dispatchEvent(new FocusEvent('blur',{bubbles:true}));
            textarea.dispatchEvent(new FocusEvent('focusout',{bubbles:true}));
            await __wait(600);
            __log('pass','EC3: Comment typed in textarea');
          } else {
            __log('warn','EC3: No textarea visible (need an answered item first)');
          }

          // ── EC4: CHANGE ONE ANSWER — others must persist ────────────
          __log('info','EC4: Change one answer — others persist');
          // Count currently green items before change
          var greenBefore=__btns().filter(function(b){
            if(b.textContent.trim()!=='✓ Agree'&&b.textContent.trim()!=='✓ 동의')return false;
            var bg=b.style.background||'';
            var border=b.style.borderColor||b.style.border||'';
            return bg.indexOf('F0FDF4')>=0||border.indexOf('16A34A')>=0||
                   border.indexOf('rgb(22, 163')>=0;
          }).length;

          // Click Disagree on first item to change its answer
          var disagreeBtn=__btns().find(function(b){
            return b.textContent.trim()==='✗ Disagree'||b.textContent.trim()==='✗ 비동의';
          });
          if(disagreeBtn){
            __click(disagreeBtn); await __wait(300);
            // Green count should still be greenBefore-1 (only one changed)
            var greenAfter=__btns().filter(function(b){
              if(b.textContent.trim()!=='✓ Agree'&&b.textContent.trim()!=='✓ 동의')return false;
              var bg=b.style.background||'';
              var border=b.style.borderColor||b.style.border||'';
              return bg.indexOf('F0FDF4')>=0||border.indexOf('16A34A')>=0||
                     border.indexOf('rgb(22, 163')>=0;
            }).length;
            __log(greenAfter===greenBefore-1?'pass':'fail',
              'EC4: Changed 1 answer, other '+greenAfter+' still green (expected '+(greenBefore-1)+')');
            // Fix it back to Agree
            var firstAgree=__btns().find(function(b){
              return b.textContent.trim()==='✓ Agree'||b.textContent.trim()==='✓ 동의';
            });
            if(firstAgree){__click(firstAgree); await __wait(200);}
          } else {
            __log('warn','EC4: No Disagree button visible');
          }

          // Go back to Part B (click Continue)
          var c2b=__find('Continue to Part B')||__find('파트 B');
          if(c2b){__click(c2b); await __wait(800);}

          // Wait for Part B to reload
          await __waitFor(function(){
            return __btns().some(function(b){
              var t=b.textContent;
              return t.indexOf('Next Rubric')>=0||t.indexOf('Next Case')>=0||
                     t.indexOf('Finish Survey')>=0||t.indexOf('다음')>=0;
            });
          },8000,'Part B reload after back nav');
        }
      } else {__log('warn','EC2: No Back button found on Part B');}

      // ── EC5: PART B ARROW BUTTONS ───────────────────────────────────
      __log('info','EC5: Part B arrow buttons');
      // Find arrow buttons
      var upBtns=__btns().filter(function(b){return b.textContent.trim()==='▲';});
      var downBtns=__btns().filter(function(b){return b.textContent.trim()==='▼';});
      __log(upBtns.length>0&&downBtns.length>0?'pass':'fail',
        'EC5: Arrow buttons present ('+upBtns.length+' up, '+downBtns.length+' down)');

      if(upBtns.length>1){
        // First item's ▲ should be disabled
        __log(upBtns[0].disabled?'pass':'fail','EC5: First item ▲ is disabled');
        // Last item's ▼ should be disabled
        __log(downBtns[downBtns.length-1].disabled?'pass':'fail','EC5: Last item ▼ is disabled');

        // Click ▲ on second item (index 1) — it should move up
        // Get order label before click
        // Track item TEXT content (not #position labels which always stay #1,#2,#3)
        function getItemOrder(){
          return Array.from(document.querySelectorAll('p')).filter(function(p){
            return p.style&&p.style.fontWeight==='700'&&p.textContent.indexOf('Item ')>=0;
          }).map(function(p){return p.textContent.trim().slice(0,20);});
        }
        var orderBefore=getItemOrder();

        __click(upBtns[1]); await __wait(400);

        var orderAfter=getItemOrder();
        var reordered=orderBefore.length>0&&orderAfter.length>0&&
                      orderBefore[0]!==orderAfter[0];
        __log(reordered?'pass':'fail',
          'EC5: ▲ click reordered items ('+orderBefore.slice(0,2).join('|')+' → '+orderAfter.slice(0,2).join('|')+')');
      }

      // ── EC6: VIEW CASE BUTTON (mobile only) ─────────────────────────
      __log('info','EC6: View Case button');
      var isMob=window.innerWidth<768;
      if(isMob){
        var vcBtn=Array.from(document.querySelectorAll('button,div')).find(function(el){
          return el.textContent.indexOf('View Case')>=0||el.textContent.indexOf('사례 보기')>=0;
        });
        __log(vcBtn?'pass':'fail','EC6: View Case button visible on mobile');
      } else {
        __log('pass','EC6: Desktop — View Case button not expected (sidebar shown instead)');
      }


      // ── EC7: COMMENT PERSISTS AFTER NEXT → BACK ───────────────────
      __log('info','EC7: Comment persists after Next→Back');
      // We need to be on Part B right now. Go back to Part A first.
      var backBtn2=__find('Back')||__find('이전');
      if(backBtn2){
        __click(backBtn2); await __wait(800);
        var onPartA2=__btns().some(function(b){
          return b.textContent.indexOf('Continue to Part B')>=0;
        });
        if(onPartA2){
          // Type a comment in the first visible textarea
          var ta=document.querySelector('textarea');
          if(ta){
            var testCmt='EC7-test-'+Date.now();
            var setter=Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype,'value').set;
            setter.call(ta,testCmt);
            ta.dispatchEvent(new Event('input',{bubbles:true}));
            ta.dispatchEvent(new Event('change',{bubbles:true}));
            ta.dispatchEvent(new FocusEvent('blur',{bubbles:true}));
            ta.dispatchEvent(new FocusEvent('focusout',{bubbles:true}));
            await __wait(700);
            __log('pass','EC7: Comment typed: '+testCmt.slice(0,20));

            // Click Continue to Part B
            var c2b2=__find('Continue to Part B')||__find('파트 B');
            if(c2b2){
              __click(c2b2);
              await __waitFor(function(){
                return __btns().some(function(b){
                  return b.textContent.indexOf('Next Rubric')>=0||b.textContent.indexOf('Next Case')>=0||
                         b.textContent.indexOf('Finish Survey')>=0;
                });
              },8000,'Part B after comment test');
              await __wait(300);

              // Go back to Part A again
              var backBtn3=__find('Back')||__find('이전');
              if(backBtn3){
                __click(backBtn3); await __wait(800);
                // Check if comment is still there
                var ta2=document.querySelector('textarea');
                var commentStillThere=ta2&&ta2.value.indexOf('EC7-test')>=0;
                __log(commentStillThere?'pass':'fail',
                  'EC7: Comment persisted after Next→Back (found: '+(ta2?ta2.value.slice(0,20):'no textarea')+')');
                // Go forward to Part B again to continue test
                var c2b3=__find('Continue to Part B')||__find('파트 B');
                if(c2b3){
                  __click(c2b3);
                  await __waitFor(function(){
                    return __btns().some(function(b){
                      return b.textContent.indexOf('Next Rubric')>=0||b.textContent.indexOf('Finish Survey')>=0;
                    });
                  },8000,'Part B restored');
                }
              }
            }
          } else {
            __log('warn','EC7: No textarea found (item may not be answered)');
            // Go back to Part B
            var c2b4=__find('Continue to Part B')||__find('파트 B');
            if(c2b4){__click(c2b4); await __wait(800);}
          }
        }
      } else {__log('warn','EC7: No Back button on Part B');}

      // ── EC8: VIGNETTE MODAL OPEN/CLOSE (mobile) ────────────────────
      __log('info','EC8: Vignette modal');
      var isMob2=window.innerWidth<768;
      if(isMob2){
        // The View Case button is fixed at bottom of screen
        // Search specifically for button containing the clipboard emoji
        var vcBtn2=null;
        var allEls2=Array.from(document.querySelectorAll('button'));
        for(var ei=0;ei<allEls2.length;ei++){
          var t2=allEls2[ei].textContent||'';
          if(t2.indexOf('View Case')>=0||t2.indexOf('사례 보기')>=0||t2.indexOf('\uD83D\uDCCB')>=0){
            vcBtn2=allEls2[ei]; break;
          }
        }
        // Also try the wrapper div
        if(!vcBtn2){
          var allDivs2=Array.from(document.querySelectorAll('div'));
          for(var di2=0;di2<allDivs2.length;di2++){
            var dt=allDivs2[di2].textContent||'';
            if((dt.indexOf('View Case')>=0||dt.indexOf('사례 보기')>=0)&&
               allDivs2[di2].children.length<=3){
              vcBtn2=allDivs2[di2]; break;
            }
          }
        }
        if(vcBtn2){
          try{vcBtn2.scrollIntoView({block:'center'});}catch(e){}
          await __wait(300);
          __click(vcBtn2); await __wait(800);
          // Check modal is open (Got it button visible)
          var gotItVisible=__find('Got it')||__find('확인');
          __log(gotItVisible?'pass':'fail','EC8: Vignette modal opened');
          if(gotItVisible){
            __click(gotItVisible); await __wait(500);
            // Check modal is closed (Got it gone, View Case back)
            var modalClosed=!(__find('Got it')||__find('확인'));
            __log(modalClosed?'pass':'fail','EC8: Vignette modal closed');
            var vcBack=Array.from(document.querySelectorAll('button,div')).find(function(el){
              return el.textContent.trim().indexOf('View Case')>=0||
                     el.textContent.trim().indexOf('사례 보기')>=0;
            });
            __log(vcBack?'pass':'fail','EC8: View Case button reappeared after close');
          }
        } else {__log('warn','EC8: View Case button not found on mobile');}
      } else {
        __log('pass','EC8: Desktop — vignette in sidebar, modal not applicable');
      }

      // ── EC9: PART B SPECIFIC POSITION AFTER ARROW ─────────────────
      __log('info','EC9: Arrow moves to exact position');
      // Get current item labels (#1, #2, #3...)
      function getItemOrder2(){
          return Array.from(document.querySelectorAll('p')).filter(function(p){
            return p.style&&p.style.fontWeight==='700'&&p.textContent.indexOf('Item ')>=0;
          }).map(function(p){return p.textContent.trim().slice(0,25);});
        }
        var order9Before=getItemOrder2();
        if(order9Before.length>=2){
          var downBtns2=__btns().filter(function(b){return b.textContent.trim()==='\u25bc';});
          if(downBtns2.length>0&&!downBtns2[0].disabled){
            __click(downBtns2[0]); await __wait(500);
            var order9After=getItemOrder2();
            var changed9=order9Before.length>0&&order9After.length>0&&
                         order9Before[0]!==order9After[0];
            __log(changed9?'pass':'fail',
              'EC9: \u25bc on first item changed order ('+order9Before[0].slice(0,15)+'\u2192'+order9After[0].slice(0,15)+')');
            var upBtns2=__btns().filter(function(b){return b.textContent.trim()==='\u25b2';});
            if(upBtns2.length>1){__click(upBtns2[1]); await __wait(300);}
          } else {__log('warn','EC9: First \u25bc is disabled');}
        } else {__log('warn','EC9: Not enough items visible');}
      __log('info','── Edge cases complete ──');
    }
    // ═══════════════════════════════════════════════════════════════════

      // Check drag handles
      var handles=Array.from(document.querySelectorAll('div')).filter(function(d){return d.textContent.trim()==='⠿';});
      if(handles.length>0)__log('pass','Rubric '+rub.id+': '+handles.length+' drag handles');
      else __log('warn','Rubric '+rub.id+': no drag handles');

      // Next/Finish
      var isLast=ri===RUBRICS.length-1;
      var nextBtn=__btns().find(function(b){
        var t=b.textContent;
        return t.indexOf('Next Rubric')>=0||t.indexOf('Next Case')>=0||
               t.indexOf('Finish Survey')>=0||t.indexOf('다음')>=0||t.indexOf('설문 완료')>=0;
      });
      if(nextBtn){
        if(isLast&&(nextBtn.textContent.indexOf('Finish')>=0||nextBtn.textContent.indexOf('완료')>=0))
          __log('pass','Last rubric: Finish Survey label correct');
        else if(isLast)
          __log('fail','Last rubric wrong label: '+nextBtn.textContent.trim());
        __click(nextBtn);
      } else {
        __log('fail','Rubric '+rub.id+': no Next button');
      }
      await __wait(300);
    }

    __prog(RUBRICS.length,RUBRICS.length,'All rubrics done');

    // ── DONE SCREEN ──────────────────────────────────────────────────
    __st('Done screen');
    ok=await __waitFor(function(){
      return __btns().some(function(b){return b.textContent.indexOf('Submit')>=0||b.textContent.indexOf('제출')>=0;});
    },10000,'Done screen');
    if(!ok){__log('fail','Done screen not found');__st('Failed');return;}
    __log('pass','Done screen loaded');

    var pid=null;
    var pm=(document.body.innerText||'').match(/P-[A-Z0-9]{6}/);
    if(pm){pid=pm[0];__log('pass','Participant ID: '+pid);}

    __log('info','Submitting...');
    var subBtn=__find('Submit')||__find('제출');
    __click(subBtn);

    ok=await __waitFor(function(){
      var t=(document.body.innerText||'').toLowerCase();
      return t.indexOf('recorded')>=0||t.indexOf('thank you')>=0||
             t.indexOf('감사합니다')>=0||t.indexOf('submitted')>=0||
             t.indexOf('완료')>=0||t.indexOf('complete')>=0||
             // Also check: submit button disappears (replaced by success state)
             !__btns().some(function(b){
               return b.textContent.indexOf('Submit Responses')>=0||
                      b.textContent.indexOf('응답 제출')>=0;
             });
    },25000,'submission success');
    if(ok)__log('pass','Submission succeeded — responses recorded!');
    else __log('fail','Submission timeout — check Supabase manually');

    // ── CHECK SUPABASE ────────────────────────────────────────────────
    if(pid){
      __log('info','Checking Supabase for: '+pid);
      await __wait(3000); // wait for DB rows to commit
      try{
        var r=await fetch(SUPA_URL+'/rest/v1/responses?participant_id=eq.'+pid+'&select=participant_id,rubric_id,item_id&limit=10',{
          headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
        });
        var rows=await r.json();
        var EXPECTED_ROWS=404; // 202 items × 2 (agreement + ranking rows each)
      if(rows&&rows.length>0){
        __log('pass','Supabase: '+rows.length+' rows found for '+pid);
        __log('pass','Sample: rubric='+rows[0].rubric_id+', item='+rows[0].item_id);
        // Fetch total count
        try{
          var countResp=await fetch(SUPA_URL+'/rest/v1/responses?participant_id=eq.'+pid+'&select=item_id',{
            headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Prefer':'count=exact'}
          });
          var countHdr=countResp.headers.get('content-range');
          if(countHdr){
            var total=parseInt(countHdr.split('/')[1]);
            __log(total===EXPECTED_ROWS?'pass':'fail',
              'Supabase row count: '+total+' (expected '+EXPECTED_ROWS+')');
          }
        }catch(e){__log('warn','Could not get exact count: '+e.message);}
      }
      else if(rows&&rows.length===0){__log('fail','Supabase: 0 rows — submission failed');}
      else{__log('fail','Supabase error: '+JSON.stringify(rows).slice(0,60));}
      }catch(e){__log('fail','Supabase: '+e.message);}
    }

    __st(__f===0?'All passed!':__f+' failures');
    __log('info','Done: '+__p+' passed, '+__f+' failed');

  }catch(e){
    __log('fail','Test error: '+e.message);
    __st('Error');
  }
  document.getElementById('__qa-run').disabled=false;
  document.getElementById('__qa-stop').disabled=true;
};
})();
</script>
</body></html>

    rubrics: [
      {
        id:"4-1", label_en:"Rubric 1", label_ko:"기준표 1", d1pts:40, d2pts:60,
        d1desc_en:"General Clinical History-Taking",
        d1desc_ko:"일반 임상 병력 청취",
        d2desc_en:"Case-Specific Diagnostic History — Simple Febrile Seizure",
        d2desc_ko:"사례 특이 진단적 병력 청취 — 단순 열성 경련",
        d1:[
          {id:"4-1-1-1",pts:10,en:"Item 1. History of Presenting Illness (structured): Systematically elicits onset, duration, progression, and character of the febrile illness and the seizure event, with temporal sequencing (fever first, then seizure) and aggravating/relieving factors.",ko:"항목 1. 현병력(구조화된 청취): 발열성 질환과 경련 사건의 발병, 지속 시간, 진행, 양상을 체계적으로 청취하며, 시간적 순서(발열 후 경련)와 악화/완화 요인을 포함한다.",xEn:"The backbone of any history and the highest-yield general element; a clear timeline (12 hours of fever and URI symptoms preceding a brief generalized event with full recovery) frames both the diagnosis and the simple-versus-complex determination.",xKo:"모든 병력 청취의 근간이자 가장 높은 정보 수율을 갖는 일반 항목이다. 명확한 경과(12시간의 발열과 상기도 감염 증상에 이어 짧은 전신 발작과 완전한 회복)는 진단과 단순-vs-복합 판단의 틀을 모두 형성한다."},
          {id:"4-1-1-2",pts:7,en:"Item 2. Targeted Review of Systems & Pertinent Negatives: Screens related systems (neuro, ENT, respiratory, GI, GU, skin) to surface positives and clinically meaningful negatives.",ko:"항목 2. 표적 계통 문진 및 관련 음성 소견: 관련 계통(신경, 이비인후, 호흡기, 소화기, 비뇨기, 피부)을 선별하여 양성 소견과 임상적으로 의미 있는 음성 소견을 드러낸다.",xEn:"The pertinent negatives here (no rash/petechiae, no focal weakness, no persistent vomiting, no dysuria) actively steer away from meningococcemia, intracranial pathology, and occult sources, so this ranks above the remaining general items.",xKo:"이 사례에서 관련 음성 소견(발진/점상출혈 없음, 국소 약화 없음, 지속성 구토 없음, 배뇨통 없음)은 수막구균혈증, 두개내 병리, 잠재 감염원으로부터 적극적으로 방향을 돌리므로, 나머지 일반 항목보다 높은 순위를 차지한다."},
          {id:"4-1-1-3",pts:4,en:"Item 3. Past Medical & Surgical History: Prior illnesses, hospitalizations, neonatal course, and any prior neurologic events.",ko:"항목 3. 과거 병력 및 수술력: 이전 질환, 입원력, 신생아 경과, 이전 신경학적 사건.",xEn:"Important context and a flag for prior CNS problems; the risk-defining details (prior afebrile seizures, neurodevelopmental abnormality) are scored in Domain 2 to avoid double-counting, so the general item stays modest.",xKo:"이전 중추신경계 문제에 대한 중요한 맥락 및 표시이지만, 위험을 결정하는 세부사항(이전 비발열성 경련, 신경발달 이상)은 중복 채점을 피하기 위해 영역 2에서 평가하므로, 일반 항목은 적당한 비중을 유지한다."},
          {id:"4-1-1-4",pts:4,en:"Item 4. Medications & Allergies: Current/recent medications — including antipyretics, any agents lowering the seizure threshold, and recent antibiotics — and documented drug allergies.",ko:"항목 4. 복용 약물 및 알레르기: 현재/최근 복용 약물 — 해열제, 경련 역치를 낮추는 약물, 최근 항생제 포함 — 및 기록된 약물 알레르기.",xEn:"Directly relevant because recent antibiotics can partially treat (and mask) meningitis and antipyretic dosing shapes counseling; a brief but bounded inquiry.",xKo:"최근 항생제는 수막염을 부분적으로 치료(그리고 차폐)할 수 있고 해열제 투여는 상담에 영향을 주므로 직접적으로 관련된다. 간단하지만 한정된 질문이다."},
          {id:"4-1-1-5",pts:3,en:"Item 5. Immunization Status: Confirms up-to-date vaccination for age.",ko:"항목 5. 예방접종 상태: 연령에 맞는 최신 예방접종 여부 확인.",xEn:"A core pediatric element with real weight here — full Hib and pneumococcal immunization is part of what makes routine LP unnecessary in a well-appearing child — but rarely decisive alone.",xKo:"여기서 실질적 중요성이 있는 핵심 소아 항목 — 완전한 Hib 및 폐렴구균 예방접종은 외관상 양호한 아동에서 정규 요추천자를 불필요하게 만드는 요소의 일부 — 이지만 단독으로 결정적인 경우는 드물다."},
          {id:"4-1-1-6",pts:3,en:"Item 6. Birth & Developmental History: Perinatal course, gestational age, and developmental trajectory.",ko:"항목 6. 출생력 및 발달력: 주산기 경과, 재태 연령, 발달 궤적.",xEn:"A standard component; weighted modestly as a general element, with the prognostically critical version (developmental delay as an epilepsy risk factor) rewarded in Domain 2.",xKo:"표준 구성 요소이며, 일반 항목으로서 적당히 가중치를 부여한다. 예후적으로 중요한 버전(뇌전증 위험 요인으로서의 발달 지연)은 영역 2에서 평가한다."},
          {id:"4-1-1-7",pts:3,en:"Item 7. Family History (general): Heritable conditions and relevant family medical background.",ko:"항목 7. 가족력(일반): 유전 가능한 질환 및 관련 가족 의학 배경.",xEn:"A baseline competency; the seizure-specific family history (febrile seizures, epilepsy) is scored in Domain 2 because it directly informs recurrence and epilepsy risk, so the general item stays low.",xKo:"기본 역량이며, 경련 특이 가족력(열성 경련, 뇌전증)은 재발과 뇌전증 위험을 직접적으로 알려주므로 영역 2에서 평가한다. 따라서 일반 항목은 낮게 유지된다."},
          {id:"4-1-1-8",pts:3,en:"Item 8. Social History & Caregiver Context: Home environment, caregivers, daycare attendance, and living situation.",ko:"항목 8. 사회력 및 보호자 환경: 가정 환경, 보호자, 어린이집 출석, 생활 상황.",xEn:"Provides context and informs the safety of discharge with caregiver observation; the case-relevant daycare exposure is credited in Domain 2, so the general item stays modest.",xKo:"맥락을 제공하고 보호자 관찰 하에 퇴원의 안전성을 알려준다. 사례 관련 어린이집 노출은 영역 2에서 평가하므로 일반 항목은 적당한 비중을 유지한다."},
          {id:"4-1-1-9",pts:3,en:"Item 9. Collateral History & Developmentally-Appropriate Communication: Obtains the entire history from the caregiver (and any other witness) with organized, empathetic questioning suited to a non-verbal toddler.",ko:"항목 9. 보호자 병력 청취 및 발달 수준에 맞는 의사소통: 비언어 유아에 적합한 체계적이고 공감적인 질문으로 보호자(및 기타 목격자)로부터 전체 병력을 청취한다.",xEn:"A distinctly pediatric skill — an 18-month-old cannot describe the event, so the witnessed account is the history — explicitly assessed but kept modest here because the high-stakes application (rigorous seizure-semiology elicitation) is rewarded heavily in Domain 2.",xKo:"소아과만의 고유한 기술 — 18개월 아동은 사건을 묘사할 수 없으므로 목격자 진술이 병력 전부를 차지한다 — 이므로 명시적으로 평가하되, 높은 비중의 적용(엄격한 경련 발현 청취)은 영역 2에서 크게 평가되므로 여기서는 적당한 비중을 유지한다."},
        ],
        d2:[
          {id:"4-1-2-1",pts:11,en:"Item 1. Simple-versus-Complex Classification Features: Specifically establishes the four discriminators — focal onset or focal features, duration (≥15 minutes), recurrence within 24 hours or within the same febrile illness, and completeness of neurologic recovery.",ko:"항목 1. 단순 vs 복합 분류 특징: 네 가지 구별 기준을 구체적으로 확립한다 — 국소 발병 또는 국소 특징, 지속 시간(≥15분), 24시간 이내 또는 동일 발열성 질환 내 재발, 신경학적 회복의 완전성.",xEn:"This classification is the pivotal reasoning task of the case and the single determinant of workup, admission, and neurology referral (a generalized, ~3-minute, single event with full recovery is simple), so it carries the highest weight in the rubric.",xKo:"이 분류는 본 사례의 핵심 추론 과제이며 검사, 입원, 신경과 의뢰의 단일 결정 요인이다(완전한 회복을 동반한 약 3분간의 전신성 단일 사건은 단순임). 따라서 평가 기준에서 가장 높은 가중치를 부여한다."},
          {id:"4-1-2-2",pts:9,en:"Item 2. Detailed Seizure Semiology & Postictal Course (witnessed account): Elicits pre-event behavior, motor manifestations, eye/head deviation, colour change or cyanosis, responsiveness during the event, tongue-biting or incontinence, an explicit duration estimate (noting that caregivers tend to overestimate), and the length and character of the postictal state.",ko:"항목 2. 상세한 경련 발현 양상 및 발작 후 경과(목격자 진술): 사건 전 행동, 운동 발현, 눈/머리 편위, 색 변화 또는 청색증, 사건 중 반응성, 혀 깨물기 또는 실금, 명시적 지속 시간 추정(보호자는 과대평가하는 경향이 있음을 주의), 발작 후 상태의 길이와 양상을 청취한다.",xEn:"This granular eyewitness account is the raw data feeding the classification above and helps distinguish a true seizure from a mimic; rigorous elicitation of an unwitnessed event is the mark of safe practice, warranting the second-highest weight.",xKo:"이 세밀한 목격자 진술은 위 분류에 필요한 원천 자료이며 진성 경련과 모방을 구별하는 데 도움이 된다. 목격되지 않은 사건에 대한 엄격한 청취는 안전한 진료의 표시이며 두 번째로 높은 가중치를 부여한다."},
          {id:"4-1-2-3",pts:9,en:"Item 3. CNS Infection Screen (meningitis/encephalitis): Asks about pre-seizure lethargy or excessive irritability/inconsolability, poor feeding, neck stiffness or photophobia, a bulging fontanelle, persistent altered behaviour, and — critically — whether mental status truly returned to baseline.",ko:"항목 3. 중추신경계 감염 선별(수막염/뇌염): 경련 전 무기력 또는 과도한 짜증/달랠 수 없음, 부진한 수유, 경부 강직 또는 광선공포, 팽창된 천문, 지속적 행동 변화, 그리고 — 결정적으로 — 의식 상태가 진정으로 기저로 돌아왔는지에 대해 질문한다.",xEn:"Excluding CNS infection is the central do-not-miss task, and because meningeal signs are unreliable in toddlers, it is precisely this history (alongside a reassuring exam) that justifies forgoing an LP; equally high value.",xKo:"중추신경계 감염 배제는 절대 놓치면 안 되는 중심 과제이며, 유아에서 수막 자극 징후는 신뢰할 수 없으므로 정확히 이 병력이(안심되는 진찰과 함께) 요추천자를 생략하는 것을 정당화한다. 동등하게 높은 가치를 부여한다."},
          {id:"4-1-2-4",pts:7,en:"Item 4. Fever Source Identification: Localizes the infection through URI symptoms, ear pain, sore throat, cough, urinary symptoms, rash, and exposure to specific illnesses.",ko:"항목 4. 발열 원인 식별: 상기도 감염 증상, 귀 통증, 인후통, 기침, 비뇨기 증상, 발진, 특정 질환 노출을 통해 감염을 국소화한다.",xEn:"Confirming a benign viral source (here, coryza and pharyngitis) supports the simple-febrile-seizure diagnosis and rules out a more dangerous focus, making it a high-relevance line of questioning.",xKo:"양성 바이러스 원인(여기서는 콧물과 인두염)을 확인하는 것은 단순 열성 경련 진단을 뒷받침하고 더 위험한 원인을 배제하므로, 높은 관련성의 질문 라인이다."},
          {id:"4-1-2-5",pts:7,en:"Item 5. Seizure-Mimic & Secondary-Cause Differential: Screens for rigors/shivering mistaken for convulsion, breath-holding spell, syncope or behavioural arrest, and for secondary causes — prior afebrile seizures (epilepsy), symptoms of hypoglycaemia or electrolyte disturbance, and possible toxic ingestion.",ko:"항목 5. 경련 모방 및 이차 원인 감별: 경련으로 오인된 떨림/오한, 분노 발작, 실신 또는 행동 정지, 그리고 이차 원인 — 이전 비발열성 경련(뇌전증), 저혈당이나 전해질 장애의 증상, 가능한 독성 섭취 — 을 선별한다.",xEn:"Not every convulsive episode with fever is a febrile seizure; deliberately screening for mimics and provoked/secondary causes is core diagnostic reasoning (the vignette's \"no prior seizures\" and \"no known ingestions\" reflect exactly these questions) and is weighted accordingly.",xKo:"발열을 동반한 모든 경련 에피소드가 열성 경련은 아니다. 모방과 유발/이차 원인을 의도적으로 선별하는 것은 핵심 진단적 추론이며(본 사례의 \"이전 경련 없음\"과 \"알려진 섭취 없음\"은 정확히 이러한 질문을 반영함), 그에 따라 가중치를 부여한다."},
          {id:"4-1-2-6",pts:7,en:"Item 6. Recurrence & Epilepsy Risk Factors + Neurodevelopmental Baseline: Family history of febrile seizures or epilepsy, age at this first event, peak temperature and how briefly fever preceded the seizure, and the child's prior developmental and neurologic baseline.",ko:"항목 6. 재발 및 뇌전증 위험 인자 + 신경발달적 기저: 열성 경련 또는 뇌전증의 가족력, 이 첫 사건의 연령, 최고 체온과 발열이 경련에 얼마나 짧게 선행했는지, 아동의 이전 발달 및 신경학적 기저.",xEn:"These factors drive prognosis and the caregiver counseling that defines good febrile-seizure care (recurrence and the small epilepsy risk hinge on them), so they merit substantial weight even when reassuringly normal.",xKo:"이러한 요인들은 예후와 좋은 열성 경련 진료를 정의하는 보호자 상담을 좌우한다(재발과 작은 뇌전증 위험이 이들에 달려 있음). 따라서 안심되게 정상인 경우에도 상당한 가중치를 받을 만하다."},
          {id:"4-1-2-7",pts:5,en:"Item 7. Red Flags for Serious Neurologic Illness & Deterioration: Prolonged or incomplete recovery, any new focal deficit, recurrent seizures, persistent altered consciousness, signs of raised intracranial pressure, and parental sense of \"not themselves.\"",ko:"항목 7. 중증 신경학적 질환 및 악화의 적신호: 지연되거나 불완전한 회복, 새로운 국소 결손, 반복 경련, 지속적 의식 변화, 두개내압 상승 징후, 보호자가 인지하는 \"평소와 다름\".",xEn:"Identifying the child who is not behaving like a simple febrile seizure is critical for safe triage; weighted as a focused safety net given the currently alert, fully-recovered presentation.",xKo:"단순 열성 경련처럼 행동하지 않는 아동을 식별하는 것은 안전한 진료 분류에 중요하다. 현재 각성하고 완전히 회복된 발현을 고려하여 집중된 안전망으로서의 가중치를 부여한다."},
          {id:"4-1-2-8",pts:5,en:"Item 8. Antipyretic Use, Ingestion & Trauma Screen: Type/timing/dose of antipyretics given, access to medications or toxins in the home, and any history of head trauma or a fall.",ko:"항목 8. 해열제 사용, 섭취 및 외상 선별: 투여된 해열제의 종류/시점/용량, 가정 내 약물 또는 독성물질 접근 가능성, 두부 외상 또는 낙상 병력.",xEn:"This clarifies the fever course and counseling and, importantly, excludes ingestion and trauma as alternative or contributory causes of the event (including a brief safeguarding consideration handled sensitively); solid, targeted value.",xKo:"이는 발열 경과와 상담을 명확히 하고, 중요하게는 사건의 대안적 또는 기여 원인으로서 섭취와 외상을 배제한다(민감하게 다루어지는 간단한 아동 보호 고려사항 포함). 확실하고 표적화된 가치가 있다."},
        ],
      },
      {
        id:"4-2", label_en:"Rubric 2", label_ko:"기준표 2", d1pts:40, d2pts:60,
        d1desc_en:"General Clinical History-Taking",
        d1desc_ko:"일반 임상 병력 청취",
        d2desc_en:"Case-Specific Diagnostic History",
        d2desc_ko:"사례 특이 진단적 병력 청취",
        d1:[
          {id:"4-2-1-1",pts:10,en:"Item 1. History of Present Illness (HPI) Chronology & Context: Elicits the exact timeline of the fever onset relative to the seizure, and establishes the child's clinical state immediately prior to the event.",ko:"항목 1. 현병력의 시간적 경과 및 맥락: 경련에 대한 발열 발병의 정확한 시간 경과를 청취하고, 사건 직전 아동의 임상 상태를 확립한다.",xEn:"Febrile seizures classically occur early in the course of a febrile illness, often as the temperature rapidly rises. Establishing this chronological relationship is necessary to ensure the fever precipitated the seizure, rather than the fever being a secondary result of prolonged status epilepticus.",xKo:"열성 경련은 전형적으로 발열성 질환 경과 초기에, 종종 체온이 급속히 상승할 때 발생한다. 이 시간적 관계를 확립하는 것은 발열이 경련을 유발한 것이지, 발열이 지속성 뇌전증 중첩 상태의 이차적 결과가 아님을 보장하는 데 필요하다."},
          {id:"4-2-1-2",pts:10,en:"Item 2. Past Medical, Developmental, & Family History: Systematically inquires about prior neurological conditions, achievement of appropriate developmental milestones, and specifically screens for a family history of both febrile seizures and epilepsy.",ko:"항목 2. 과거 병력, 발달력 및 가족력: 이전 신경학적 상태, 적절한 발달 이정표의 달성에 대해 체계적으로 문진하고, 특히 열성 경련과 뇌전증의 가족력을 선별한다.",xEn:"A neurotypical toddler with a family history of febrile seizures provides strong diagnostic reassurance. Conversely, a child with baseline developmental delays or a strong family history of early-onset epilepsy shifts the risk profile and may necessitate a more extensive neurological workup and altered anticipatory guidance.",xKo:"열성 경련의 가족력이 있는 신경전형 유아는 강력한 진단적 안심을 제공한다. 반대로, 기저 발달 지연이나 조기 발생 뇌전증의 강력한 가족력이 있는 아동은 위험 프로필을 변경하며 더 광범위한 신경학적 검사와 변경된 예측 지침을 필요로 할 수 있다."},
          {id:"4-2-1-3",pts:10,en:"Item 3. Medications, Allergies, & Immunization Status: Verifies recent administration of home antipyretics or cold medications, checks drug allergies, and strictly confirms immunization status (specifically against Haemophilus influenzae type b and Streptococcus pneumoniae).",ko:"항목 3. 복용 약물, 알레르기 및 예방접종 상태: 가정 해열제 또는 감기약의 최근 투여를 확인하고, 약물 알레르기를 점검하며, 예방접종 상태(특히 Haemophilus influenzae type b 및 Streptococcus pneumoniae에 대한)를 엄격히 확인한다.",xEn:"Up-to-date immunization status drastically reduces the pre-test probability of bacterial meningitis. In a child presenting with a first-time febrile seizure, a fully immunized status is a key evidence-based criterion that negates the routine need for a lumbar puncture.",xKo:"최신 예방접종 상태는 세균성 수막염의 사전 검사 확률을 크게 감소시킨다. 첫 열성 경련으로 발현된 아동에서 완전히 예방접종된 상태는 정규 요추천자의 필요성을 부정하는 핵심적 증거 기반 기준이다."},
          {id:"4-2-1-4",pts:10,en:"Item 4. Review of Systems & Baseline Behavioral Status: Evaluates the child's general behavior in the days leading up to the event, focusing on irritability, consolability, feeding patterns, and baseline interaction.",ko:"항목 4. 계통 문진 및 기저 행동 상태: 사건에 이르는 며칠간 아동의 전반적 행동을 평가하며, 짜증, 달래기 가능성, 수유 양상, 기저 상호작용에 집중한다.",xEn:"Caregiver assessment of the child's systemic toxicity prior to the seizure provides insight into the severity of the underlying illness. Profound lethargy or extreme irritability preceding the event raises the suspicion for a more serious central nervous system infection rather than a benign viral illness.",xKo:"경련 이전 아동의 전신적 독성에 대한 보호자 평가는 기저 질환의 중증도에 대한 통찰을 제공한다. 사건에 선행하는 심각한 무기력이나 극심한 짜증은 양성 바이러스 질환이 아닌 더 심각한 중추신경계 감염에 대한 의심을 높인다."},
        ],
        d2:[
          {id:"4-2-2-1",pts:20,en:"Item 1. Characterization of the Seizure Event (Simple vs. Complex): Directly explores the semiology of the seizure (generalized vs. focal/unilateral motor activity), the exact duration (less than or greater than 15 minutes), and the frequency (single vs. multiple episodes within a 24-hour period).",ko:"항목 1. 경련 사건의 특성화(단순 vs 복합): 경련의 발현 양상(전신성 vs 국소/일측성 운동 활동), 정확한 지속 시간(15분 미만 또는 초과), 빈도(24시간 이내 단일 vs 다회 에피소드)를 직접 탐색한다.",xEn:"This is the most critical diagnostic branch point in the case. A \"simple\" febrile seizure (generalized, <15 minutes, once in 24 hours) dictates safe discharge with supportive care. Eliciting any feature of a \"complex\" febrile seizure entirely alters the management pathway, requiring neuroimaging, potential EEG, and hospital admission.",xKo:"이것은 본 사례에서 가장 중요한 진단적 분기점이다. \"단순\" 열성 경련(전신성, <15분, 24시간 내 1회)은 지지 치료와 함께 안전한 퇴원을 결정한다. \"복합\" 열성 경련의 특징을 청취하면 신경영상검사, 잠재적 뇌파검사, 입원이 필요한 완전히 다른 치료 경로로 변경된다."},
          {id:"4-2-2-2",pts:15,en:"Item 2. Assessment of the Postictal State & Neurological Baseline: Determines the duration of altered mental status following the seizure and confirms a complete return to the child's normal neurological baseline and gait prior to or upon ED arrival.",ko:"항목 2. 발작 후 상태 및 신경학적 기저 평가: 경련 이후 의식 변화의 지속 시간을 판단하고 응급실 도착 전 또는 도착 시점에 아동의 정상 신경학적 기저와 보행으로의 완전한 복귀를 확인한다.",xEn:"Brief postictal sleepiness (e.g., 15 minutes) is an expected physiological response. However, prolonged altered mental status, persistent focal weakness (Todd's paralysis), or failure to awaken fully strongly suggests an alternative and dangerous pathology, such as meningitis, encephalitis, or ongoing non-convulsive status epilepticus.",xKo:"짧은 발작 후 졸음(예: 15분)은 예상되는 생리적 반응이다. 그러나 지연된 의식 변화, 지속적 국소 약화(토드 마비) 또는 완전히 깨어나지 못함은 수막염, 뇌염, 또는 진행 중인 비경련성 뇌전증 중첩 상태와 같은 대안적이고 위험한 병리를 강력히 시사한다."},
          {id:"4-2-2-3",pts:15,en:"Item 3. Identification of Fever Source & Meningitis Screening: Actively screens for localized symptoms to find the source of the fever (e.g., rhinorrhea, sore throat, cough, vomiting, diarrhea) and specifically queries for meningeal signs (e.g., neck stiffness, photophobia, non-blanching petechial rash).",ko:"항목 3. 발열 원인 식별 및 수막염 선별: 발열의 원인을 찾기 위해 국소 증상(예: 콧물, 인후통, 기침, 구토, 설사)을 적극적으로 선별하고, 특히 수막 자극 징후(예: 경부 강직, 광선공포, 압박 시 사라지지 않는 점상 발진)에 대해 문진한다.",xEn:"The seizure is a symptom; the clinician must diagnose the underlying febrile illness. Identifying a clear viral source (like a URI or pharyngitis) is reassuring. Explicitly screening out signs of meningitis is a non-negotiable safety requirement to prevent missing a catastrophic bacterial infection.",xKo:"경련은 증상이며, 임상의는 기저 발열성 질환을 진단해야 한다. 명확한 바이러스 원인(상기도 감염이나 인두염과 같은)을 식별하는 것은 안심을 준다. 수막염 징후를 명시적으로 선별하는 것은 재앙적 세균감염을 놓치는 것을 예방하기 위한 협상 불가능한 안전 요구사항이다."},
          {id:"4-2-2-4",pts:10,en:"Item 4. Exclusion of Trauma & Toxicological Mimics: Inquires about recent unprotected falls, accidental head trauma, and the child's potential access to household toxins, medications, or illicit substances.",ko:"항목 4. 외상 및 독성학적 모방 배제: 최근 보호받지 않은 낙상, 우발적 두부 외상, 아동이 가정 내 독성물질, 약물 또는 불법 물질에 접근할 가능성에 대해 문진한다.",xEn:"Toddlers are highly mobile and prone to ingestions and accidents. Accidental ingestions (e.g., diphenhydramine, tricyclic antidepressants) or occult head trauma (both accidental and abusive) can present with seizures. Failing to explore these possibilities risks returning a vulnerable child to a hazardous environment or missing an occult injury.",xKo:"유아는 활동성이 높고 섭취와 사고에 취약하다. 우발적 섭취(예: 디펜히드라민, 삼환계 항우울제) 또는 잠재성 두부 외상(우발적 및 학대 모두)은 경련으로 발현될 수 있다. 이러한 가능성을 탐색하지 못하면 취약한 아동을 위험한 환경으로 돌려보내거나 잠재성 손상을 놓칠 위험이 있다."},

      {
        id:"4-3", label_en:"Rubric 3", label_ko:"기준표 3", d1pts:40, d2pts:60,
        d1desc_en:"General Clinical History-Taking",
        d1desc_ko:"일반 임상 병력 청취",
        d2desc_en:"Case-Specific Diagnostic History — Simple Febrile Seizure",
        d2desc_ko:"사례 특이 진단적 병력 청취 — 단순 열성 경련",
        d1:[
          {id:"4-3-1-1",pts:4,en:"Item 1. Chief Complaint and Event Clarification: Establishes that the primary concern is a seizure associated with fever and clarifies the caregiver's description of the event and recovery.",ko:"항목 1. 주 호소 및 사건 명확화: 주된 우려가 발열과 관련된 경련임을 확립하고 사건과 회복에 대한 보호자의 묘사를 명확히 한다.",xEn:"Accurate understanding of the presenting event is essential before proceeding to diagnostic questioning.",xKo:"발현 사건에 대한 정확한 이해는 진단 질문으로 진행하기 전에 필수적이다."},
          {id:"4-3-1-2",pts:10,en:"Item 2. History of Presenting Illness (Chronology and Symptom Evolution): Obtains a structured timeline of fever onset, seizure occurrence, preceding symptoms, post-event course, and current clinical status.",ko:"항목 2. 현병력(시간 경과 및 증상 진행): 발열 발병, 경련 발생, 선행 증상, 사건 후 경과, 현재 임상 상태의 구조화된 시간 경과를 청취한다.",xEn:"Chronology is critical in determining whether the seizure is temporally associated with a febrile illness and in assessing for alternative diagnoses.",xKo:"시간 경과는 경련이 발열성 질환과 시간적으로 관련되어 있는지 판단하고 대안 진단을 평가하는 데 중요하다."},
          {id:"4-3-1-3",pts:5,en:"Item 3. Associated Symptoms and Review of Systems: Screens for respiratory, gastrointestinal, urinary, dermatologic, neurologic, and constitutional symptoms, including both positive and negative findings.",ko:"항목 3. 동반 증상 및 계통 문진: 호흡기, 위장관, 비뇨기, 피부, 신경, 전신 증상을 선별하며 양성 및 음성 소견을 모두 포함한다.",xEn:"Identifies the likely source of fever and helps detect signs of serious infection or other etiologies.",xKo:"발열의 가능한 원인을 식별하고 중증 감염이나 기타 원인의 징후를 발견하는 데 도움이 된다."},
          {id:"4-3-1-4",pts:5,en:"Item 4. Past Medical, Birth, and Developmental History: Assesses previous medical conditions, developmental milestones, prior neurologic concerns, birth history, and previous hospitalizations.",ko:"항목 4. 과거 병력, 출생력 및 발달력: 이전 의학적 상태, 발달 이정표, 이전 신경학적 우려, 출생력, 이전 입원을 평가한다.",xEn:"Underlying neurologic abnormalities increase the likelihood of non-febrile seizure disorders and influence risk stratification.",xKo:"기저 신경학적 이상은 비발열성 경련 장애의 가능성을 증가시키고 위험 계층화에 영향을 미친다."},
          {id:"4-3-1-5",pts:4,en:"Item 5. Medication, Allergy, and Toxic Exposure History: Reviews medications, recent antipyretic use, allergies, possible accidental ingestions, and toxin exposures.",ko:"항목 5. 약물, 알레르기 및 독성 노출력: 약물, 최근 해열제 사용, 알레르기, 가능한 우발적 섭취, 독성 노출을 검토한다.",xEn:"Metabolic disturbances, medication exposures, and toxins may mimic febrile seizures and must be considered.",xKo:"대사 장애, 약물 노출, 독성물질은 열성 경련을 모방할 수 있으며 고려되어야 한다."},
          {id:"4-3-1-6",pts:3,en:"Item 6. Immunization History: Confirms vaccination status, particularly vaccines relevant to invasive bacterial infections.",ko:"항목 6. 예방접종력: 특히 침습성 세균감염과 관련된 백신을 포함한 예방접종 상태를 확인한다.",xEn:"Immunization status influences the likelihood of serious bacterial infections such as meningitis.",xKo:"예방접종 상태는 수막염과 같은 중증 세균감염의 가능성에 영향을 미친다."},
          {id:"4-3-1-7",pts:4,en:"Item 7. Family and Social History: Assesses family history of epilepsy, febrile seizures, neurologic disorders, daycare attendance, and infectious exposures.",ko:"항목 7. 가족력 및 사회력: 뇌전증, 열성 경련, 신경학적 장애의 가족력, 어린이집 출석, 감염 노출을 평가한다.",xEn:"Family history is relevant to recurrence risk and susceptibility to seizure disorders.",xKo:"가족력은 재발 위험 및 경련 장애에 대한 감수성과 관련이 있다."},
          {id:"4-3-1-8",pts:5,en:"Item 8. Assessment of Severity and Emergency Red Flags: Screens for persistent altered mental status, ongoing seizure activity, respiratory compromise, signs of shock, or evidence of severe systemic illness.",ko:"항목 8. 중증도 및 응급 적신호 평가: 지속적 의식 변화, 진행 중인 경련 활동, 호흡 손상, 쇼크 징후, 중증 전신 질환의 증거를 선별한다.",xEn:"Rapid identification of unstable patients is a fundamental emergency medicine priority.",xKo:"불안정한 환자의 신속한 식별은 응급의학의 근본적 우선순위다."},
        ],
        d2:[
          {id:"4-3-2-1",pts:15,en:"Item 1. Detailed Seizure Characterization: Obtains a precise description of the seizure, including onset, duration, motor activity, loss of consciousness, eye deviation, symmetry of movements, incontinence, and seizure termination.",ko:"항목 1. 상세한 경련 특성화: 발병, 지속 시간, 운동 활동, 의식 소실, 눈 편위, 움직임의 대칭성, 실금, 경련 종료를 포함한 경련의 정확한 묘사를 청취한다.",xEn:"The most important diagnostic task is determining whether the event was truly a seizure and whether it meets criteria for a simple versus complex febrile seizure.",xKo:"가장 중요한 진단 과제는 사건이 진정 경련이었는지, 그리고 단순 vs 복합 열성 경련 기준을 충족하는지 판단하는 것이다."},
          {id:"4-3-2-2",pts:12,en:"Item 2. Assessment for Complex Febrile Seizure Features: Specifically asks whether the seizure lasted >15 minutes, had focal features, recurred within 24 hours, or failed to return to baseline afterward.",ko:"항목 2. 복합 열성 경련 특징 평가: 경련이 15분 이상 지속되었는지, 국소 특징이 있었는지, 24시간 이내 재발했는지, 이후 기저로 돌아오지 못했는지를 구체적으로 질문한다.",xEn:"Differentiating simple from complex febrile seizures directly influences evaluation, disposition, and need for further investigation.",xKo:"단순 열성 경련과 복합 열성 경련을 구별하는 것은 평가, 처치, 추가 검사의 필요성에 직접적인 영향을 미친다."},
          {id:"4-3-2-3",pts:8,en:"Item 3. Postictal Course and Neurologic Recovery: Assesses duration of postictal symptoms, return to baseline behavior, residual weakness, confusion, gait abnormalities, or persistent neurologic deficits.",ko:"항목 3. 발작 후 경과 및 신경학적 회복: 발작 후 증상의 지속 시간, 기저 행동으로의 복귀, 잔여 약화, 혼란, 보행 이상, 지속적 신경학적 결손을 평가한다.",xEn:"Complete neurologic recovery strongly supports a simple febrile seizure and helps exclude serious intracranial pathology.",xKo:"완전한 신경학적 회복은 단순 열성 경련을 강력히 뒷받침하고 중증 두개내 병리를 배제하는 데 도움이 된다."},
          {id:"4-3-2-4",pts:8,en:"Item 4. Fever Assessment and Source Identification: Explores fever onset, maximum temperature, antipyretic use, associated infectious symptoms, and likely source of infection.",ko:"항목 4. 발열 평가 및 원인 식별: 발열 발병, 최고 체온, 해열제 사용, 동반 감염 증상, 감염의 가능한 원인을 탐색한다.",xEn:"Febrile seizures occur in the context of acute febrile illness; identifying the underlying source remains an important diagnostic objective.",xKo:"열성 경련은 급성 발열성 질환의 맥락에서 발생한다. 기저 원인을 식별하는 것은 중요한 진단 목표로 남아 있다."},
          {id:"4-3-2-5",pts:8,en:"Item 5. Screening for Central Nervous System Infection: Evaluates for neck stiffness, photophobia, persistent lethargy, irritability, bulging fontanelle (if age-appropriate), severe headache, petechiae, or other meningitis/encephalitis symptoms.",ko:"항목 5. 중추신경계 감염 선별: 경부 강직, 광선공포, 지속적 무기력, 짜증, 팽창된 천문(연령에 적절한 경우), 심한 두통, 점상출혈 또는 기타 수막염/뇌염 증상을 평가한다.",xEn:"Excluding CNS infection is a critical and potentially life-saving component of febrile seizure assessment.",xKo:"중추신경계 감염을 배제하는 것은 열성 경련 평가의 중요하고 잠재적으로 생명을 구하는 구성 요소다."},
          {id:"4-3-2-6",pts:5,en:"Item 6. Previous Seizure and Neurologic History: Investigates prior febrile seizures, afebrile seizures, developmental delay, known neurologic disorders, or previous neurologic evaluations.",ko:"항목 6. 이전 경련 및 신경학적 병력: 이전 열성 경련, 비발열성 경련, 발달 지연, 알려진 신경학적 장애, 이전 신경학적 평가를 조사한다.",xEn:"Previous seizure history significantly alters diagnostic considerations and recurrence risk.",xKo:"이전 경련 병력은 진단 고려사항과 재발 위험을 상당히 변경한다."},
          {id:"4-3-2-7",pts:4,en:"Item 7. Trauma, Ingestion, and Alternative Etiology Screening: Screens for recent head injury, toxic ingestion, metabolic triggers, choking episodes, or other events that could explain the seizure independently of fever.",ko:"항목 7. 외상, 섭취 및 대안 원인 선별: 최근 두부 손상, 독성 섭취, 대사 유발 요인, 질식 에피소드 또는 발열과 독립적으로 경련을 설명할 수 있는 기타 사건을 선별한다.",xEn:"Although less likely in a classic presentation, alternative causes must be actively excluded.",xKo:"전형적 발현에서는 가능성이 낮지만, 대안적 원인은 적극적으로 배제되어야 한다."},

    rubrics: [
      {
        id:"5-1", label_en:"Rubric 1", label_ko:"기준표 1", d1pts:40, d2pts:60,
        d1desc_en:"General Clinical History-Taking",
        d1desc_ko:"일반 임상 병력 청취",
        d2desc_en:"Case-Specific Diagnostic History — Acute Appendicitis",
        d2desc_ko:"사례 특이 진단적 병력 청취 — 급성 충수염",
        d1:[
          {id:"5-1-1-1",pts:4,en:"Item 1. Chief Complaint and Symptom Clarification: Elicits the primary concerns (abdominal pain, fever, nausea/vomiting) and clarifies the patient's and caregiver's understanding of the illness.",ko:"항목 1. 주 호소 및 증상 명확화: 주된 우려사항(복통, 발열, 오심/구토)을 청취하고 환자 및 보호자의 질환에 대한 이해를 명확히 한다.",xEn:"Establishes the clinical agenda and ensures accurate identification of the presenting problem.",xKo:"임상적 의제를 설정하고 발현 문제의 정확한 식별을 보장한다."},
          {id:"5-1-1-2",pts:10,en:"Item 2. History of Presenting Illness (Chronology and Symptom Progression): Obtains a structured account of symptom onset, progression, severity, timing, and evolution of abdominal pain and associated symptoms.",ko:"항목 2. 현병력(시간 경과 및 증상 진행): 복통과 동반 증상의 발병, 진행, 중증도, 시점, 진화에 대한 구조화된 진술을 청취한다.",xEn:"A detailed chronology is critical for identifying patterns characteristic of appendicitis and differentiating alternative diagnoses.",xKo:"상세한 시간 경과는 충수염의 특징적 양상을 식별하고 대안 진단을 구별하는 데 중요하다."},
          {id:"5-1-1-3",pts:5,en:"Item 3. Associated Symptoms and Review of Systems: Systematically explores gastrointestinal, urinary, gynecologic, respiratory, constitutional, and other relevant symptoms.",ko:"항목 3. 동반 증상 및 계통 문진: 위장관, 비뇨기, 부인과, 호흡기, 전신, 기타 관련 증상을 체계적으로 탐색한다.",xEn:"Helps refine the differential diagnosis and identify alternative or concurrent conditions.",xKo:"감별진단을 정교화하고 대안적 또는 동반 상태를 식별하는 데 도움이 된다."},
          {id:"5-1-1-4",pts:4,en:"Item 4. Past Medical and Surgical History: Assesses previous illnesses, abdominal disorders, prior surgeries, chronic diseases, and relevant developmental history.",ko:"항목 4. 과거 병력 및 수술력: 이전 질환, 복부 장애, 이전 수술, 만성 질환, 관련 발달력을 평가한다.",xEn:"Previous surgical history and underlying conditions can significantly influence diagnostic reasoning.",xKo:"이전 수술력과 기저 상태는 진단적 추론에 상당한 영향을 미칠 수 있다."},
          {id:"5-1-1-5",pts:3,en:"Item 5. Medication and Allergy History: Reviews medications, recent analgesic or antibiotic use, and allergies.",ko:"항목 5. 약물 및 알레르기력: 약물, 최근 진통제 또는 항생제 사용, 알레르기를 검토한다.",xEn:"Important for treatment planning and interpretation of symptom progression.",xKo:"치료 계획 및 증상 진행 해석에 중요하다."},
          {id:"5-1-1-6",pts:2,en:"Item 6. Immunization History: Confirms vaccination status and general preventive health history.",ko:"항목 6. 예방접종력: 예방접종 상태와 일반 예방 건강력을 확인한다.",xEn:"While not central to appendicitis diagnosis, it remains a standard component of pediatric assessment.",xKo:"충수염 진단에 핵심적이지는 않지만, 소아 평가의 표준 구성 요소로 남아 있다."},
          {id:"5-1-1-7",pts:4,en:"Item 7. Family, Social, and Environmental History: Assesses family history of gastrointestinal disease, household context, dietary exposures, and relevant social factors.",ko:"항목 7. 가족력, 사회력 및 환경력: 위장관 질환의 가족력, 가정 환경, 식이 노출, 관련 사회적 요인을 평가한다.",xEn:"Certain familial gastrointestinal conditions may mimic or influence evaluation of abdominal pain.",xKo:"특정 가족적 위장관 상태는 복통 평가를 모방하거나 영향을 미칠 수 있다."},
          {id:"5-1-1-8",pts:8,en:"Item 8. Assessment of Severity and Emergency Red Flags: Screens for signs of sepsis, shock, perforation, severe dehydration, altered mental status, or rapidly worsening symptoms.",ko:"항목 8. 중증도 및 응급 적신호 평가: 패혈증 징후, 쇼크, 천공, 심한 탈수, 의식 변화 또는 급속히 악화되는 증상을 선별한다.",xEn:"Early recognition of potentially life-threatening complications is a key emergency medicine competency.",xKo:"잠재적으로 생명을 위협하는 합병증의 조기 인식은 응급의학의 핵심 역량이다."},
        ],
        d2:[
          {id:"5-1-2-1",pts:15,en:"Item 1. Characterization of Abdominal Pain: Explores onset, location, migration, progression, severity, radiation, and aggravating/relieving factors, including pain with movement, coughing, or walking.",ko:"항목 1. 복통의 특성화: 발병, 위치, 이동, 진행, 중증도, 방사, 악화/완화 요인을 탐색하며, 움직임, 기침 또는 보행 시 통증을 포함한다.",xEn:"Pain migration from the periumbilical region to the RLQ is one of the most diagnostically valuable historical features of appendicitis and is central to clinical reasoning.",xKo:"배꼽 주위에서 우하복부로의 통증 이동은 충수염의 가장 진단적으로 가치 있는 병력 특징 중 하나이며 임상적 추론의 중심이다."},
          {id:"5-1-2-2",pts:10,en:"Item 2. Associated Gastrointestinal Symptoms: Assesses anorexia, nausea, vomiting, diarrhea, constipation, abdominal distension, and ability to tolerate oral intake.",ko:"항목 2. 동반 위장관 증상: 식욕부진, 오심, 구토, 설사, 변비, 복부 팽만, 경구 섭취 능력을 평가한다.",xEn:"The classic symptom constellation of anorexia, nausea, and vomiting substantially increases suspicion for appendicitis.",xKo:"식욕부진, 오심, 구토의 전형적인 증상 군집은 충수염에 대한 의심을 상당히 증가시킨다."},
          {id:"5-1-2-3",pts:10,en:"Item 3. Assessment for Perforation and Complicated Appendicitis: Evaluates worsening pain, generalized abdominal pain, persistent vomiting, inability to ambulate, prolonged symptoms, rigors, or signs suggesting perforation or abscess formation.",ko:"항목 3. 천공 및 합병성 충수염 평가: 악화되는 통증, 전반적 복통, 지속성 구토, 보행 불능, 지연된 증상, 오한 또는 천공이나 농양 형성을 시사하는 징후를 평가한다.",xEn:"Identifying complicated appendicitis is critical because it influences urgency, imaging strategy, and surgical management.",xKo:"합병성 충수염 식별은 긴급성, 영상 전략, 수술적 관리에 영향을 미치므로 중요하다."},
          {id:"5-1-2-4",pts:5,en:"Item 4. Fever and Systemic Symptom Assessment: Clarifies fever onset, maximum temperature, progression, chills, malaise, and other systemic symptoms.",ko:"항목 4. 발열 및 전신 증상 평가: 발열 발병, 최고 체온, 진행, 오한, 권태감, 기타 전신 증상을 명확히 한다.",xEn:"Fever supports an inflammatory process and may help distinguish uncomplicated from advanced disease.",xKo:"발열은 염증 과정을 뒷받침하고 합병증이 없는 질환과 진행된 질환을 구별하는 데 도움이 될 수 있다."},
          {id:"5-1-2-5",pts:5,en:"Item 5. Urinary Symptom Assessment: Specifically asks about dysuria, urinary frequency, urgency, hematuria, flank pain, and previous urinary tract infections.",ko:"항목 5. 비뇨기 증상 평가: 배뇨통, 빈뇨, 요급, 혈뇨, 옆구리 통증, 이전 요로감염에 대해 구체적으로 질문한다.",xEn:"Urinary tract pathology commonly mimics appendicitis, particularly when pelvic appendiceal inflammation causes urinary symptoms.",xKo:"요로 병리는 흔히 충수염을 모방하며, 특히 골반 충수의 염증이 비뇨기 증상을 유발할 때 그렇다."},
          {id:"5-1-2-6",pts:10,en:"Item 6. Gynecologic and Reproductive History: Assesses menstrual history, pregnancy risk, vaginal bleeding, vaginal discharge, pelvic pain, sexual activity (when age-appropriate), and prior gynecologic conditions.",ko:"항목 6. 부인과 및 생식력: 월경력, 임신 위험, 질 출혈, 질 분비물, 골반 통증, 성생활(연령에 적절한 경우), 이전 부인과 상태를 평가한다.",xEn:"In adolescent females, exclusion of gynecologic causes such as ovarian torsion, ruptured ovarian cyst, ectopic pregnancy, and pelvic inflammatory disease is essential.",xKo:"청소년 여성에서 난소 염전, 난소 낭종 파열, 자궁외 임신, 골반염과 같은 부인과적 원인의 배제는 필수적이다."},
          {id:"5-1-2-7",pts:5,en:"Item 7. Alternative Diagnosis Screening: Screens for symptoms suggestive of gastroenteritis, inflammatory bowel disease, pneumonia, mesenteric adenitis, renal colic, or other causes of abdominal pain.",ko:"항목 7. 대안 진단 선별: 위장관염, 염증성 장 질환, 폐렴, 장간막림프절염, 신장 산통 또는 기타 복통의 원인을 시사하는 증상을 선별한다.",xEn:"High-quality history taking requires active consideration and exclusion of important competing diagnoses.",xKo:"고품질 병력 청취는 중요한 경쟁 진단의 적극적 고려와 배제를 요구한다."},

      {
        id:"5-2", label_en:"Rubric 2", label_ko:"기준표 2", d1pts:40, d2pts:60,
        d1desc_en:"General Clinical History-Taking",
        d1desc_ko:"일반 임상 병력 청취",
        d2desc_en:"Case-Specific Diagnostic History — Acute Appendicitis",
        d2desc_ko:"사례 특이 진단적 병력 청취 — 급성 충수염",
        d1:[
          {id:"5-2-1-1",pts:10,en:"Item 1. History of Presenting Illness (structured): Systematically elicits onset, duration, progression, location, and character of the pain and associated symptoms, with temporal sequencing and aggravating/relieving factors.",ko:"항목 1. 현병력(구조화된 청취): 통증과 동반 증상의 발병, 지속 시간, 진행, 위치, 양상을 체계적으로 청취하며 시간적 순서와 악화/완화 요인을 포함한다.",xEn:"The backbone of any history and the highest-yield general element; a clear timeline (24 hours of pain that migrated, worsened, and is aggravated by movement) frames the entire surgical diagnosis — though the diagnostically pivotal migration narrative is rewarded heavily in Domain 2.",xKo:"모든 병력 청취의 근간이자 가장 높은 정보 수율을 갖는 일반 항목이다. 명확한 경과(24시간의 통증이 이동하고, 악화되고, 움직임에 의해 악화됨)는 전체 외과적 진단의 틀을 형성한다 — 단, 진단적으로 핵심인 이동 양상은 영역 2에서 크게 평가한다."},
          {id:"5-2-1-2",pts:7,en:"Item 2. Targeted Review of Systems & Pertinent Negatives: Screens related systems (GI, GU, gynecologic, respiratory, skin) to surface positives and clinically meaningful negatives.",ko:"항목 2. 표적 계통 문진 및 관련 음성 소견: 관련 계통(소화기, 비뇨기, 부인과, 호흡기, 피부)을 선별하여 양성 소견과 임상적으로 의미 있는 음성 소견을 드러낸다.",xEn:"The pertinent negatives here (no diarrhea, no urinary symptoms, no vaginal discharge, no respiratory symptoms) actively narrow away from gastroenteritis, UTI, pelvic infection, and lower-lobe pneumonia, so this ranks above the remaining general items.",xKo:"이 사례에서 관련 음성 소견(설사 없음, 비뇨기 증상 없음, 질 분비물 없음, 호흡기 증상 없음)은 위장관염, 요로감염, 골반 감염, 하엽 폐렴으로부터 적극적으로 좁히므로, 나머지 일반 항목보다 높은 순위를 차지한다."},
          {id:"5-2-1-3",pts:4,en:"Item 3. Past Medical & Surgical History: Prior illnesses, hospitalizations, chronic conditions, and — importantly — any prior abdominal or pelvic surgery.",ko:"항목 3. 과거 병력 및 수술력: 이전 질환, 입원력, 만성 질환, 그리고 — 중요하게 — 이전 복부 또는 골반 수술.",xEn:"Important context and a genuine flag here (prior surgery raises adhesive-obstruction risk and a prior appendectomy reshapes the entire differential); weighted modestly given the unremarkable background.",xKo:"여기서 중요한 맥락 및 진정한 표시(이전 수술은 유착성 폐쇄 위험을 높이고 이전 충수절제술은 전체 감별진단을 재구성함)이지만, 특이사항 없는 배경을 고려하여 적당히 가중치를 부여한다."},
          {id:"5-2-1-4",pts:4,en:"Item 4. Medications & Allergies: Current/recent medications — including analgesics and recent antibiotics — and documented drug allergies.",ko:"항목 4. 복용 약물 및 알레르기: 현재/최근 복용 약물 — 진통제 및 최근 항생제 포함 — 및 기록된 약물 알레르기.",xEn:"Directly relevant because recent antibiotics can blunt the presentation, prior analgesia alters the pain history, and allergies constrain perioperative antibiotic choice; a brief but bounded inquiry.",xKo:"최근 항생제는 발현을 둔화시킬 수 있고, 이전 진통제는 통증 병력을 변경하며, 알레르기는 수술 전후 항생제 선택을 제한하므로 직접적으로 관련된다. 간단하지만 한정된 질문이다."},
          {id:"5-2-1-5",pts:3,en:"Item 5. Immunization Status: Confirms up-to-date vaccination for age.",ko:"항목 5. 예방접종 상태: 연령에 맞는 최신 예방접종 여부 확인.",xEn:"A core pediatric element; lower-yield in this surgical presentation but retained for consistency and to gauge general health status.",xKo:"핵심 소아 항목이다. 이 외과적 발현에서는 수율이 낮지만 일관성과 전반적 건강 상태 평가를 위해 유지된다."},
          {id:"5-2-1-6",pts:3,en:"Item 6. Birth & Developmental History: Perinatal course and developmental trajectory.",ko:"항목 6. 출생력 및 발달력: 주산기 경과 및 발달 궤적.",xEn:"A standard component of a complete pediatric history; weighted low as it is largely non-contributory in a previously healthy 12-year-old.",xKo:"완전한 소아 병력 청취의 표준 구성 요소이지만, 이전에 건강한 12세 아동에서는 거의 기여하지 않으므로 낮게 가중치를 부여한다."},
          {id:"5-2-1-7",pts:3,en:"Item 7. Family History (general): Heritable conditions and relevant family medical background.",ko:"항목 7. 가족력(일반): 유전 가능한 질환 및 관련 가족 의학 배경.",xEn:"A baseline competency; the case-relevant familial inquiry (IBD, which can present as terminal ileitis mimicking appendicitis) is credited in Domain 2, so the general item stays modest.",xKo:"기본 역량이며, 사례 관련 가족력 문진(충수염을 모방하는 말단 회장염으로 발현할 수 있는 염증성 장 질환)은 영역 2에서 평가되므로 일반 항목은 적당한 비중을 유지한다."},
          {id:"5-2-1-8",pts:3,en:"Item 8. Social History & Caregiver Context: Home environment, caregivers, and living situation.",ko:"항목 8. 사회력 및 보호자 환경: 가정 환경, 보호자, 생활 상황.",xEn:"Provides context and supports operative consent and discharge planning; the high-stakes adolescent-specific psychosocial inquiry is rewarded in Domain 2, so the general item stays low.",xKo:"맥락을 제공하고 수술 동의 및 퇴원 계획을 지원한다. 청소년 특이적 정신사회적 문진은 영역 2에서 평가되므로 일반 항목은 낮게 유지된다."},
          {id:"5-2-1-9",pts:3,en:"Item 9. Collateral History & Developmentally-Appropriate, Confidential Communication: Obtains history from the patient directly with age-appropriate, organized, empathetic questioning, and corroborates with the caregiver.",ko:"항목 9. 보호자 병력 청취 및 발달 수준에 맞는 비밀 보장 의사소통: 환자로부터 직접 연령에 적절하고, 체계적이며, 공감적인 질문으로 병력을 청취하고, 보호자와 함께 확인한다.",xEn:"A distinctly pediatric skill that shifts at this age toward engaging the adolescent as the primary historian; explicitly assessed but kept modest here because the highest-stakes application — a confidential interview for sexual and menstrual history — is weighted heavily in Domain 2.",xKo:"이 연령에서는 청소년을 주된 정보 제공자로 참여시키는 방향으로 변경되는 소아과만의 고유한 기술이다. 명시적으로 평가하되, 가장 중요한 적용(성생활 및 월경 병력에 대한 비밀 면담)은 영역 2에서 크게 평가되므로 여기서는 적당한 비중을 유지한다."},
        ],
        d2:[
          {id:"5-2-2-1",pts:11,en:"Item 1. Pain Characterization & Classic Migration: Elicits the periumbilical-to-right-lower-quadrant migration, constant/progressive character, localization, and aggravation by movement, coughing, or jolting (peritoneal irritation by history).",ko:"항목 1. 통증 특성화 및 전형적 이동: 배꼽 주위에서 우하복부로의 이동, 지속적/진행적 양상, 국소화, 움직임, 기침 또는 흔들림에 의한 악화(병력상 복막 자극)를 청취한다.",xEn:"The migratory pattern and movement-aggravated, localized pain are the most discriminating positive features for appendicitis and the core of pediatric scoring tools, so this carries the highest weight in the rubric.",xKo:"이동 양상과 움직임에 악화되는 국소화된 통증은 충수염에 대한 가장 변별력 있는 양성 특징이며 소아 채점 도구의 핵심이다. 따라서 평가 기준에서 가장 높은 가중치를 부여한다."},
          {id:"5-2-2-2",pts:10,en:"Item 2. Gynecologic & Obstetric History (obtained confidentially): Last menstrual period and cycle regularity, mid-cycle timing (mittelschmerz/ovarian event), vaginal bleeding or discharge, and — via a private, developmentally appropriate, confidential interview — sexual activity and pregnancy risk.",ko:"항목 2. 부인과 및 산과 병력(비밀 보장으로 청취): 마지막 월경 주기와 주기 규칙성, 주기 중반 시점(중간 통증/난소 사건), 질 출혈 또는 분비물, 그리고 — 개인적, 발달에 적절한, 비밀 면담을 통해 — 성생활 및 임신 위험.",xEn:"In an adolescent girl, ectopic pregnancy, ovarian torsion, ruptured cyst, and pelvic inflammatory disease are the critical do-not-miss alternatives, and excluding pregnancy is mandatory before imaging/surgery; bundling the confidential-interview skill makes this the second-highest-weighted item (the vignette's LMP, denial of discharge, and negative β-hCG reflect exactly these questions).",xKo:"청소년 여아에서 자궁외 임신, 난소 염전, 낭종 파열, 골반염은 절대 놓치면 안 되는 중요한 대안이며, 영상검사/수술 전 임신 배제는 필수다. 비밀 면담 기술을 묶어서 두 번째로 높은 가중치를 부여한다(본 사례의 마지막 월경 주기, 분비물 부인, 음성 β-hCG가 정확히 이러한 질문을 반영함)."},
          {id:"5-2-2-3",pts:8,en:"Item 3. Anorexia, Nausea & Vomiting — and the Pain-Versus-Vomiting Sequence: Establishes presence of anorexia and nausea/emesis and, crucially, their timing relative to pain onset.",ko:"항목 3. 식욕부진, 오심 및 구토 — 그리고 통증 대 구토 순서: 식욕부진과 오심/구토의 유무, 그리고 결정적으로 통증 발병에 대한 시점을 확립한다.",xEn:"Anorexia is sensitive for appendicitis, and the sequence is highly discriminating — pain before vomiting favors a surgical abdomen, whereas vomiting before pain favors gastroenteritis — so this is high-value.",xKo:"식욕부진은 충수염에 대해 민감하고, 순서는 매우 변별력 있다 — 구토 전 통증은 외과적 복통을 시사하고, 통증 전 구토는 위장관염을 시사한다 — 따라서 가치가 높다."},
          {id:"5-2-2-4",pts:8,en:"Item 4. Differential for RLQ Pain (GI/surgical/medical mimics): Screens for gastroenteritis, recent viral illness or pharyngitis suggesting mesenteric adenitis, constipation, features of inflammatory bowel disease (chronic pain, weight loss, perianal symptoms, family history), and Meckel's diverticulum.",ko:"항목 4. 우하복부 통증에 대한 감별진단(위장관/외과/내과적 모방): 위장관염, 장간막림프절염을 시사하는 최근 바이러스 질환이나 인두염, 변비, 염증성 장 질환의 특징(만성 통증, 체중 감소, 항문 주위 증상, 가족력), 메켈 게실을 선별한다.",xEn:"RLQ pain has a broad differential, and deliberately screening these mimics — several of which avoid an operation — is core diagnostic reasoning, weighted equally with the vomiting sequence.",xKo:"우하복부 통증은 광범위한 감별진단이 있으며, 이러한 모방 — 그 중 일부는 수술을 피할 수 있음 — 을 의도적으로 선별하는 것은 핵심 진단적 추론이다. 구토 순서와 동등한 가중치를 부여한다."},
          {id:"5-2-2-5",pts:6,en:"Item 5. Genitourinary & Renal Differential: Dysuria, frequency, urgency, hematuria, and flank/loin pain (UTI, pyelonephritis, ureteric calculus).",ko:"항목 5. 비뇨생식기 및 신장 감별: 배뇨통, 빈뇨, 요급, 혈뇨, 옆구리/허리 통증(요로감염, 신우신염, 요관 결석).",xEn:"Urinary tract pathology classically mimics appendicitis (a retrocecal appendix can also irritate the ureter), and this history pairs with the urinalysis to discriminate; solid, targeted value.",xKo:"요로 병리는 전형적으로 충수염을 모방한다(맹장후 충수는 요관을 자극할 수도 있음). 이 병력은 소변 검사와 짝을 이루어 구별한다. 확실하고 표적화된 가치가 있다."},
          {id:"5-2-2-6",pts:6,en:"Item 6. Bowel Habits & Constipation: Last bowel movement, stool pattern, obstipation, and any small-volume diarrhea.",ko:"항목 6. 배변 습관 및 변비: 마지막 배변, 변 양상, 변폐색, 소량 설사.",xEn:"Constipation is a frequent benign mimic, while a pelvic appendix can cause small-volume diarrhea or tenesmus that misleads toward gastroenteritis; rewarding it identifies the more careful history-takers.",xKo:"변비는 흔한 양성 모방이며, 골반 충수는 소량 설사나 후중감을 일으켜 위장관염으로 오도할 수 있다. 이 항목을 평가하면 더 주의 깊은 병력 청취자를 식별할 수 있다."},
          {id:"5-2-2-7",pts:6,en:"Item 7. Severity & Perforation Red Flags: Symptom duration (rising perforation risk beyond ~48 hours), any transient improvement in pain followed by worsening or diffuse abdominal pain (perforation with peritonitis), high fever, and inability to walk, jump, or tolerate movement.",ko:"항목 7. 중증도 및 천공 적신호: 증상 지속 시간(48시간 초과 시 천공 위험 증가), 통증의 일시적 개선 후 악화 또는 미만성 복통(복막염을 동반한 천공), 고열, 걷거나 뛰거나 움직임을 견딜 수 없음.",xEn:"Distinguishing simple from perforated/complicated appendicitis changes operative urgency and counseling, so this forward-looking severity inquiry warrants substantial weight.",xKo:"단순 vs 천공된/합병된 충수염을 구별하는 것은 수술 긴급성과 상담을 변경하므로, 이러한 선제적 중증도 문진은 상당한 가중치를 받을 만하다."},
          {id:"5-2-2-8",pts:5,en:"Item 8. Red Flags for Systemic Deterioration / Sepsis: Rigors, persistent high fever, lethargy, light-headedness or syncope, and parental/patient sense of rapid worsening.",ko:"항목 8. 전신 악화/패혈증의 적신호: 오한, 지속적 고열, 무기력, 어지러움 또는 실신, 보호자/환자가 인지하는 급속한 악화.",xEn:"Identifying the child progressing toward sepsis is critical for safe triage and prioritization to theatre; weighted as a focused safety net given the currently stable, well-perfused presentation.",xKo:"패혈증으로 진행 중인 아동을 식별하는 것은 안전한 진료 분류와 수술실 우선 배정에 중요하다. 현재 안정적이고 관류가 양호한 발현을 고려하여 집중된 안전망으로서의 가중치를 부여한다."},

        d1:[
          {id:"5-3-1-1",pts:10,en:"Item 1. History of Present Illness (HPI) Chronology & Progression: Elicits a clear timeline of symptom onset, mapping the evolution of the illness over the past 24 hours and establishing the exact sequence in which the symptoms appeared.",ko:"항목 1. 현병력의 시간적 경과 및 진행: 증상 발병의 명확한 시간 경과를 청취하며, 지난 24시간 동안의 질환 진행을 도식화하고 증상이 나타난 정확한 순서를 확립한다.",xEn:"The chronology of symptoms is paramount in acute abdominal pain. Knowing the exact duration of symptoms helps predict the clinical risk of appendiceal perforation, and tracking the progression helps differentiate an acute surgical abdomen from more benign, subacute, or self-limiting etiologies.",xKo:"증상의 시간 경과는 급성 복통에서 가장 중요하다. 증상의 정확한 지속 시간을 아는 것은 충수 천공의 임상적 위험을 예측하는 데 도움이 되며, 진행을 추적하는 것은 급성 외과적 복통을 더 양성, 아급성 또는 자가 제한적 원인과 구별하는 데 도움이 된다."},
          {id:"5-3-1-2",pts:10,en:"Item 2. Past Medical, Surgical, & Family History: Systematically investigates underlying medical conditions, prior hospitalizations, and specifically confirms whether the patient has had any prior abdominal surgeries (including a previous appendectomy).",ko:"항목 2. 과거 병력, 수술력 및 가족력: 기저 의학적 상태, 이전 입원을 체계적으로 조사하고, 특히 환자가 이전 복부 수술(이전 충수절제술 포함)을 받았는지 여부를 확인한다.",xEn:"In evaluating acute abdominal pain, a history of prior abdominal surgery introduces new high-risk differentials, such as bowel obstruction secondary to adhesions. Conversely, confirming that the patient still possesses her appendix is an obvious but necessary prerequisite for the working diagnosis.",xKo:"급성 복통 평가에서 이전 복부 수술 병력은 유착에 이차적인 장폐쇄와 같은 새로운 고위험 감별진단을 도입한다. 반대로, 환자가 여전히 충수를 가지고 있음을 확인하는 것은 작업 진단을 위해 명백하지만 필요한 전제 조건이다."},
          {id:"5-3-1-3",pts:10,en:"Item 3. Medications, Allergies, & Immunizations: Confirms recent home administration of analgesics or antipyretics, verifies medication allergies, and checks immunization status.",ko:"항목 3. 복용 약물, 알레르기 및 예방접종: 진통제 또는 해열제의 최근 가정 투여를 확인하고, 약물 알레르기를 확인하며, 예방접종 상태를 점검한다.",xEn:"Eliciting prior use of pain medications or fever reducers at home is crucial, as these can mask the severity of localized peritonitis or systemic toxicity upon arrival. Furthermore, obtaining accurate allergy information is a mandatory safety step in a patient who will likely require preoperative intravenous antibiotics.",xKo:"가정에서 통증약이나 해열제의 이전 사용을 청취하는 것은 중요하다. 이들은 도착 시 국소성 복막염이나 전신 독성의 중증도를 차폐할 수 있기 때문이다. 또한, 정확한 알레르기 정보를 얻는 것은 수술 전 정맥 항생제가 필요할 가능성이 높은 환자에서 필수 안전 단계다."},
          {id:"5-3-1-4",pts:10,en:"Item 4. General Pediatric Review of Systems & Baseline Behavioral Status: Assesses overall systemic toxicity and functional limitation, asking how the patient's activity level has changed (e.g., a sudden refusal to walk, or preferring to lie completely still).",ko:"항목 4. 일반 소아 계통 문진 및 기저 행동 상태: 전반적 전신 독성과 기능적 제한을 평가하며, 환자의 활동 수준이 어떻게 변했는지(예: 갑작스러운 보행 거부, 또는 완전히 가만히 누워 있기를 선호) 질문한다.",xEn:"Children with focal peritonitis instinctively minimize movement to avoid pain. Identifying a behavioral shift where a normally active 12-year-old refuses to jump, walk, or move in bed is a highly reliable, historical surrogate for peritoneal irritation.",xKo:"국소성 복막염이 있는 아동은 통증을 피하기 위해 본능적으로 움직임을 최소화한다. 평소 활동적인 12세 아동이 점프, 보행 또는 침대에서 움직임을 거부하는 행동 변화를 식별하는 것은 복막 자극에 대한 매우 신뢰할 수 있는 병력적 대리 지표다."},

          {id:"5-3-2-2",pts:15,en:"Item 2. Sequence of Gastrointestinal Symptoms & Anorexia: Investigates the presence of anorexia (loss of appetite) and establishes the exact chronological relationship between the onset of abdominal pain and the onset of nausea or vomiting.",ko:"항목 2. 위장관 증상 및 식욕부진의 순서: 식욕부진(식욕 상실)의 유무를 조사하고 복통 발병과 오심 또는 구토 발병 사이의 정확한 시간 관계를 확립한다.",xEn:"The order of symptom appearance is a critical diagnostic discriminator. In appendicitis, pain almost always precedes vomiting; conversely, in viral gastroenteritis, vomiting generally precedes or coincides with diffuse cramping. Furthermore, anorexia is heavily associated with acute appendicitis — a child who is genuinely hungry is much less likely to have an inflamed appendix.",xKo:"증상 출현 순서는 중요한 진단적 변별 요인이다. 충수염에서 통증은 거의 항상 구토에 선행한다. 반대로 바이러스성 위장관염에서 구토는 일반적으로 미만성 산통에 선행하거나 동시 발생한다. 또한, 식욕부진은 급성 충수염과 강하게 연관되어 있다 — 진정으로 배고픈 아동은 염증이 있는 충수를 가질 가능성이 훨씬 낮다."},
          {id:"5-3-2-3",pts:15,en:"Item 3. Gynecological and Reproductive History: Obtains a detailed menstrual history (including the date of the Last Menstrual Period), assesses for vaginal discharge, and safely and confidentially screens for sexual activity.",ko:"항목 3. 부인과 및 생식력: 상세한 월경력(마지막 월경 주기 날짜 포함)을 청취하고, 질 분비물을 평가하며, 안전하고 비밀스럽게 성생활을 선별한다.",xEn:"A 12-year-old female presenting with lower abdominal pain is considered to be of reproductive age. A competent emergency clinician must explicitly evaluate for gynecological emergencies — such as ovarian torsion, pelvic inflammatory disease (PID), and ectopic pregnancy — which can present with right lower quadrant pain identical to acute appendicitis.",xKo:"하복부 통증으로 발현된 12세 여성은 가임 연령으로 간주된다. 유능한 응급 임상의는 부인과적 응급 상황 — 난소 염전, 골반염(PID), 자궁외 임신 — 을 명시적으로 평가해야 한다. 이들은 급성 충수염과 동일한 우하복부 통증으로 발현될 수 있다."},

// ─── ERROR BOUNDARY ──────────────────────────────────────────────────────────
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(err) {
    return { error: err };
  }
  componentDidCatch(err, info) {
    console.error('React render error:', err, info);
  }
  render() {
    if (this.state.error) {
      var e = this.state.error;
      return React.createElement('div', {
        style: {padding:'20px', margin:'20px', border:'2px solid #c00',
                borderRadius:'8px', fontFamily:'monospace', fontSize:'13px', color:'#c00',
                background:'#fff', whiteSpace:'pre-wrap', wordBreak:'break-all'}
      }, 'Render Error (screenshot this):\n' + e.message + '\n\n' + (e.stack || ''));
    }
    return this.props.children;
  }
}

const scrollTop = () => {

function CountryDropdown({ value, onChange, lang }) {
  const [open, setOpen] = useState(false);
  const [search, setSearch] = useState("");
  const t = (en,ko) => T(en,ko,lang);
  const wrapperRef = React.useRef(null);

  React.useEffect(() => {
    const onClickOutside = (e) => {
      if (wrapperRef.current && !wrapperRef.current.contains(e.target)) {
        setOpen(false); setSearch("");
      }
    };
    document.addEventListener("mousedown", onClickOutside);
    return () => document.removeEventListener("mousedown", onClickOutside);
  }, []);

  const selectedCountry = value === "na"
    ? {code:"na", en:"Prefer not to answer", ko:"응답하지 않음"}
    : COUNTRY_LIST.find(c => c.code === value);
  const selectedLabel = selectedCountry ? t(selectedCountry.en, selectedCountry.ko) : t("Select a country...","국가를 선택하세요...");

  const q = search.toLowerCase().trim();
  const filtered = q
    ? COUNTRY_LIST.filter(c => c.en.toLowerCase().includes(q) || c.ko.includes(search.trim()) || c.code.toLowerCase().includes(q))
    : COUNTRY_LIST;
  const pinned = filtered.filter(c => c.pinned);
  const rest = filtered.filter(c => !c.pinned);

  return h('div',{ref:wrapperRef,style:{position:"relative"}},
    h('button',{type:"button",onClick:()=>setOpen(!open),
      style:{width:"100%",padding:"12px 14px",fontSize:14,
        border:"1px solid "+(open?navy:cardBd),borderRadius:8,background:white,

// ─── Demographics helper components (defined at module scope to preserve input focus on re-render) ───
// RadioGroup with optional inline text input under each option (e.g., "Other (please specify)")
// textInputs: { [optionValue]: { value, onChange, placeholder } }
const DemoRadioGroup = ({ name, value, onChange, options, textInputs, lang }) => {
  const t = (en,ko) => T(en,ko,lang);
  return h('div',{style:{display:"flex",flexDirection:"column",gap:8}},
    options.map(opt => {
      const selected = value===opt.value;
      const inputCfg = textInputs && textInputs[opt.value];
      return h('div',{key:opt.value,
        style:{border:"1px solid "+(selected?navy:cardBd),
          borderRadius:8,
          background:selected?navyL:white,
          transition:"border-color 0.15s, background 0.15s",
          overflow:"hidden"}},
        h('label',{style:{display:"flex",alignItems:"flex-start",gap:10,
          padding:"10px 14px",cursor:"pointer"}},
          h('input',{type:"radio",name,checked:selected,
            onChange:()=>onChange(opt.value),
            style:{marginTop:2,width:16,height:16,cursor:"pointer",accentColor:navy,flexShrink:0}}),
          h('span',{style:{fontSize:14,color:txt,lineHeight:1.5,
            fontWeight:selected?600:400}},
            t(opt.en, opt.ko))
        ),
        selected && inputCfg && h('div',{style:{padding:"0 14px 12px",
          marginLeft:30}},
          h('input',{type:"text",value:inputCfg.value,
            onChange:e=>inputCfg.onChange(e.target.value),
            placeholder:inputCfg.placeholder,
            style:{width:"100%",padding:"9px 12px",fontSize:14,
              border:"1px solid "+navyMid,
              background:white,
              borderRadius:6,fontFamily:ffs,outline:"none",
              boxShadow:"0 0 0 2px rgba(45,74,138,0.10)"}})
        )
      );
    })
  );
};

const DemoFieldLabel = ({ num, en, ko, lang }) => {

const DemoSection = ({ children, style }) =>

function DemographicsScreen({ onContinue, initialData }) {
  const lang = useLang();
  const t = (en,ko) => T(en,ko,lang);
  const [data, setData] = useState(initialData || {
    exp:"", country_practice:"", country_training:"",
    setting:"", setting_other:"",
    specialty:"", specialty_sub:"", specialty_other:"",
    ai_use:""
  });

  const update = (key, val) => setData(d => ({...d, [key]: val}));

  // Validation: each main field must have a value; "other" fields must be filled if "other" is selected
  const isValid = () => {
    if (!data.exp || !data.country_practice || !data.country_training || !data.setting || !data.specialty || !data.ai_use) return false;
    if (data.setting === "other" && !data.setting_other.trim()) return false;
    if (data.specialty === "subspecialty" && !data.specialty_sub.trim()) return false;
    if (data.specialty === "other" && !data.specialty_other.trim()) return false;
    return true;
  };

  return h(PageWrap, null,
    h('div',{style:{textAlign:"center",marginBottom:28}},
      h('h1',{style:{fontSize:24,fontWeight:700,color:navy,fontFamily:ffs,marginBottom:10}},
        t("About you","본인 소개")),
      h('p',{style:{fontSize:14,color:muted,lineHeight:1.65,maxWidth:560,margin:"0 auto"}},
        t("Before we begin, please tell us a bit about yourself. This information helps us interpret survey results across different professional backgrounds. All responses are anonymous.",
          "시작하기 전에 본인에 대해 간단히 알려주시기 바랍니다. 이 정보는 다양한 직무 배경에 따른 설문 결과 해석에 도움이 됩니다. 모든 응답은 익명으로 처리됩니다."))
    ),

    h(Card, {style:{overflow:"visible"}},
      // Q1 — Years of experience
      h(DemoSection,{style:{borderTop:"none",paddingTop:24}},
        h(DemoFieldLabel,{num:1,en:"How many years of clinical experience do you have?",ko:"임상 경력은 몇 년이십니까?",lang}),
        h(DemoRadioGroup,{lang,name:"exp",value:data.exp,onChange:v=>update("exp",v),
          options:[
            {value:"0-5",en:"0–5 years",ko:"0–5년"},
            {value:"6-10",en:"6–10 years",ko:"6–10년"},
            {value:"11-20",en:"11–20 years",ko:"11–20년"},
            {value:"20+",en:"20+ years",ko:"20년 이상"},
            {value:"na",en:"Prefer not to answer",ko:"응답하지 않음"}
          ]
        })
      ),

      // Q2 — Country of current practice
      h(DemoSection,null,
        h(DemoFieldLabel,{num:2,en:"In which country do you currently practice?",ko:"현재 어느 국가에서 진료하고 계십니까?",lang}),
        h(CountryDropdown,{value:data.country_practice,onChange:v=>update("country_practice",v),lang})
      ),

      // Q3 — Country of medical training
      h(DemoSection,null,
        h(DemoFieldLabel,{num:3,en:"In which country did you complete your medical training?",ko:"어느 국가에서 의학 교육을 마치셨습니까?",lang}),
        h(CountryDropdown,{value:data.country_training,onChange:v=>update("country_training",v),lang})
      ),

      // Q4 — Primary clinical setting
      h(DemoSection,null,
        h(DemoFieldLabel,{num:4,en:"What is your primary clinical setting?",ko:"귀하의 주된 진료 환경은 어디입니까?",lang}),
        h(DemoRadioGroup,{lang,name:"setting",value:data.setting,onChange:v=>update("setting",v),
          options:[
            {value:"ed",en:"Emergency department / urgent care",ko:"응급실 / 응급진료센터"},
            {value:"outpatient",en:"Outpatient clinic",ko:"외래 진료"},
            {value:"inpatient",en:"Inpatient ward (non-ICU)",ko:"일반 병동 (중환자실 제외)"},
            {value:"icu",en:"PICU / NICU",ko:"소아·신생아 중환자실 (PICU / NICU)"},
            {value:"other",en:"Other (please specify)",ko:"기타 (직접 입력)"},
            {value:"na",en:"Prefer not to answer",ko:"응답하지 않음"}
          ],
          textInputs: {
            other: {
              value: data.setting_other,
              onChange: v => update("setting_other", v),
              placeholder: t("Please specify","직접 입력해 주세요")
            }
          }
        })
      ),

      // Q5 — Primary clinical specialty
      h(DemoSection,null,
        h(DemoFieldLabel,{num:5,en:"Which best describes your primary clinical specialty?",ko:"귀하의 주된 임상 전공을 가장 잘 설명하는 것은 무엇입니까?",lang}),
        h(DemoRadioGroup,{lang,name:"specialty",value:data.specialty,onChange:v=>update("specialty",v),
          options:[
            {value:"general",en:"General pediatrics",ko:"일반 소아과"},
            {value:"subspecialty",en:"Pediatric subspecialty (please specify)",ko:"소아 세부 전공 (직접 입력)"},
            {value:"other",en:"Other (please specify)",ko:"기타 (직접 입력)"},
            {value:"na",en:"Prefer not to answer",ko:"응답하지 않음"}
          ],
          textInputs: {
            subspecialty: {
              value: data.specialty_sub,
              onChange: v => update("specialty_sub", v),
              placeholder: t("e.g., pediatric cardiology, oncology, neurology","예: 소아 심장학, 종양학, 신경학")
            },
            other: {
              value: data.specialty_other,
              onChange: v => update("specialty_other", v),
              placeholder: t("Please specify","직접 입력해 주세요")
            }
          }
        })
      ),

      // Q6 — Prior AI tool use
      h(DemoSection,null,
        h(DemoFieldLabel,{num:6,lang,
          en:"How often have you used AI chatbots/generative AI tools (e.g., ChatGPT, Claude, etc.) for clinical or teaching/assessment tasks?",
          ko:"임상 또는 교육/평가 업무에 AI 챗봇/생성형 AI 도구(예: ChatGPT, Claude 등)를 얼마나 자주 사용하셨습니까?"}),
        h(DemoRadioGroup,{lang,name:"ai_use",value:data.ai_use,onChange:v=>update("ai_use",v),
          options:[
            {value:"never",en:"Never",ko:"사용한 적 없음"},
            {value:"rarely",en:"Rarely",ko:"드물게"},
            {value:"sometimes",en:"Sometimes",ko:"가끔"},
            {value:"regularly",en:"Regularly",ko:"자주"},
            {value:"na",en:"Prefer not to answer",ko:"응답하지 않음"}
          ]
        })
      ),

      // Submit
      h('div',{style:{padding:"24px 28px 28px",borderTop:"1px solid "+cardBd,background:"#FAFBFD"}},
        !isValid() && h('p',{style:{fontSize:13,color:muted,textAlign:"center",margin:"0 0 12px",fontStyle:"italic"}},
          t("Please answer all questions to continue.","계속하려면 모든 질문에 답해 주십시오.")),
        h(PrimaryBtn,{onClick:()=>{scrollTop();onContinue(data);},disabled:!isValid()},
          t("Continue →","계속 →"))
      )
    )
  );
}

function PartAScreen({ caseData, rubric, onNext, onBack, draftAnswers, onDraftChange }) {
  const lang = useLang();
  const t = (en,ko) => T(en,ko,lang);
  const [partA, setPartA] = useState(()=>draftAnswers.answers||{});
  const [comments, setComments] = useState(()=>draftAnswers.comments||{});

  const allItems = [...rubric.d1, ...rubric.d2];
  const totalItems = allItems.length;
  const answeredItems = Object.keys(partA).length;
  const allAnswered = answeredItems === totalItems;
  const itemRefs = React.useRef({});
  const commentTimer = React.useRef(null);
  const [highlightId, setHighlightId] = useState(null);


  // Save full draft (answers + comments) to parent on every change
  React.useEffect(() => {
    onDraftChange({answers: partA, comments});
  }, [partA, comments]);

  const goToFirst = () => {
    const firstMissing = allItems.find(item => partA[item.id] === undefined);
    if (!firstMissing) return;
    setHighlightId(firstMissing.id);
    const el = itemRefs.current[firstMissing.id];
    if (el) { el.scrollIntoView({behavior:"smooth", block:"center"}); }
    setTimeout(() => setHighlightId(null), 5000);
  };

  const ItemRow = ({item, idx, showTop}) => {
    const ans = partA[item.id];

    const bodyRaw = colonIdx > -1 ? raw.slice(colonIdx+2) : "";
    const ptsLabel = lang==="ko" ? " — " + item.pts + "점" : " — " + item.pts + " points";
    const body = bodyRaw ? bodyRaw + ptsLabel : ptsLabel.trim();
    const isHighlighted = highlightId === item.id;
    return h('div',{ref: el => { itemRefs.current[item.id] = el; },
      style:{
      padding:"20px 22px",
      borderTop: showTop ? "1px solid "+cardBd : "none",
      background: isHighlighted ? "#FFF3CD" : ans===true ? greenBg : ans===false ? redBg : white,
      outline: isHighlighted ? "2px solid #F59E0B" : "none",
      outlineOffset: "-2px",
      transition:"background 0.3s, outline 0.3s"}},
      isHighlighted && h('p',{style:{fontSize:12,fontWeight:700,color:"#92400e",

      body && h('p',{style:{fontSize:13,color:txt,lineHeight:1.65,margin:"0 0 14px"}},body),
      h('div',{style:{
        background: ans===true?"#dcfce7" : ans===false?"#fee2e2" : "#F0F4FA",
        border:"1px solid "+(ans===true?greenBd:ans===false?redBd:cardBd),
        borderRadius:8,padding:"10px 14px",marginBottom:14}},
        h('p',{style:{fontSize:12,fontWeight:700,
          color:ans===true?green:ans===false?red:muted,
          textTransform:"uppercase",letterSpacing:"0.05em",margin:"0 0 4px"}},
          t("Explanation","설명")),
        h('p',{style:{fontSize:13,color:ans===true?"#14532d":ans===false?"#4c0519":"#374151",
          lineHeight:1.65,margin:0}},t(item.xEn,item.xKo))),
      h('div',{style:{display:"flex",gap:10,marginBottom:ans!==undefined?12:0}},
        h('button',{onClick:()=>{setPartA(p=>({...p,[item.id]:true}))},
          style:{flex:1,padding:"11px 0",borderRadius:8,fontSize:14,fontWeight:600,
            border:"2px solid "+(ans===true?green:cardBd),
            background:ans===true?greenBg:white,color:ans===true?green:muted,
            cursor:"pointer",transition:"all 0.15s"}},
          "✓ "+t("Agree","동의")),
        h('button',{onClick:()=>{setPartA(p=>({...p,[item.id]:false}))},
          style:{flex:1,padding:"11px 0",borderRadius:8,fontSize:14,fontWeight:600,
            border:"2px solid "+(ans===false?red:cardBd),
            background:ans===false?redBg:white,color:ans===false?red:muted,
            cursor:"pointer",transition:"all 0.15s"}},
          "✗ "+t("Disagree","비동의"))),
      ans!==undefined && h('textarea',{
        placeholder:t("Optional comment for this item…","이 항목에 대한 선택적 의견…"),
        defaultValue:comments[item.id]||"",
        key:"cmt-"+item.id,
        onBlur:e=>{const v=e.target.value; setComments(c=>({...c,[item.id]:v}));},
        style:{width:"100%",padding:"9px 12px",fontSize:14,
          border:"1px solid "+cardBd,borderRadius:8,resize:"vertical",
          fontFamily:ffs,boxSizing:"border-box",minHeight:60,
          background:"rgba(255,255,255,0.8)"}})
    );
  };

  const Domain = ({items, label, desc, pts}) =>
    h('div',{style:{marginBottom:24}},
      h('div',{style:{background:navyL,border:"1px solid "+navyBd,
        borderRadius:"10px 10px 0 0",padding:"12px 20px",
        display:"flex",justifyContent:"space-between",alignItems:"flex-start"}},
        h('div',{style:{flex:1}},

        h('span',{style:{fontSize:13,fontWeight:700,color:navyMid,flexShrink:0,marginLeft:12,marginTop:2}},
          pts+t(" pts"," 점"))),
      h('div',{style:{border:"1px solid "+cardBd,borderTop:"none",
        borderRadius:"0 0 10px 10px",overflow:"hidden"}},
        items.map((item,idx)=>h(ItemRow,{key:item.id,item,idx,showTop:idx>0})))
    );

  const d1label = t("Domain 1: General Clinical History-Taking","영역 1: 일반 임상 병력 청취");
  const d2label = t("Domain 2: Case-Specific Diagnostic History","영역 2: 사례별 진단 추론");

  return h('div',{style:{flex:1,minWidth:0}},
    h(Card,{style:{padding:"16px 22px",marginBottom:20,background:navyL,border:"1px solid "+navyBd,boxShadow:"none"}},
      h('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12}},
        h('div',null,
          h('p',{style:{fontSize:16,fontWeight:700,color:navy,margin:"0 0 4px"}},
            t(rubric.label_en,rubric.label_ko)+" — "+t("Part A","파트 A")),
          h('p',{style:{fontSize:13,color:muted,margin:0}},
            t("Select Agree or Disagree for each item. You may add an optional comment.",
              "각 항목에 동의 또는 비동의를 선택하세요. 선택적 의견을 추가할 수 있습니다."))),
        h('div',{style:{textAlign:"right",flexShrink:0}},
          h('p',{style:{fontSize:11,color:muted,margin:"0 0 2px"}},t("Total","총점")),
          h('p',{style:{fontSize:18,fontWeight:700,color:navyMid,margin:0}},
            (rubric.d1pts+rubric.d2pts)+t(" pts"," 점")))),
      (rubric.threshold_en||rubric.rationale_en) &&
        h('div',{style:{background:amberBg,border:"1px solid "+amberBd,
          borderRadius:8,padding:"10px 14px",marginTop:14,
          display:"flex",gap:10,alignItems:"flex-start"}},
          h('span',{style:{fontSize:15,flexShrink:0}},"ℹ️"),
          h('p',{style:{fontSize:13,color:"#78350f",lineHeight:1.65,margin:0}},
            t(rubric.threshold_en||rubric.rationale_en,
              rubric.threshold_ko||rubric.rationale_ko)))
    ),
    h(Domain,{items:rubric.d1,label:d1label,desc:t(rubric.d1desc_en||'',rubric.d1desc_ko||''),pts:rubric.d1pts}),
    h(Domain,{items:rubric.d2,label:d2label,desc:t(rubric.d2desc_en||'',rubric.d2desc_ko||''),pts:rubric.d2pts}),
    h('div',{style:{display:"flex",gap:12,alignItems:"center"}},
      onBack && h('button',{onClick:onBack,
        style:{padding:"14px 20px",borderRadius:10,border:"2px solid "+navy,
          background:white,color:navy,fontSize:15,fontWeight:600,
          cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}},
        "← "+t("Back","이전")),
      h(PrimaryBtn,{
        onClick:()=>{ if(allAnswered){ onNext({partA,comments}); } else { goToFirst(); } }},
        t("Continue to Part B →","파트 B로 계속 →"))
    )
  );
}

// ─── PART B SCREEN ───────────────────────────────────────────────────────────
function PartBScreen({ caseData, rubric, ci, ri, isLast, onSubmit, partAData, onBack, bDraft, onBDraftChange }) {
  const lang = useLang();
  const t = (en,ko) => T(en,ko,lang);
  const [d1Order, setD1Order_] = useState(()=>(bDraft && bDraft.d1Order)||[...rubric.d1].sort((a,b)=>b.pts-a.pts).map(i=>i.id));
  const [d2Order, setD2Order_] = useState(()=>(bDraft && bDraft.d2Order)||[...rubric.d2].sort((a,b)=>b.pts-a.pts).map(i=>i.id));
  const [finalCmt, setFinalCmt_] = useState((bDraft && bDraft.finalCmt)||"");
  // Wrapped setters that also persist draft immediately (no useEffect = no re-render cascade)
  const d1OrderRef  = React.useRef(d1Order);
  const bCommentTimer = React.useRef(null);
  const d2OrderRef  = React.useRef(d2Order);
  const finalCmtRef = React.useRef(finalCmt);
  const setD1Order = React.useCallback((valOrFn)=>{
    setD1Order_(prev=>{ const next=typeof valOrFn==='function'?valOrFn(prev):valOrFn; d1OrderRef.current=next; onBDraftChange(next,d2OrderRef.current,finalCmtRef.current); return next; });
  },[onBDraftChange]);
  const setD2Order = React.useCallback((valOrFn)=>{
    setD2Order_(prev=>{ const next=typeof valOrFn==='function'?valOrFn(prev):valOrFn; d2OrderRef.current=next; onBDraftChange(d1OrderRef.current,next,finalCmtRef.current); return next; });
  },[onBDraftChange]);
  const setFinalCmt = React.useCallback((val)=>{
    setFinalCmt_(val); finalCmtRef.current=val; onBDraftChange(d1OrderRef.current,d2OrderRef.current,val);
  },[onBDraftChange]);
  const moveItem = (order, setOrder, idx, dir) => {
    const next=[...order]; const to=idx+dir;
    if(to<0||to>=next.length) return;
    [next[idx],next[to]]=[next[to],next[idx]];
    setOrder(next);
  };

  // Next button label — no "submit", just navigation
  const nextLabel = () => {
    if(isLast) return t("Finish Survey →","설문 완료 →");
    const nr=ri+1;
    const nrInCase = nr < caseData.rubrics.length;
    if(nrInCase) return t("Next Rubric →","다음 기준표 →");
    return t("Next Case →","다음 사례 →");
  };

  const SortableList = ({items, order, setOrder}) => {
    const [dragging, setDragging] = React.useState(null);
    const [overIdx, setOverIdx]   = React.useState(null);
    const itemEls = React.useRef({});
    // Keep latest dragging/overIdx in refs so window handlers can read current values
    const draggingRef = React.useRef(null);
    const overIdxRef  = React.useRef(null);
    const orderRef    = React.useRef(order);
    React.useEffect(() => { orderRef.current = order; }, [order]);

    const computeOverIdx = (clientY, snaps, fromIdx) => {
      let bestIdx = fromIdx, bestDist = Infinity;
      orderRef.current.forEach((id2, i) => {
        const snap = snaps[id2];
        if(!snap) return;
        const mid = snap.top + snap.height / 2;
        const dist = Math.abs(clientY - mid);
        if(dist < bestDist) { bestDist = dist; bestIdx = i; }
      });
      return bestIdx;
    };

    const onPointerDown = (e, id) => {
      if(e.button !== undefined && e.button !== 0) return;
      const el = itemEls.current[id];
      const rect = el ? el.getBoundingClientRect() : {top:0, height:60};
      const grabOffsetY = e.clientY - rect.top;
      const snaps = {};
      Object.entries(itemEls.current).forEach(([id2, el2]) => {
        if(el2) { const r = el2.getBoundingClientRect(); snaps[id2] = {top:r.top, height:r.height}; }
      });
      const fromIdx = orderRef.current.indexOf(id);
      const drag = {id, startY:e.clientY, currentY:e.clientY,
        height:rect.height, grabOffsetY, snaps, fromIdx};
      draggingRef.current = drag;
      overIdxRef.current  = fromIdx;
      setDragging(drag);
      setOverIdx(fromIdx);
      e.preventDefault();
    };

    // Attach move/up to window so coordinates are always raw viewport
    React.useEffect(() => {
      const onMove = (e) => {
        const drag = draggingRef.current;
        if(!drag) return;
        const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] && e.touches[0].clientY);
        if(clientY === undefined) return;
        const updated = {...drag, currentY: clientY};
        draggingRef.current = updated;
        setDragging(updated);
        const newOver = computeOverIdx(clientY, drag.snaps, drag.fromIdx);
        overIdxRef.current = newOver;
        setOverIdx(newOver);
      };
      const onUp = () => {
        const drag = draggingRef.current;
        const oi   = overIdxRef.current;
        if(!drag) return;
        if(oi !== null && oi !== drag.fromIdx) {
          setOrder(prev => {
            const next = [...prev];
            next.splice(drag.fromIdx, 1);
            next.splice(oi, 0, drag.id);
            return next;
          });
        }
        draggingRef.current = null;
        overIdxRef.current  = null;
        setDragging(null);
        setOverIdx(null);
      };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup',   onUp);
      return () => {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup',   onUp);
      };
    }, []);

    const dy = dragging ? dragging.currentY - dragging.startY : 0;
    const dragIdx = dragging ? order.indexOf(dragging.id) : -1;

    return h('div', {style:{position:"relative"}},
      order.map((id, idx) => {
        const item = items.find(i => i.id === id); if(!item) return null;
        const raw = t(item.en, item.ko);
        // Split on first colon: "Item N. Name: description" → name + desc
        const colonIdx = raw.indexOf(": ");
        const lbl = colonIdx>-1 ? raw.slice(0, colonIdx) : raw;
        const desc = colonIdx>-1 ? raw.slice(colonIdx+2).trim() : "";
        const isDragging = dragging && dragging.id === id;
        // placeholder gap: show above/below based on overIdx
        const showGapAbove = dragging && !isDragging && overIdx === idx && dragIdx > idx;
        const showGapBelow = dragging && !isDragging && overIdx === idx && dragIdx < idx;
        return h('div', {key:id, style:{marginBottom:6}},
          // gap placeholder above
          showGapAbove && h('div', {style:{height:dragging.height+6, background:navyL,
            border:"2px dashed "+navyBd, borderRadius:8, marginBottom:6,
            transition:"height 0.1s"}}),
          // the actual item
          h('div', {
            ref: el => { itemEls.current[id] = el; },
            onPointerDown: undefined,
            style:{
              display:"flex", alignItems:"flex-start", gap:10,
              padding:"12px 14px",
              background: isDragging ? navyL : white,
              border:"1px solid "+(isDragging ? navyBd : cardBd),
              borderRadius:8,
              boxShadow: isDragging
                ? "0 8px 24px rgba(27,43,94,0.22)"
                : "0 1px 3px rgba(0,0,0,0.05)",
              transform: isDragging ? "translate(0,"+dy+"px)" : "none",
              transition: isDragging ? "box-shadow 0.1s" : "transform 0.15s, box-shadow 0.15s",
              opacity: isDragging ? 0.95 : (dragging && !isDragging ? 0.6 : 1),
              cursor: "default",
              userSelect:"none",
              zIndex: isDragging ? 10 : 1,
              position: "relative",
              touchAction:"auto"
            }},
            h('div',{
              onPointerDown: e => onPointerDown(e, id),
              style:{display:"flex",flexDirection:"column",alignItems:"center",
              gap:4,flexShrink:0,paddingTop:4,padding:"4px 8px 4px 0",
              cursor:isDragging?"grabbing":"grab",touchAction:"none"}},
              h('div',{style:{color:muted,fontSize:18,userSelect:"none",
                lineHeight:1,letterSpacing:"-1px"}},"⠿"),
              h('span',{style:{fontSize:12,fontWeight:700,color:navyMid,
                background:navyL,borderRadius:5,padding:"2px 6px",
                whiteSpace:"nowrap"}},"#"+(idx+1))),
            h('div',{style:{flex:1,paddingTop:2}},
              h('p',{style:{fontSize:14,color:navy,fontWeight:700,
                lineHeight:1.4,margin:"0 0 "+(desc?"3px":"0")}},lbl),
              desc && h('p',{style:{fontSize:13,color:muted,margin:0,lineHeight:1.5}},desc)),
            h('div',{style:{display:"flex",flexDirection:"column",gap:3,flexShrink:0,paddingTop:8}},
              h('button',{onClick:()=>moveItem(order,setOrder,idx,-1),disabled:idx===0,
                style:{padding:"3px 9px",fontSize:13,border:"1px solid "+cardBd,
                  borderRadius:5,background:white,cursor:"pointer",
                  opacity:idx===0?0.25:1,lineHeight:1.2}},"▲"),
              h('button',{onClick:()=>moveItem(order,setOrder,idx,1),
                disabled:idx===order.length-1,
                style:{padding:"3px 9px",fontSize:13,border:"1px solid "+cardBd,
                  borderRadius:5,background:white,cursor:"pointer",
                  opacity:idx===order.length-1?0.25:1,lineHeight:1.2}},"▼"))
          ),
          // gap placeholder below
          showGapBelow && h('div', {style:{height:dragging.height+6, background:navyL,
            border:"2px dashed "+navyBd, borderRadius:8, marginTop:0,
            transition:"height 0.1s"}})
        );
      })
    );
  };

  const DomainRank = ({items, order, setOrder, label}) =>
    h('div',{style:{marginBottom:28}},
      h('div',{style:{background:navyL,border:"1px solid "+navyBd,
        borderRadius:"10px 10px 0 0",padding:"12px 20px"}},
        h('p',{style:{fontSize:14,fontWeight:700,color:navy,margin:0}},label)),
      h('div',{style:{border:"1px solid "+cardBd,borderTop:"none",

  return h('div',{style:{flex:1,minWidth:0}},

        t(rubric.label_en,rubric.label_ko)+" — "+t("Part B","파트 B")),
      h('p',{style:{fontSize:13,color:muted,margin:0}},
        t("Drag and drop items to reorder, or use ▲ ▼ arrows.",
          "항목을 드래그하거나 ▲ ▼ 화살표로 순서를 바꾸세요."))
    ),

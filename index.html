    if (this.state.error) {
      var e = this.state.error;
      return React.createElement('div', {
        style: {padding:'20px', margin:'20px', border:'2px solid #c00',
                borderRadius:'8px', fontFamily:'monospace', fontSize:'13px', color:'#c00',
                background:'#fff', whiteSpace:'pre-wrap', wordBreak:'break-all'}
      }, 'Render Error (screenshot this):\n' + e.message + '\n\n' + (e.stack || ''));
    }
    return this.props.children;
  }
}

function CountryDropdown({ value, onChange, lang }) {
  const [open, setOpen] = useState(false);
  const [search, setSearch] = useState("");
  const t = (en,ko) => T(en,ko,lang);
  const wrapperRef = React.useRef(null);

  React.useEffect(() => {
    const onClickOutside = (e) => {
      if (wrapperRef.current && !wrapperRef.current.contains(e.target)) {
        setOpen(false); setSearch("");
      }
    };
    document.addEventListener("mousedown", onClickOutside);
    return () => document.removeEventListener("mousedown", onClickOutside);
  }, []);

  const selectedCountry = value === "na"
    ? {code:"na", en:"Prefer not to answer", ko:"응답하고 싶지 않음"}
    : COUNTRY_LIST.find(c => c.code === value);
  const selectedLabel = selectedCountry ? t(selectedCountry.en, selectedCountry.ko) : t("Select a country...","국가를 선택하세요...");

  const q = search.toLowerCase().trim();
  const filtered = q
    ? COUNTRY_LIST.filter(c => c.en.toLowerCase().includes(q) || c.ko.includes(search.trim()) || c.code.toLowerCase().includes(q))
    : COUNTRY_LIST;
  const pinned = filtered.filter(c => c.pinned);
  const rest = filtered.filter(c => !c.pinned);

  return h('div',{ref:wrapperRef,style:{position:"relative"}},
    h('button',{type:"button",onClick:()=>setOpen(!open),
      style:{width:"100%",padding:"12px 14px",fontSize:14,
        border:"1px solid "+(open?navy:cardBd),borderRadius:8,background:white,
        color: value ? txt : muted, textAlign:"left", cursor:"pointer",
        fontFamily:ffs, display:"flex", justifyContent:"space-between", alignItems:"center"}},
      h('span',null,selectedLabel),
      h('span',{style:{color:muted,fontSize:11}},open?"▲":"▼")
    ),
    open && h('div',{style:{position:"absolute",top:"calc(100% + 4px)",left:0,right:0,
      background:white,border:"1px solid "+cardBd,borderRadius:8,
      boxShadow:"0 4px 16px rgba(27,43,94,0.12)",zIndex:50,maxHeight:300,overflow:"hidden",
      display:"flex",flexDirection:"column"}},
      h('div',{style:{padding:"8px 10px",borderBottom:"1px solid "+cardBd}},
        h('input',{type:"text",value:search,onChange:e=>setSearch(e.target.value),
          placeholder:t("Search countries...","국가 검색..."),autoFocus:true,
          style:{width:"100%",padding:"8px 10px",fontSize:13,border:"1px solid "+cardBd,
            borderRadius:6,fontFamily:ffs,outline:"none"}})
      ),
      h('div',{style:{overflowY:"auto",flex:1}},
        pinned.length > 0 && h('div',null,
          pinned.map(c =>
            h('button',{key:c.code,type:"button",
              onClick:()=>{onChange(c.code);setOpen(false);setSearch("");},
              style:{display:"block",width:"100%",padding:"10px 14px",fontSize:14,
                background:value===c.code?navyL:white, color:txt, border:"none",
                borderBottom:"1px solid "+cardBd, textAlign:"left",cursor:"pointer",
                fontFamily:ffs, fontWeight:value===c.code?600:400}},
              t(c.en, c.ko))
          ),
          rest.length > 0 && h('div',{style:{padding:"6px 14px",fontSize:11,
            color:muted,background:"#FAFBFC",
            textTransform:"uppercase",letterSpacing:"0.04em",fontWeight:600}},
            t("Other countries","기타 국가"))
        ),
        rest.map(c =>
          h('button',{key:c.code,type:"button",
            onClick:()=>{onChange(c.code);setOpen(false);setSearch("");},
            style:{display:"block",width:"100%",padding:"10px 14px",fontSize:14,
              background:value===c.code?navyL:white, color:txt, border:"none",
              borderBottom:"1px solid "+cardBd, textAlign:"left",cursor:"pointer",
              fontFamily:ffs, fontWeight:value===c.code?600:400}},
            t(c.en, c.ko))
        ),
        filtered.length === 0 && h('div',{style:{padding:"16px",textAlign:"center",
          fontSize:13,color:muted}},
          t("No countries match your search","검색과 일치하는 국가가 없습니다")),
        h('button',{type:"button",
          onClick:()=>{onChange("na");setOpen(false);setSearch("");},
          style:{display:"block",width:"100%",padding:"10px 14px",fontSize:14,
            background:value==="na"?navyL:white, color:txt, border:"none",
            borderTop:"1px solid "+cardBd, textAlign:"left",cursor:"pointer",
            fontFamily:ffs, fontWeight:value==="na"?600:400}},
          t("Prefer not to answer","응답하고 싶지 않음"))
      )
    )
  );
}

// ─── Demographics helper components (defined at module scope to preserve input focus on re-render) ───
// RadioGroup with optional inline text input under each option (e.g., "Other (please specify)")
// textInputs: { [optionValue]: { value, onChange, placeholder } }
const DemoRadioGroup = ({ name, value, onChange, options, textInputs, lang }) => {
  const t = (en,ko) => T(en,ko,lang);
  return h('div',{style:{display:"flex",flexDirection:"column",gap:8}},
    options.map(opt => {
      const selected = value===opt.value;
      const inputCfg = textInputs && textInputs[opt.value];
      return h('div',{key:opt.value,
        style:{border:"1px solid "+(selected?navy:cardBd),
          borderRadius:8,
          background:selected?navyL:white,
          transition:"border-color 0.15s, background 0.15s",
          overflow:"hidden"}},
        h('label',{style:{display:"flex",alignItems:"flex-start",gap:10,
          padding:"10px 14px",cursor:"pointer"}},
          h('input',{type:"radio",name,checked:selected,
            onChange:()=>onChange(opt.value),
            style:{marginTop:2,width:16,height:16,cursor:"pointer",accentColor:navy,flexShrink:0}}),
          h('span',{style:{fontSize:14.5,color:txt,lineHeight:1.5,
            fontWeight:selected?600:400}},
            t(opt.en, opt.ko))
        ),
        selected && inputCfg && h('div',{style:{padding:"0 14px 12px",
          marginLeft:30}},
          h('input',{type:"text",value:inputCfg.value,
            onChange:e=>inputCfg.onChange(e.target.value),
            placeholder:inputCfg.placeholder,
            style:{width:"100%",padding:"9px 12px",fontSize:14,
              border:"1px solid "+navyMid,
              background:white,
              borderRadius:6,fontFamily:ffs,outline:"none",
              boxShadow:"0 0 0 2px rgba(45,74,138,0.10)"}})
        )
      );
    })
  );
};

// Multi-select (checkbox) variant of DemoRadioGroup — value is an array of selected keys.
const DemoCheckboxGroup = ({ value, onChange, options, textInputs, lang }) => {
  const t = (en,ko) => T(en,ko,lang);
  const sel = value || [];
  const toggle = v => onChange(sel.includes(v) ? sel.filter(x=>x!==v) : [...sel, v]);
  return h('div',{style:{display:"flex",flexDirection:"column",gap:8}},
    options.map(opt => {
      const selected = sel.includes(opt.value);
      const inputCfg = textInputs && textInputs[opt.value];
      return h('div',{key:opt.value,
        style:{border:"1px solid "+(selected?navy:cardBd),borderRadius:8,
          background:selected?navyL:white,overflow:"hidden",
          transition:"border-color 0.15s, background 0.15s"}},
        h('label',{style:{display:"flex",alignItems:"flex-start",gap:10,
          padding:"10px 14px",cursor:"pointer"}},
          h('input',{type:"checkbox",checked:selected,onChange:()=>toggle(opt.value),
            style:{marginTop:2,width:16,height:16,cursor:"pointer",accentColor:navy,flexShrink:0}}),
          h('span',{style:{fontSize:14.5,color:txt,lineHeight:1.5,
            fontWeight:selected?600:400}},t(opt.en,opt.ko))),
        selected && inputCfg && h('div',{style:{padding:"0 14px 12px",marginLeft:30}},
          h('input',{type:"text",value:inputCfg.value,
            onChange:e=>inputCfg.onChange(e.target.value),
            placeholder:inputCfg.placeholder,
            style:{width:"100%",padding:"9px 12px",fontSize:14,
              border:"1px solid "+navyMid,background:white,borderRadius:6,
              fontFamily:ffs,outline:"none",boxShadow:"0 0 0 2px rgba(45,74,138,0.10)"}}))
      );
    })
  );
};

// ─── PART A SCREEN ───────────────────────────────────────────────────────────
// AI-generated points (sum to 100) are hidden from participants so their Part A/B
// judgments aren't anchored to the AI's weighting. Flip to true to show them again.
const SHOW_POINTS = false;

// Top-level (stable identity) so controlled inputs keep focus across parent
// re-renders — an inline component is a new type each render and remounts every row.
function PartAItemRow({ item, lang, ans, comment, isHighlighted,
                        onAnswer, onComment, setRef }) {
  const t = (en,ko) => T(en,ko,lang);
  const raw = t(item.en, item.ko);
  const colonIdx = raw.indexOf(": ");
  const lbl = colonIdx > -1 ? raw.slice(0, colonIdx) : raw;
  const bodyRaw = colonIdx > -1 ? raw.slice(colonIdx+2) : "";
  const ptsLabel = lang==="ko" ? " — " + item.pts + "점" : " — " + item.pts + " points";
  const body = bodyRaw + (SHOW_POINTS ? ptsLabel : "");
  const required = ans===false;
  const invalid = required && !(comment||"").trim();
  return h('div',{ref: setRef,
    style:{
    padding:"20px 22px",
    background: isHighlighted ? "#FFF3CD" : ans===true ? greenBg : ans===false ? redBg : white,
    border:"1px solid "+(isHighlighted?"#F59E0B":ans===true?greenBd:ans===false?redBd:cardBd),
    borderRadius:12,
    boxShadow:"0 1px 4px rgba(27,43,94,0.06)",
    marginBottom:12,
    transition:"background 0.3s, border-color 0.3s"}},
    isHighlighted && h('p',{style:{fontSize:12,fontWeight:700,color:"#92400e",
      margin:"0 0 8px",display:"flex",alignItems:"center",gap:6}},
      "⚠ "+(ans===false
        ? t("Please explain why you disagree before continuing.","계속하기 전에 동의하지 않는 이유를 설명해 주세요.")
        : t("Please answer this item before continuing.","계속하기 전에 이 항목에 답해 주세요."))),
    h('p',{style:{fontSize:15.5,fontWeight:700,color:navy,lineHeight:1.45,margin:"0 0 6px"}},lbl),
    body && h('p',{style:{fontSize:14,color:txt,lineHeight:1.65,margin:"0 0 14px"}},body),
    h('div',{style:{
      background: ans===true?"#dcfce7" : ans===false?"#fee2e2" : "#F0F4FA",
      border:"1px solid "+(ans===true?greenBd:ans===false?redBd:cardBd),
      borderRadius:8,padding:"10px 14px",marginBottom:14}},
      h('p',{style:{fontSize:12,fontWeight:700,
        color:ans===true?green:ans===false?red:muted,
        textTransform:"uppercase",letterSpacing:"0.05em",margin:"0 0 4px"}},
        t("Explanation","설명")),
      h('p',{style:{fontSize:13.5,color:ans===true?"#14532d":ans===false?"#4c0519":"#374151",
        lineHeight:1.65,margin:0}},t(item.xEn,item.xKo))),
    h('div',{style:{display:"flex",gap:10,marginBottom:ans!==undefined?12:0}},
      h('button',{onClick:()=>onAnswer(true),
        style:{flex:1,padding:"12px 0",borderRadius:9,fontSize:15,fontWeight:600,
          border:"2px solid "+(ans===true?green:cardBd),
          background:ans===true?greenBg:white,color:ans===true?green:muted,
          cursor:"pointer",transition:"all 0.15s"}},
        "✓ "+t("Agree","동의")),
      h('button',{onClick:()=>onAnswer(false),
        style:{flex:1,padding:"12px 0",borderRadius:9,fontSize:15,fontWeight:600,
          border:"2px solid "+(ans===false?red:cardBd),
          background:ans===false?redBg:white,color:ans===false?red:muted,
          cursor:"pointer",transition:"all 0.15s"}},
        "✗ "+t("Disagree","비동의"))),
    ans!==undefined && h('textarea',{
      placeholder: required
        ? t("Add your comment (required)","의견 작성 (필수)")
        : t("Add your comment","의견 작성"),
      value:comment||"",
      onChange:e=>onComment(e.target.value),
      style:{width:"100%",padding:"9px 12px",fontSize:14,
        border:"1px solid "+(invalid?red:cardBd),borderRadius:8,resize:"vertical",
        fontFamily:ffs,boxSizing:"border-box",minHeight:60,
        background:invalid?"#fff":"rgba(255,255,255,0.8)"}})
  );
}

function PartAScreen({ caseData, rubric, onNext, onBack, draftAnswers, onDraftChange }) {
  const lang = useLang();
  const t = (en,ko) => T(en,ko,lang);
  const [partA, setPartA] = useState(()=>draftAnswers.answers||{});
  const [comments, setComments] = useState(()=>draftAnswers.comments||{});

  const allItems = [...rubric.d1, ...rubric.d2];
  const totalItems = allItems.length;
  const answeredItems = Object.keys(partA).length;
  const allAnswered = answeredItems === totalItems;
  const itemRefs = React.useRef({});
  const [highlightId, setHighlightId] = useState(null);

  // A Disagree with no explanation is an incomplete answer, same as an unanswered item.
  const needsComment = it => partA[it.id]===false && !(comments[it.id]||"").trim();
  const isProblem = it => partA[it.id]===undefined || needsComment(it);
  const canContinue = allAnswered && !allItems.some(needsComment);

  // Save full draft (answers + comments) to parent on every change
  React.useEffect(() => {
    onDraftChange({answers: partA, comments});
  }, [partA, comments]);

  const goToFirst = () => {
    const firstMissing = allItems.find(isProblem);
    if (!firstMissing) return;
    setHighlightId(firstMissing.id);
    const el = itemRefs.current[firstMissing.id];
    if (el) { el.scrollIntoView({behavior:"smooth", block:"center"}); }
    setTimeout(() => setHighlightId(null), 5000);
  };

  const Domain = ({items, label, desc, pts}) =>
    h('div',{style:{marginBottom:24}},
      h('div',{style:{background:navy,borderRadius:10,padding:"13px 20px",marginBottom:14,
        display:"flex",justifyContent:"space-between",alignItems:"center"}},
        h('div',{style:{flex:1}},
          h('p',{style:{fontSize:15,fontWeight:700,color:white,margin:0}},label),
          desc && h('p',{style:{fontSize:13,color:"rgba(255,255,255,0.7)",margin:"2px 0 0",lineHeight:1.5}},desc)),
        SHOW_POINTS && h('span',{style:{fontSize:13,fontWeight:700,color:"rgba(255,255,255,0.85)",flexShrink:0,marginLeft:12}},
          pts+t(" pts"," 점"))),
      items.map((item)=>h(PartAItemRow,{key:item.id,item,lang,
        ans:partA[item.id], comment:comments[item.id]||"",
        isHighlighted:highlightId===item.id,
        onAnswer:(v)=>setPartA(p=>({...p,[item.id]:v})),
        onComment:(v)=>setComments(c=>({...c,[item.id]:v})),
        setRef:(el)=>{itemRefs.current[item.id]=el;}}))
    );

  const d1label = t("Domain 1: General Clinical History-Taking","영역 1: 일반 임상 병력청취");
  const d2label = t("Domain 2: Case-Specific Diagnostic History","영역 2: 증례 특이적 진단 병력");

  return h('div',{style:{flex:1,minWidth:0}},
    h(Card,{style:{padding:"16px 22px",marginBottom:20,background:navyL,border:"1px solid "+navyBd,boxShadow:"none"}},
      h('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12}},
        h('div',null,
          h('p',{style:{fontSize:16,fontWeight:700,color:navy,margin:"0 0 10px"}},
            t(rubric.label_en,rubric.label_ko)+" — "+t("Part A","파트 A")),
          lang==="en"
            ? h('div',{style:{fontSize:13.5,color:muted,lineHeight:1.6}},
                h('p',{style:{margin:"0 0 7px",fontWeight:700,color:navy,fontSize:14.5}},"Should this item be included in the rubric?"),
                h('p',{style:{margin:"0 0 6px"}},"Choose ",h('b',{style:{color:navy}},"Agree")," to include it, or ",h('b',{style:{color:navy}},"Disagree")," if it should be removed, needs changes, or you are unsure."),
                h('p',{style:{margin:0}},"A comment is required when you disagree. You may write comments in ",h('b',{style:{color:navy}},"your preferred language"),"."))
            : h('p',{style:{fontSize:13.5,color:muted,margin:0,lineHeight:1.6}},
                T("Should this item be included in the rubric? Choose Agree or Disagree; a comment is required when you disagree. You may write comments in your preferred language.",
                  "이 항목을 루브릭에 포함해야 합니까? 동의 또는 비동의를 선택하세요. 동의하지 않는 경우 의견 작성이 필수입니다. 의견은 편하신 언어로 작성하셔도 됩니다.", lang))),
        SHOW_POINTS && h('div',{style:{textAlign:"right",flexShrink:0}},
          h('p',{style:{fontSize:11,color:muted,margin:"0 0 2px"}},t("Total","합계")),
          h('p',{style:{fontSize:18,fontWeight:700,color:navyMid,margin:0}},
            (rubric.d1pts+rubric.d2pts)+t(" pts"," 점")))),
      (rubric.threshold_en||rubric.rationale_en) &&
        h('div',{style:{background:amberBg,border:"1px solid "+amberBd,
          borderRadius:8,padding:"10px 14px",marginTop:14,
          display:"flex",gap:10,alignItems:"flex-start"}},
          h('span',{style:{fontSize:15,flexShrink:0}},"ℹ️"),
          h('p',{style:{fontSize:13,color:"#78350f",lineHeight:1.65,margin:0}},
            t(rubric.threshold_en||rubric.rationale_en,
              rubric.threshold_ko||rubric.rationale_ko)))
    ),
    // Call Domain as a plain function, NOT h(Domain,…): an inline component is a new
    // type each render, so h() would remount the whole subtree (incl. the comment
    // textarea) every keystroke → focus lost after one letter. Direct-call inlines it.
    Domain({items:rubric.d1,label:d1label,desc:t(rubric.d1desc_en||'',rubric.d1desc_ko||''),pts:rubric.d1pts}),
    Domain({items:rubric.d2,label:d2label,desc:t(rubric.d2desc_en||'',rubric.d2desc_ko||''),pts:rubric.d2pts}),
    h('div',{style:{display:"flex",gap:12,alignItems:"center"}},
      onBack && h('button',{onClick:onBack,
        style:{padding:"14px 20px",borderRadius:10,border:"2px solid "+navy,
          background:white,color:navy,fontSize:15,fontWeight:600,
          cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}},
        "← "+t("Back","뒤로")),
      h(PrimaryBtn,{
        onClick:()=>{ if(canContinue){ onNext({partA,comments}); } else { goToFirst(); } }},
        t("Continue to Part B →","파트 B로 계속 →"))
    )
  );
}

// ─── PART B SCREEN ───────────────────────────────────────────────────────────
// "Item N." / "항목 N." is a Part A affordance so participants can cite items in comments.
// In Part B it collides with the rank badge, so it is stripped there only.
const stripItemNo = s => s.replace(/^\s*(?:Item|항목)\s*\d+\.\s*/, "");

function PartBScreen({ caseData, rubric, ci, ri, isLast, onSubmit, partAData, onBack, bDraft, onBDraftChange }) {
  const lang = useLang();
  const t = (en,ko) => T(en,ko,lang);
  const [d1Order, setD1Order_] = useState(()=>(bDraft && bDraft.d1Order)||[...rubric.d1].sort((a,b)=>b.pts-a.pts).map(i=>i.id));
  const [d2Order, setD2Order_] = useState(()=>(bDraft && bDraft.d2Order)||[...rubric.d2].sort((a,b)=>b.pts-a.pts).map(i=>i.id));
  const [finalCmt, setFinalCmt_] = useState((bDraft && bDraft.finalCmt)||"");
  const [expanded, setExpanded] = useState({});
  const toggleExpanded = React.useCallback(id=>setExpanded(e=>({...e,[id]:!e[id]})),[]);
  // Reorder count + dwell time: separates "weighed it and concurred with the AI order"
  // from "never touched it". Without this the two are identical in the data.
  const moves = React.useRef({d1:0,d2:0});
  const startedAt = React.useRef(Date.now());
  // Wrapped setters that also persist draft immediately (no useEffect = no re-render cascade)
  const d1OrderRef  = React.useRef(d1Order);
  const bCommentTimer = React.useRef(null);
  const d2OrderRef  = React.useRef(d2Order);
  const finalCmtRef = React.useRef(finalCmt);
  const changed = (a,b) => a.length!==b.length || a.some((id,i)=>id!==b[i]);
  const setD1Order = React.useCallback((valOrFn)=>{
    setD1Order_(prev=>{ const next=typeof valOrFn==='function'?valOrFn(prev):valOrFn; if(changed(next,prev)) moves.current.d1++; d1OrderRef.current=next; onBDraftChange(next,d2OrderRef.current,finalCmtRef.current); return next; });
  },[onBDraftChange]);
  const setD2Order = React.useCallback((valOrFn)=>{
    setD2Order_(prev=>{ const next=typeof valOrFn==='function'?valOrFn(prev):valOrFn; if(changed(next,prev)) moves.current.d2++; d2OrderRef.current=next; onBDraftChange(d1OrderRef.current,next,finalCmtRef.current); return next; });
  },[onBDraftChange]);
  const setFinalCmt = React.useCallback((val)=>{
    setFinalCmt_(val); finalCmtRef.current=val; onBDraftChange(d1OrderRef.current,d2OrderRef.current,val);
  },[onBDraftChange]);
  const moveItem = (order, setOrder, idx, dir) => {
    const next=[...order]; const to=idx+dir;
    if(to<0||to>=next.length) return;
    [next[idx],next[to]]=[next[to],next[idx]];
    setOrder(next);
  };

  // Next button label — no "submit", just navigation
  const nextLabel = () => {
    if(isLast) return t("Finish Survey →","설문 완료 →");
    const nr=ri+1;
    const nrInCase = nr < caseData.rubrics.length;
    if(nrInCase) return t("Next Rubric →","다음 루브릭 →");
    return t("Next Case →","다음 증례 →");
  };

  const SortableList = ({items, order, setOrder, expanded, toggleExpanded}) => {
    const [dragging, setDragging] = React.useState(null);
    const [overIdx, setOverIdx]   = React.useState(null);
    const itemEls = React.useRef({});
    // Keep latest dragging/overIdx in refs so window handlers can read current values
    const draggingRef = React.useRef(null);
    const overIdxRef  = React.useRef(null);
    const orderRef    = React.useRef(order);
    React.useEffect(() => { orderRef.current = order; }, [order]);

    const computeOverIdx = (clientY, snaps, fromIdx) => {
      let bestIdx = fromIdx, bestDist = Infinity;
      orderRef.current.forEach((id2, i) => {
        const snap = snaps[id2];
        if(!snap) return;
        const mid = snap.top + snap.height / 2;
        const dist = Math.abs(clientY - mid);
        if(dist < bestDist) { bestDist = dist; bestIdx = i; }
      });
      return bestIdx;
    };

    const onPointerDown = (e, id) => {
      if(e.button !== undefined && e.button !== 0) return;
      const el = itemEls.current[id];
      const rect = el ? el.getBoundingClientRect() : {top:0, height:60};
      const grabOffsetY = e.clientY - rect.top;
      const snaps = {};
      Object.entries(itemEls.current).forEach(([id2, el2]) => {
        if(el2) { const r = el2.getBoundingClientRect(); snaps[id2] = {top:r.top, height:r.height}; }
      });
      const fromIdx = orderRef.current.indexOf(id);
      const drag = {id, startY:e.clientY, currentY:e.clientY,
        height:rect.height, grabOffsetY, snaps, fromIdx};
      draggingRef.current = drag;
      overIdxRef.current  = fromIdx;
      setDragging(drag);
      setOverIdx(fromIdx);
      e.preventDefault();
    };

    // Attach move/up to window so coordinates are always raw viewport
    React.useEffect(() => {
      const onMove = (e) => {
        const drag = draggingRef.current;
        if(!drag) return;
        const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] && e.touches[0].clientY);
        if(clientY === undefined) return;
        const updated = {...drag, currentY: clientY};
        draggingRef.current = updated;
        setDragging(updated);
        const newOver = computeOverIdx(clientY, drag.snaps, drag.fromIdx);
        overIdxRef.current = newOver;
        setOverIdx(newOver);
      };
      const onUp = () => {
        const drag = draggingRef.current;
        const oi   = overIdxRef.current;
        if(!drag) return;
        if(oi !== null && oi !== drag.fromIdx) {
          setOrder(prev => {
            const next = [...prev];
            next.splice(drag.fromIdx, 1);
            next.splice(oi, 0, drag.id);
            return next;
          });
        }
        draggingRef.current = null;
        overIdxRef.current  = null;
        setDragging(null);
        setOverIdx(null);
      };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup',   onUp);
      return () => {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup',   onUp);
      };
    }, []);

    const dy = dragging ? dragging.currentY - dragging.startY : 0;
    const dragIdx = dragging ? order.indexOf(dragging.id) : -1;

    return h('div', {style:{position:"relative"}},
      order.map((id, idx) => {
        const item = items.find(i => i.id === id); if(!item) return null;
        const raw = t(item.en, item.ko);
        // Split on first colon: "Item N. Name: description" → name + desc
        const colonIdx = raw.indexOf(": ");
        const lbl = colonIdx>-1 ? raw.slice(0, colonIdx) : raw;
        const desc = colonIdx>-1 ? raw.slice(colonIdx+2).trim() : "";
        const isExp = !!expanded[id];
        const isDragging = dragging && dragging.id === id;
        // placeholder gap: show above/below based on overIdx
        const showGapAbove = dragging && !isDragging && overIdx === idx && dragIdx > idx;
        const showGapBelow = dragging && !isDragging && overIdx === idx && dragIdx < idx;
        return h('div', {key:id, style:{marginBottom:12}},
          // gap placeholder above
          showGapAbove && h('div', {style:{height:dragging.height+6, background:navyL,
            border:"2px dashed "+navyBd, borderRadius:12, marginBottom:12,
            transition:"height 0.1s"}}),
          // the actual item
          h('div', {
            ref: el => { itemEls.current[id] = el; },
            onPointerDown: undefined,
            style:{
              display:"flex", alignItems:"center", gap:10,
              padding:"16px 18px",
              background: isDragging ? navyL : white,
              border:"1px solid "+(isDragging ? navyBd : cardBd),
              borderRadius:12,
              boxShadow: isDragging
                ? "0 8px 24px rgba(27,43,94,0.22)"
                : "0 1px 4px rgba(27,43,94,0.06)",
              transform: isDragging ? "translate(0,"+dy+"px)" : "none",
              transition: isDragging ? "box-shadow 0.1s" : "transform 0.15s, box-shadow 0.15s",
              opacity: isDragging ? 0.95 : (dragging && !isDragging ? 0.6 : 1),
              cursor: "default",
              userSelect:"none",
              zIndex: isDragging ? 10 : 1,
              position: "relative",
              touchAction:"auto"
            }},
            h('div',{
              onPointerDown: e => onPointerDown(e, id),
              style:{display:"flex",flexDirection:"column",alignItems:"center",
              gap:4,flexShrink:0,padding:"0 8px 0 0",
              cursor:isDragging?"grabbing":"grab",touchAction:"none"}},
              h('div',{style:{color:muted,fontSize:18,userSelect:"none",
                lineHeight:1,letterSpacing:"-1px"}},"⠿"),
              h('span',{style:{fontSize:12,fontWeight:700,color:navyMid,
                background:navyL,borderRadius:5,padding:"2px 6px",
                whiteSpace:"nowrap"}},"#"+(idx+1))),
            h('div',{style:{flex:1}},
              h('p',{style:{fontSize:15.5,color:navy,fontWeight:700,
                lineHeight:1.45,margin:0}},stripItemNo(lbl)),
              desc && h('button',{onClick:()=>toggleExpanded(id),
                style:{marginTop:6,padding:0,border:"none",background:"none",
                  color:muted,fontSize:11,fontWeight:400,cursor:"pointer",
                  textAlign:"left",letterSpacing:"0.02em",touchAction:"manipulation"}},
                (isExp?"▾ ":"▸ ")+(isExp?t("Hide description","설명 숨기기")
                                        :t("Show description","설명 보기"))),
              desc && isExp && h('p',{style:{fontSize:14,color:muted,
                margin:"8px 0 0",lineHeight:1.6}},desc)),
            h('div',{style:{display:"flex",flexDirection:"column",gap:3,flexShrink:0}},
              h('button',{onClick:()=>moveItem(order,setOrder,idx,-1),disabled:idx===0,
                style:{padding:"3px 9px",fontSize:13,border:"1px solid "+cardBd,
                  borderRadius:5,background:white,cursor:"pointer",
                  opacity:idx===0?0.25:1,lineHeight:1.2}},"▲"),
              h('button',{onClick:()=>moveItem(order,setOrder,idx,1),
                disabled:idx===order.length-1,
                style:{padding:"3px 9px",fontSize:13,border:"1px solid "+cardBd,
                  borderRadius:5,background:white,cursor:"pointer",
                  opacity:idx===order.length-1?0.25:1,lineHeight:1.2}},"▼"))
          ),
          // gap placeholder below
          showGapBelow && h('div', {style:{height:dragging.height+6, background:navyL,
            border:"2px dashed "+navyBd, borderRadius:8, marginTop:0,
            transition:"height 0.1s"}})
        );
      })
    );
  };

  const DomainRank = ({items, order, setOrder, label}) =>
    h('div',{style:{marginBottom:28}},
      h('div',{style:{background:navy,borderRadius:10,padding:"13px 20px",marginBottom:14}},
        h('p',{style:{fontSize:15,fontWeight:700,color:white,margin:0}},label)),
      h(SortableList,{items,order,setOrder,expanded,toggleExpanded})
    );

  return h('div',{style:{flex:1,minWidth:0}},
    h(Card,{style:{padding:"16px 22px",marginBottom:20,background:navyL,border:"1px solid "+navyBd,boxShadow:"none"}},
      h('p',{style:{fontSize:16,fontWeight:700,color:navy,margin:"0 0 8px"}},
        t(rubric.label_en,rubric.label_ko)+" — "+t("Part B","파트 B")),
      h('p',{style:{fontSize:13.5,color:muted,margin:0,lineHeight:1.6}},
        t("Rank all items by clinical importance, including any you would remove. Drag and drop, or use the ▲ ▼ arrows to reorder.",
          "제외하려는 항목을 포함하여 모든 항목을 임상적 중요도 순으로 순위를 매겨 주세요. 드래그 앤 드롭하거나 ▲ ▼ 화살표를 사용하여 순서를 변경하세요."))
    ),
    h(DomainRank,{items:rubric.d1,order:d1Order,setOrder:setD1Order,
      label:t("Domain 1: General Clinical History-Taking","영역 1: 일반 임상 병력청취")}),
    h(DomainRank,{items:rubric.d2,order:d2Order,setOrder:setD2Order,
      label:t("Domain 2: Case-Specific Diagnostic History","영역 2: 증례 특이적 진단 병력")}),
    h(Card,{style:{padding:"20px 22px",marginBottom:20}},
      h('p',{style:{fontSize:14,fontWeight:700,color:navy,margin:"0 0 10px"}},
        t("Overall Comment (optional)","전체 의견 (선택사항)")),
      h('textarea',{
        placeholder:t("Any comments or suggestions for this rubric?","이 루브릭에 대한 의견이나 제안이 있으신가요?"),
        defaultValue:finalCmt,key:"finalcmt",onInput:e=>{const v=e.target.value; finalCmtRef.current=v; if(bCommentTimer.current) clearTimeout(bCommentTimer.current); bCommentTimer.current=setTimeout(()=>{setFinalCmt_(v); onBDraftChange(d1OrderRef.current,d2OrderRef.current,v);},600);},
        style:{width:"100%",padding:"12px 14px",fontSize:14,
          border:"1px solid "+cardBd,borderRadius:8,resize:"vertical",
          fontFamily:ffs,boxSizing:"border-box",minHeight:80}})
    ),
    h('div',{style:{display:"flex",gap:12,alignItems:"center"}},
      h('button',{onClick:onBack,
        style:{padding:"14px 20px",borderRadius:10,border:"2px solid "+navy,
          background:white,color:navy,fontSize:15,fontWeight:600,
          cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}},
        "← "+t("Back","뒤로")),
      h(PrimaryBtn,{
        onClick:()=>{ onSubmit(rubric.id,{...partAData,d1Order,d2Order,finalCmt,
          d1Moves:moves.current.d1, d2Moves:moves.current.d2,
          bTimeMs:Date.now()-startedAt.current}); scrollTop(); }},
        nextLabel())
    )
  );
}

// ─── DONE SCREEN (two states: pre-submit and post-submit) ─────────────────────
function DoneScreen({ responses, demographics, pid, preSubmitState, onBack }) {
  const lang = useLang();
  const t = (en,ko) => T(en,ko,lang);
  // preSubmitState: if true, show pre-submit UI (used by preview)
  const [status, setStatus] = useState(preSubmitState ? "idle" : "idle");
  const blob = new Blob([JSON.stringify(responses,null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);

  const submit = async () => {
    setStatus("sending");
    try {
      const rows=[];
      // Build a demographics payload that gets attached to every row
      const dem = demographics || {};
      const demPayload = {
        dem_exp: dem.exp || null,
        dem_active_5yr: dem.active_5yr || null,
        dem_country_practice: dem.country_practice || null,
        dem_country_training: dem.country_training || null,
        dem_setting: dem.setting || null,
        dem_setting_other: (dem.setting === "other" ? (dem.setting_other||"").trim() : null) || null,
        dem_setting_also: (dem.setting_also && dem.setting_also.length ? dem.setting_also.join(",") : null),
        dem_setting_also_other: (dem.setting_also && dem.setting_also.includes("other") ? (dem.setting_also_other||"").trim() : null) || null,
        dem_specialty: dem.specialty || null,
        dem_specialty_sub: (dem.specialty === "subspecialty" ? (dem.specialty_sub||"").trim() : null) || null,
        dem_specialty_other: (dem.specialty === "other" ? (dem.specialty_other||"").trim() : null) || null,
        dem_ai_use: dem.ai_use || null,
      };
      for(const [rubricId,rd] of Object.entries(responses)){
        const parts=rubricId.split("-");
        const caseNo=parseInt(parts[0]), rubricNo=parseInt(parts[1]);
        const rubricLabel="C"+caseNo+"-R"+rubricNo; // e.g. "C1-R2" — unambiguous
        const base={participant_id:pid,lang,case_no:caseNo,rubric_no:rubricNo,
          rubric_id:rubricLabel,overall_comment:rd.finalCmt||"",
          b_moves_d1: rd.d1Moves ?? null, b_moves_d2: rd.d2Moves ?? null,
          b_time_ms: rd.bTimeMs ?? null, ...demPayload};
        // Agreement rows — one per item
        for(const [itemId,agreed] of Object.entries(rd.partA||{})){
          rows.push({...base,item_id:itemId,agreed,
            comment:(rd.comments||{})[itemId]||"",
            domain:null,rank:null});
        }
        // Ranking rows — one per item per domain
        (rd.d1Order||[]).forEach((itemId,i)=>{
          rows.push({...base,item_id:itemId,agreed:null,comment:"",
            domain:"d1",rank:i+1});
        });
        (rd.d2Order||[]).forEach((itemId,i)=>{
          rows.push({...base,item_id:itemId,agreed:null,comment:"",
            domain:"d2",rank:i+1});
        });
      }
      if(rows.length===0) return;
      const res=await fetch(SUPABASE_URL+"/rest/v1/responses",{
        method:"POST",
        headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+SUPABASE_KEY,"Prefer":"return=minimal"},
        body:JSON.stringify(rows)
      });
      if(res.ok) { setStatus("success"); try{localStorage.removeItem(LS_KEY);}catch(e){} }
      else { console.error(await res.text()); setStatus("error"); }
    } catch(e){ console.error(e); setStatus("error"); }
  };

  // ── POST-SUBMIT (success) ───────────────────────────────────────────────────
  if(status==="success") return h(PageWrap,null,
    h('div',{style:{textAlign:"center",padding:"64px 0 48px"}},
      h('div',{style:{width:80,height:80,borderRadius:"50%",
        background:"linear-gradient(135deg,"+green+",#059669)",
        margin:"0 auto 28px",display:"flex",alignItems:"center",justifyContent:"center"}},
        h('svg',{width:38,height:38,viewBox:"0 0 24 24",fill:"none",
          stroke:white,strokeWidth:2.5,strokeLinecap:"round",strokeLinejoin:"round"},
          h('path',{d:"M20 6L9 17l-5-5"}))),
      h('h1',{style:{fontSize:26,fontWeight:700,color:navy,margin:"0 0 14px",fontFamily:ffs}},
        t("Your responses have been recorded.","귀하의 응답이 기록되었습니다.")),
      h('p',{style:{fontSize:15,color:muted,lineHeight:1.75,maxWidth:480,margin:"0 auto 32px"}},
        t("Thank you for completing this survey. Your clinical expertise and time are genuinely appreciated — responses like yours are what make this research meaningful.",
          "설문을 완료해 주셔서 감사합니다. 귀하의 임상 전문성과 시간에 진심으로 감사드립니다 — 귀하와 같은 응답이 본 연구를 의미 있게 만듭니다.")),
      h('p',{style:{fontSize:14,color:muted}},
        t("Participant ID: ","참여자 ID: "),
        h('strong',{style:{color:navy,marginLeft:4}},pid)),
      h('div',{style:{marginTop:24}},
        h('a',{href:url,download:"rubric_responses_"+pid+".json",
          style:{color:navyMid,fontSize:14,fontWeight:600,textDecoration:"underline"}},
          t("Download a copy of your responses","응답 사본 다운로드")))
    )
  );

  // ── PRE-SUBMIT (idle / sending / error) ─────────────────────────────────────
  return h(PageWrap,null,
    h('div',{style:{textAlign:"center",padding:"48px 0 36px"}},
      h('h1',{style:{fontSize:26,fontWeight:700,color:navy,margin:"0 0 12px",fontFamily:ffs}},
        t("You've reached the end of the survey.","설문의 마지막에 도달하셨습니다.")),
      h('p',{style:{fontSize:15,color:muted,lineHeight:1.75,maxWidth:500,margin:"0 auto"}},
        t("Please click the button below to submit your responses. If you do not submit, your responses will not be recorded.",
          "아래 버튼을 클릭하여 응답을 제출해 주세요. 제출하지 않으면 응답이 기록되지 않습니다."))
    ),
    h(Card,{style:{padding:"32px 36px"}},
      h('p',{style:{fontSize:14,color:muted,textAlign:"center",margin:"0 0 24px"}},
        t("Participant ID: ","참여자 ID: "),
        h('strong',{style:{color:navy,fontSize:15,marginLeft:4}},pid)),
      status==="idle" && h('div',null,
        h(PrimaryBtn,{onClick:submit},t("Submit Responses →","응답 제출 →")),
        h('div',{style:{textAlign:"center",marginTop:14}},
          h('button',{onClick:onBack,
            style:{background:"none",border:"none",color:muted,fontSize:14,
              cursor:"pointer",textDecoration:"underline",fontFamily:ffs}},
            "← "+t("Back to last rubric","마지막 루브릭으로 돌아가기")))
      ),
      status==="sending" && h('div',{style:{textAlign:"center",padding:"16px",
        background:navyL,borderRadius:10,color:navy,fontSize:15,fontWeight:600}},
        t("Sending…","전송 중…")),
      status==="error" && h('div',null,
        h('div',{style:{padding:"14px",marginBottom:14,background:redBg,
          border:"1px solid "+redBd,borderRadius:10,color:red,fontSize:14,textAlign:"center"}},
          t("Something went wrong with your submission. Please try again. If it still fails, download a copy of your responses and email the file to the study coordinator, Dr. Ha Huynh (ha@haheho.co.kr). If you cannot download it or run into any other issue, please email the same address for support.",
            "제출 중 문제가 발생했습니다. 다시 시도해 주세요. 계속 실패할 경우, 응답 사본을 다운로드하여 연구 코디네이터 Ha Huynh 박사(ha@haheho.co.kr)에게 파일을 이메일로 보내 주세요. 다운로드가 불가능하거나 다른 문제가 발생하면 같은 주소로 이메일을 보내 지원을 요청해 주세요.")),
        h(PrimaryBtn,{onClick:submit},t("Try again →","다시 시도 →"))),
      h('div',{style:{borderTop:"1px solid "+cardBd,paddingTop:20,marginTop:24,
        textAlign:"center"}},
        h('a',{href:url,download:"rubric_responses_"+pid+".json",
          style:{color:muted,fontSize:13,textDecoration:"underline"}},
          "📥 "+t("Download a copy of your responses","응답 사본 다운로드")))
    )
  );
}

// ─── PARTICIPANT ID (pid) ─────────────────────────────────────────────────────
// Invited participants open a personal link  …/?pid=K-XXXXXX  (K = SMC/Korea,
// V = VinUni). A checksum makes a garbled/typo'd link fail validation. If a visit
// has no valid pid (bare URL, stripped query string, a second device), we mint an
// anonymous  P-XXXXXX  at load so the data is still recorded — just not linked to
// an invited email.  TEST-XXXXXX = our own test runs, excluded from analysis by
// the prefix (we deliberately do NOT write an is_test column — the prod table
// doesn't have one). The pid→email map is held OFFLINE by the team, never here.
const PID_ALPHABET = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";   // Crockford base32 (no I/L/O/U)
const PID_PREFIXES = ["K", "V", "P", "TEST"];
const PID_KEY = "rubric_survey_pid";

function pidCheckChar(letters) {         // position-weighted sum → one checksum char
  let sum = 0;
  for (let i = 0; i < letters.length; i++) {
    const v = PID_ALPHABET.indexOf(letters[i]);
    if (v < 0) return null;              // char outside the alphabet → invalid
    sum += (v + 1) * (i + 1);
  }
  return PID_ALPHABET[sum % 32];
}
function pidValid(code) {
  if (typeof code !== "string") return false;
  const m = code.toUpperCase().match(/^([A-Z]+)-([0-9A-Z]{6})$/);
  if (!m) return false;
  if (!PID_PREFIXES.includes(m[1])) return false;
  return pidCheckChar(m[1] + m[2].slice(0, 5)) === m[2].slice(5);
}
function pidMint(prefix) {
  let body = "";
  for (let i = 0; i < 5; i++) {
    const r = (typeof crypto !== "undefined" && crypto.getRandomValues)
      ? crypto.getRandomValues(new Uint32Array(1))[0] % 32
      : Math.floor(Math.random() * 32);
    body += PID_ALPHABET[r];
  }
  return prefix + "-" + body + pidCheckChar(prefix + body);
}
function resolvePid() {
  try {                                  // 1. a valid ?pid= in the URL always wins
    const u = new URLSearchParams(window.location.search).get("pid");
    if (u) {
      const c = u.trim().toUpperCase();
      if (pidValid(c)) { try { localStorage.setItem(PID_KEY, c); } catch(e){} return c; }
    }
  } catch(e) {}
  try {                                  // 2. a pid remembered on this device
    const s = localStorage.getItem(PID_KEY);
    if (s && pidValid(s)) return s;
  } catch(e) {}
  const p = pidMint("P");                // 3. no link → anonymous walk-in code
  try { localStorage.setItem(PID_KEY, p); } catch(e) {}
  return p;
}

// ─── MAIN APP ────────────────────────────────────────────────────────────────
const LS_KEY = "rubric_survey_session_v2";  // bump on rubric-structure changes to invalidate stale saved sessions

function App() {
  // ── Restore from localStorage if available ──────────────────────────────
  const saved = (() => { try { const s=localStorage.getItem(LS_KEY); return s?JSON.parse(s):null; } catch(e){return null;} })();

  // Participant id: from ?pid= (invited link) → remembered pid → minted P- (walk-in)
  const [pid] = useState(resolvePid);
  const isTest = pid.indexOf("TEST-") === 0;

  const [lang, setLang] = useState((saved && saved.lang) || "en");
  const [step, setStep] = useState((saved && saved.step) || "consent");
  const [ci, setCi] = useState((saved && saved.ci) || 0);
  const [ri, setRi] = useState((saved && saved.ri) || 0);
  const [partAData, setPartAData] = useState((saved && saved.partAData) || null);
  const [partADraft, setPartADraft] = useState((saved && saved.partADraft) || {});
  const [partBDraft, setPartBDraft] = useState((saved && saved.partBDraft) || {});
  const [responses, setResponses] = useState((saved && saved.responses) || {});
  const [demographics, setDemographics] = useState((saved && saved.demographics) || null);

  const totalR = CASES.reduce((s,c)=>s+c.rubrics.length,0);
  const doneR  = CASES.slice(0,ci).reduce((s,c)=>s+c.rubrics.length,0)+ri;
  const curCase   = CASES[ci];
  const curRubric = curCase ? curCase.rubrics[ri] : null;

  // ── Autosave to localStorage on every state change ──────────────────────
  React.useEffect(() => {
    if (step === "consent") return; // don't save before they start
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({lang,step,ci,ri,partAData,partADraft,partBDraft,responses,demographics}));
    } catch(e) {}
  }, [lang, step, ci, ri, partAData, responses, demographics]);

  const goPartB = useCallback((aData)=>{ setPartAData(aData); setStep("partB"); scrollTop(); },[]);
  const goBack = useCallback(()=>{
    // If on partA of a non-first rubric, go to partB of previous rubric
    if(ri > 0){ setRi(ri-1); setStep("partB"); scrollTop(); }
    else if(ci > 0){ setCi(ci-1); setRi(CASES[ci-1].rubrics.length-1); setStep("partB"); scrollTop(); }
    else { setStep("instr"); scrollTop(); }
  },[ci,ri]);
  const submitRubric = useCallback((id,data)=>{
    setResponses(r=>({...r,[id]:data}));
    setPartADraft(d=>{ const n={...d}; delete n[id]; return n; });
    setPartBDraft(d=>{ const n={...d}; delete n[id]; return n; });
    const nr=ri+1;
    if(nr<curCase.rubrics.length){ setRi(nr); setStep("partA"); }
    else { const nc=ci+1; if(nc<CASES.length){setCi(nc);setRi(0);setStep("partA");}else setStep("done"); }
    scrollTop();
  },[ci,ri,curCase]);

  const breadcrumb = (step==="partA"||step==="partB") && curCase && curRubric
    ? h('span',null,
        T("Case "+(ci+1)+" of "+CASES.length,
          "사례 "+(ci+1)+"/"+CASES.length, lang),
        h('span',{style:{margin:"0 6px",color:muted}},"›"),
        h('strong',{style:{fontWeight:700}},
          T("Rubric "+(ri+1)+" of "+curCase.rubrics.length,
            "기준표 "+(ri+1)+"/"+curCase.rubrics.length, lang)))
    : null;

  // Track which cases have had their vignette auto-shown
  const seenCasesRef = React.useRef(new Set());
  const [showVigModal, setShowVigModal] = React.useState(false);

  // Auto-open modal for first rubric of each new case (mobile only)
  React.useEffect(()=>{
    if(typeof window !== 'undefined' && window.innerWidth < 768) {
      if(!seenCasesRef.current.has(ci)) {
        seenCasesRef.current.add(ci);
        setShowVigModal(true);
      }
    }
  }, [ci]);

  const [isMobile, setIsMobile] = useState(false); // set after mount via useEffect
  React.useEffect(() => {
    // Set initial value after mount (safe - window is available)
    setIsMobile(window.innerWidth < 768);
    const onResize = () => setIsMobile(window.innerWidth < 768);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  // SL: layout shell — rendered inline (NOT as a nested component) to avoid remount
  const slStyle = {maxWidth:1140, margin:"0 auto",
    padding: isMobile ? "12px 14px 100px" : "28px 24px 80px",
    display:"flex", gap:24, alignItems:"flex-start"};

  return h(LangCtx.Provider,{value:lang},
    h('div',{style:{background:pageBg,minHeight:"100vh",fontFamily:ffs}},
      // TEST MODE indicator — shown only for TEST- pids (data excluded at analysis)
      isTest && h('div',{style:{position:"fixed",bottom:12,left:12,zIndex:1000,
        background:"#b91c1c",color:"#fff",padding:"6px 12px",borderRadius:8,fontSize:12,
        fontWeight:700,fontFamily:ffs,boxShadow:"0 2px 10px rgba(0,0,0,0.3)"}},
        "TEST MODE · "+pid),
      // Mobile floating "View Case" button — shown when modal is closed and on mobile
      isMobile && curCase && !showVigModal && step !== "done" && step !== "welcome" && step !== "instr" && step !== "consent" && step !== "demographics" &&
        h('div',{style:{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",zIndex:500}},
          h('button',{
            onClick:()=>setShowVigModal(true),
            style:{background:navy,color:white,border:"none",borderRadius:20,
                   padding:"10px 20px",fontSize:13,fontWeight:600,cursor:"pointer",
                   boxShadow:"0 4px 16px rgba(0,0,0,0.25)",display:"flex",
                   alignItems:"center",gap:6}},
            "📋 ", T("View Case","증례 보기",lang)
          )
        ),
      h(StickyHeader,{lang,setLang,doneR,totalR,breadcrumb}),
      step==="consent" && h(ConsentScreen,{onAgree:()=>{setStep("demographics");scrollTop();}}),
      step==="demographics" && h(DemographicsScreen,{
        initialData: demographics,
        onContinue:(d)=>{setDemographics(d);setStep("instr");scrollTop();}}),
      step==="instr"   && h(InstrScreen,{
        onStart:()=>{setStep("partA");scrollTop();},
        onBack:()=>{setStep("demographics");scrollTop();}}),
      step==="partA" && curRubric && h('div',{style:slStyle},
        !isMobile && h(VignetteSidebar,{caseData:curCase}),
        isMobile && showVigModal && curCase && h(VignetteModal,{caseData:curCase, onClose:()=>setShowVigModal(false), onGoBack: (ci===0&&ri===0) ? ()=>{setShowVigModal(false);setStep('instr');scrollTop();} : null, lang, setLang}),
        h(PartAScreen,{key:"A-"+curRubric.id,caseData:curCase,rubric:curRubric,
          ci,ri,onNext:goPartB,onBack:goBack,
          draftAnswers:partADraft[curRubric.id]||(responses[curRubric.id]?{answers:responses[curRubric.id].partA||{},comments:responses[curRubric.id].comments||{}}:null)||{},
          onDraftChange:(data)=>setPartADraft(d=>({...d,[curRubric.id]:data}))})),
      step==="partB" && curRubric && h('div',{style:slStyle},
        !isMobile && h(VignetteSidebar,{caseData:curCase}),
        isMobile && showVigModal && curCase && h(VignetteModal,{caseData:curCase, onClose:()=>setShowVigModal(false), onGoBack: (ci===0&&ri===0) ? ()=>{setShowVigModal(false);setStep('instr');scrollTop();} : null, lang, setLang}),
        h(PartBScreen,{key:"B-"+curRubric.id,caseData:curCase,rubric:curRubric,
          ci,ri,isLast:doneR+1>=totalR,onSubmit:submitRubric,partAData,onBack:()=>{setStep("partA");scrollTop();},
          bDraft:partBDraft[curRubric.id]||(responses[curRubric.id]?{d1Order:responses[curRubric.id].d1Order,d2Order:responses[curRubric.id].d2Order,finalCmt:responses[curRubric.id].finalCmt||''}:null),
          onBDraftChange:(d1,d2,cmt)=>setPartBDraft(d=>({...d,[curRubric.id]:{d1Order:d1,d2Order:d2,finalCmt:cmt}}))})),
      step==="done" && h(DoneScreen,{responses,demographics,pid,onBack:()=>{setStep("partB");scrollTop();}})
    )
  );
}

window.addEventListener('load', function() {
  try {
    var app = React.createElement(ErrorBoundary, null, React.createElement(App));
    ReactDOM.createRoot(document.getElementById('root')).render(app);
  } catch(e) {
    document.getElementById('root').innerHTML = '<div style="padding:20px;font-family:monospace;font-size:12px;color:#c00;background:#fff;border:2px solid #c00;margin:20px;border-radius:8px"><b>Mount Error</b><br>' + e.message + '</div>';
  }
});
</script></body></html>
